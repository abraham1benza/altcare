<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Importar · altcare</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<script type="module" src="../assets/js/firebase-init.js"></script>
<script src="../assets/js/module-init-v2.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/currency.js"></script>
<script src="../assets/js/tax.js"></script>
<script src="../assets/js/inventory.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
moduleInit('importar').then(async (ok) => {
if (!ok) return;

let activeTab = 'pt';     // pt | clientes | proveedores
let csvText = '';
let parsedRows = [];
let parseErrors = [];
let importing = false;

const IMPORTERS = {
  pt: {
    label: 'Producto Terminado',
    icon: '📦',
    description: 'Cargá lotes iniciales de PT con stock, costos y precios. Si no tienen fórmula vinculada, podés conectarla después.',
    example: `producto,cantidad,unidad,costo_usd,precio_distribuidor,precio_peluqueria
TINTE 1.0 NEGRO 60gr,713,unidad,1.50,6.4745,7.70
TINTE 1.1 AZABACHE 60gr,78,unidad,1.50,6.4745,7.70`,
    columnsHelp: '<strong>producto</strong>: nombre (obligatorio) · <strong>cantidad</strong>: stock inicial · <strong>unidad</strong>: medida · <strong>costo_usd</strong>: costo unitario · <strong>precio_distribuidor</strong> y <strong>precio_peluqueria</strong>: precios de venta'
  },
  clientes: {
    label: 'Clientes',
    icon: '👥',
    description: 'Cargá tu cartera de clientes con datos fiscales, contacto, vendedor asignado.',
    example: `nombre,rif,contacto,tipo,direccion,telefono,email,vendedor
DISTRIBUIDORA EJEMPLO C.A,J-12345678-9,JUAN PÉREZ,Distribuidor,AV PRINCIPAL CARACAS,0414-1234567,info@ejemplo.com,MIRIAM MATA`,
    columnsHelp: '<strong>nombre</strong> y <strong>rif</strong> son obligatorios · <strong>tipo</strong>: Mayorista/Distribuidor/Salón de belleza/Tienda/Particular · <strong>vendedor</strong>: nombre del usuario asignado'
  },
  proveedores: {
    label: 'Proveedores',
    icon: '🚚',
    description: 'Cargá tus proveedores con datos fiscales y contacto.',
    example: `nombre,rif,contacto,direccion,telefono,email
PROVEEDOR EJEMPLO,J-87654321-0,MARIA GOMEZ,AV BOLIVAR VALENCIA,0241-1234567,proveedor@ejemplo.com`,
    columnsHelp: '<strong>nombre</strong> y <strong>rif</strong> son obligatorios. El resto opcional.'
  }
};

function setTab(tab) {
  activeTab = tab;
  csvText = '';
  parsedRows = [];
  parseErrors = [];
  render();
}

function render() {
  const config = IMPORTERS[activeTab];
  ui.renderLayout({
    activeModule: 'importar',
    pageEyebrow: 'Sistema',
    pageTitle: 'Importar',
    contentHtml: `
      <h2 style="margin:0 0 8px;font-family:var(--font-display);font-size:24px;font-weight:500;letter-spacing:-0.02em;">Importación masiva</h2>
      <p class="text-muted mb-24" style="font-size:13px;line-height:1.5;">
        Cargá datos masivos al sistema desde un archivo CSV. Cada pestaña tiene su formato específico.
      </p>

      <div style="display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border);">
        ${Object.entries(IMPORTERS).map(([key, c]) => `
          <button onclick="setTab('${key}')" style="padding:10px 18px;background:${activeTab===key?'var(--surface)':'transparent'};border:1px solid ${activeTab===key?'var(--border)':'transparent'};border-bottom:${activeTab===key?'1px solid var(--surface)':'none'};border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;font-weight:${activeTab===key?'600':'400'};color:${activeTab===key?'var(--accent-ink)':'var(--ink-2)'};margin-bottom:-1px;">
            ${c.icon} ${c.label}
          </button>
        `).join('')}
      </div>

      <p class="text-muted mb-24" style="font-size:13px;line-height:1.5;">${config.description}</p>

      <div class="card mb-24" style="padding:14px 18px;background:#f0f9ff;border-color:#bae6fd;">
        <div style="font-weight:600;font-size:13px;color:#0369a1;margin-bottom:8px;">📋 Formato esperado</div>
        <pre style="font-family:var(--font-mono);font-size:11.5px;background:white;padding:10px;border-radius:6px;border:1px solid var(--border);overflow-x:auto;margin:0;white-space:pre-wrap;">${ui.escape(config.example)}</pre>
        <div class="text-muted" style="font-size:11px;margin-top:8px;">${config.columnsHelp}</div>
      </div>

      <!-- Opción 1: Subir Excel (recomendado) -->
      <div class="card mb-24" style="background:#ecfdf5;border:1px solid #6ee7b7;">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <div style="flex:1;min-width:240px;">
            <div style="font-weight:600;font-size:14px;color:#065f46;margin-bottom:4px;">📁 Subir archivo Excel (recomendado)</div>
            <div class="text-muted" style="font-size:12px;line-height:1.5;">
              ${activeTab === 'clientes' ? 'Soporta archivos exportados desde Profit Plus o cualquier Excel con columnas estándar.' : ''}
              ${activeTab === 'pt' ? 'Excel con columnas: producto, cantidad, costo, precios.' : ''}
              ${activeTab === 'proveedores' ? 'Excel con columnas: nombre, RIF, contacto, dirección, teléfono, email.' : ''}
              Detección automática de encabezados.
            </div>
          </div>
          <label class="btn btn-primary" style="cursor:pointer;">
            ${ui.icon('upload')||'📁'} Seleccionar archivo .xlsx
            <input type="file" accept=".xlsx,.xls" style="display:none;" onchange="onExcelFileChange(event)">
          </label>
        </div>
      </div>

      <!-- Opción 2: Pegar CSV (alternativa) -->
      <details class="card mb-24" style="padding:0;">
        <summary style="padding:14px 18px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2);">
          O pegar CSV manualmente (alternativa)
        </summary>
        <div style="padding:0 18px 18px 18px;">
          <textarea id="csv-input" class="textarea" rows="10" style="font-family:var(--font-mono);font-size:12px;" placeholder="Pegá tu CSV (con o sin encabezados)..." oninput="onCsvChange(this.value)">${ui.escape(csvText)}</textarea>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="btn btn-secondary" onclick="parseCsv()">${ui.icon('check')||'✓'} Validar CSV</button>
            <button class="btn btn-ghost" onclick="clearCsv()">Limpiar</button>
          </div>
        </div>
      </details>

      ${parsedRows.length > 0 ? renderPreview() : ''}
      ${parseErrors.length > 0 ? renderErrors() : ''}
    `
  });
}

function renderPreview() {
  if (activeTab === 'pt') return renderPreviewPT();
  if (activeTab === 'clientes') return renderPreviewClientes();
  if (activeTab === 'proveedores') return renderPreviewProveedores();
  return '';
}

function renderPreviewPT() {
  const validRows = parsedRows.filter(r => !r._error);
  const invalidRows = parsedRows.filter(r => r._error);
  const totalQty = validRows.reduce((s, r) => s + r.cantidad, 0);
  const totalValueUSD = validRows.reduce((s, r) => s + (r.cantidad * r.costo_usd), 0);

  return `
    <div class="card mb-24" style="padding:0;">
      <div style="padding:14px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg, var(--accent-soft) 0%, transparent 100%);display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="card-title">📦 Vista previa de productos</div>
          <div class="text-muted" style="font-size:12px;margin-top:2px;">
            ${validRows.length} válidos${invalidRows.length > 0 ? ` · <span style="color:var(--danger);">${invalidRows.length} con errores</span>` : ''}
          </div>
        </div>
        <div style="text-align:right;font-size:11px;">
          <div><strong>${totalQty.toLocaleString('es-VE')}</strong> unidades</div>
          <div class="text-muted">Valor a costo: ${currency.format(totalValueUSD,'USD')}</div>
        </div>
      </div>
      <div class="table-wrap" style="border-radius:0;max-height:500px;overflow-y:auto;">
        <table style="font-size:12px;">
          <thead style="position:sticky;top:0;background:var(--surface);z-index:1;">
            <tr><th>#</th><th>Producto</th><th style="text-align:right;">Cantidad</th><th>Unidad</th><th style="text-align:right;">Costo</th><th style="text-align:right;">P.Dist</th><th style="text-align:right;">P.Pelq</th><th>Estado</th></tr>
          </thead>
          <tbody>${parsedRows.map((r, idx) => {
            if (r._error) return `<tr style="background:#fee2e2;"><td>${idx+1}</td><td colspan="6"><span style="color:var(--danger);font-size:11.5px;">${ui.escape(r._error)}</span></td><td><span class="badge badge-danger" style="font-size:9.5px;">Error</span></td></tr>`;
            return `<tr>
              <td>${idx+1}</td>
              <td><span class="td-strong">${ui.escape(r.producto)}</span></td>
              <td style="text-align:right;"><span class="td-mono">${r.cantidad.toLocaleString('es-VE')}</span></td>
              <td>${r.unidad}</td>
              <td style="text-align:right;"><span class="td-mono">${currency.format(r.costo_usd,'USD')}</span></td>
              <td style="text-align:right;"><span class="td-mono">${currency.format(r.precio_distribuidor,'USD')}</span></td>
              <td style="text-align:right;"><span class="td-mono">${currency.format(r.precio_peluqueria,'USD')}</span></td>
              <td><span class="badge badge-paid" style="font-size:9.5px;">✓</span></td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
      ${renderImportButton(validRows)}
    </div>
  `;
}

function renderPreviewClientes() {
  const validRows = parsedRows.filter(r => !r._error);
  const invalidRows = parsedRows.filter(r => r._error);
  const tipos = {};
  validRows.forEach(r => { tipos[r.tipo] = (tipos[r.tipo]||0) + 1; });
  const tiposStr = Object.entries(tipos).map(([t,n]) => `${t}: ${n}`).join(' · ');
  const dupCount = validRows.filter(r => r._duplicate).length;

  return `
    <div class="card mb-24" style="padding:0;">
      <div style="padding:14px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg, var(--accent-soft) 0%, transparent 100%);">
        <div class="card-title">👥 Vista previa de clientes</div>
        <div class="text-muted" style="font-size:12px;margin-top:2px;">
          ${validRows.length} válidos${dupCount > 0 ? ` · <span style="color:#92400e;">${dupCount} duplicados (se omitirán)</span>` : ''}${invalidRows.length > 0 ? ` · <span style="color:var(--danger);">${invalidRows.length} con errores</span>` : ''}
        </div>
        ${tiposStr ? `<div class="text-muted" style="font-size:11px;margin-top:6px;">${tiposStr}</div>` : ''}
      </div>
      <div class="table-wrap" style="border-radius:0;max-height:500px;overflow-y:auto;">
        <table style="font-size:12px;">
          <thead style="position:sticky;top:0;background:var(--surface);z-index:1;">
            <tr><th>#</th><th>Nombre</th><th>RIF</th><th>Tipo</th><th>Contacto</th><th>Teléfono</th><th>Vendedor</th><th>Estado</th></tr>
          </thead>
          <tbody>${parsedRows.map((r, idx) => {
            if (r._error) return `<tr style="background:#fee2e2;"><td>${idx+1}</td><td colspan="6"><span style="color:var(--danger);font-size:11.5px;">${ui.escape(r._error)}</span></td><td><span class="badge badge-danger" style="font-size:9.5px;">Error</span></td></tr>`;
            return `<tr>
              <td>${idx+1}</td>
              <td><span class="td-strong">${ui.escape(r.nombre)}</span>${r.direccion?`<div class="text-muted" style="font-size:10px;">${ui.escape(r.direccion.substring(0,60))}${r.direccion.length>60?'…':''}</div>`:''}</td>
              <td><span class="td-mono" style="font-size:11px;">${ui.escape(r.rif)}</span></td>
              <td><span class="badge badge-plain" style="font-size:10px;">${ui.escape(r.tipo)}</span></td>
              <td>${ui.escape(r.contacto||'—')}</td>
              <td><span style="font-size:11px;">${ui.escape(r.telefono||'—')}</span></td>
              <td><span class="text-muted" style="font-size:11px;">${ui.escape(r.vendedor||'—')}</span></td>
              <td><span class="badge ${r._duplicate ? 'badge-warning' : 'badge-paid'}" style="font-size:9.5px;">${r._duplicate ? '⚠ Dup' : '✓'}</span></td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
      ${renderImportButton(validRows)}
    </div>
  `;
}

function renderPreviewProveedores() {
  const validRows = parsedRows.filter(r => !r._error);
  const invalidRows = parsedRows.filter(r => r._error);
  const dupCount = validRows.filter(r => r._duplicate).length;

  return `
    <div class="card mb-24" style="padding:0;">
      <div style="padding:14px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg, var(--accent-soft) 0%, transparent 100%);">
        <div class="card-title">🚚 Vista previa de proveedores</div>
        <div class="text-muted" style="font-size:12px;margin-top:2px;">
          ${validRows.length} válidos${dupCount > 0 ? ` · <span style="color:#92400e;">${dupCount} duplicados</span>` : ''}${invalidRows.length > 0 ? ` · <span style="color:var(--danger);">${invalidRows.length} con errores</span>` : ''}
        </div>
      </div>
      <div class="table-wrap" style="border-radius:0;max-height:500px;overflow-y:auto;">
        <table style="font-size:12px;">
          <thead style="position:sticky;top:0;background:var(--surface);z-index:1;">
            <tr><th>#</th><th>Nombre</th><th>RIF</th><th>Contacto</th><th>Teléfono</th><th>Email</th><th>Estado</th></tr>
          </thead>
          <tbody>${parsedRows.map((r, idx) => {
            if (r._error) return `<tr style="background:#fee2e2;"><td>${idx+1}</td><td colspan="5"><span style="color:var(--danger);font-size:11.5px;">${ui.escape(r._error)}</span></td><td><span class="badge badge-danger" style="font-size:9.5px;">Error</span></td></tr>`;
            return `<tr>
              <td>${idx+1}</td>
              <td><span class="td-strong">${ui.escape(r.nombre)}</span></td>
              <td><span class="td-mono" style="font-size:11px;">${ui.escape(r.rif)}</span></td>
              <td>${ui.escape(r.contacto||'—')}</td>
              <td><span style="font-size:11px;">${ui.escape(r.telefono||'—')}</span></td>
              <td><span style="font-size:11px;">${ui.escape(r.email||'—')}</span></td>
              <td><span class="badge ${r._duplicate ? 'badge-warning' : 'badge-paid'}" style="font-size:9.5px;">${r._duplicate ? '⚠ Dup' : '✓'}</span></td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
      ${renderImportButton(validRows)}
    </div>
  `;
}

function renderImportButton(validRows) {
  const config = IMPORTERS[activeTab];
  const newCount = validRows.filter(r => !r._duplicate).length;
  return `
    <div style="padding:14px 20px;border-top:1px solid var(--border);background:var(--surface-2);">
      ${newCount > 0 ? `
        <button class="btn btn-primary" onclick="confirmImport()" ${importing?'disabled':''}>
          ${importing ? '⏳ Importando...' : `${config.icon} Importar ${newCount} ${config.label.toLowerCase()}`}
        </button>
        <span class="text-muted" style="font-size:11.5px;margin-left:12px;">
          ${activeTab === 'pt' ? 'Se crearán como lotes LIBERADOS.' : 'Los duplicados (mismo RIF) se omitirán.'}
        </span>
      ` : `<span class="text-muted">No hay registros nuevos para importar.</span>`}
    </div>
  `;
}

function renderErrors() {
  return `<div class="card mb-24" style="background:#fee2e2;border-color:#fca5a5;">
    <div style="font-weight:600;color:#991b1b;margin-bottom:8px;">⚠️ Errores</div>
    <ul style="margin:0;padding-left:18px;font-size:12px;color:#7f1d1d;">
      ${parseErrors.map(e => `<li>${ui.escape(e)}</li>`).join('')}
    </ul>
  </div>`;
}

function onCsvChange(val) { csvText = val; }

function clearCsv() {
  csvText = '';
  parsedRows = [];
  parseErrors = [];
  render();
}

function parseCsv() {
  parsedRows = [];
  parseErrors = [];
  if (!csvText.trim()) { ui.toast('Pegá un CSV primero', 'error'); return; }

  const lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(l => l);
  if (lines.length === 0) { parseErrors.push('CSV vacío'); render(); return; }

  const headerKeywords = activeTab === 'pt' ? ['producto','cantidad'] : activeTab === 'clientes' ? ['nombre','rif','tipo'] : ['nombre','rif'];
  const firstLine = lines[0].toLowerCase();
  const hasHeader = headerKeywords.some(k => firstLine.includes(k));
  const dataLines = hasHeader ? lines.slice(1) : lines;

  if (dataLines.length === 0) { parseErrors.push('No hay filas de datos'); render(); return; }

  if (activeTab === 'pt') parsePtRows(dataLines, hasHeader);
  else if (activeTab === 'clientes') parseClientesRows(dataLines, hasHeader);
  else if (activeTab === 'proveedores') parseProveedoresRows(dataLines, hasHeader);

  const validCount = parsedRows.filter(r => !r._error && !r._duplicate).length;
  if (validCount > 0) {
    ui.toast(`${validCount} registro${validCount!==1?'s':''} listo${validCount!==1?'s':''}`, 'success');
  } else {
    ui.toast('No hay registros nuevos válidos', 'error');
  }
  render();
}

function parsePtRows(dataLines, hasHeader) {
  dataLines.forEach((line, i) => {
    const lineNum = (hasHeader ? i + 2 : i + 1);
    const cols = parseCsvLine(line);
    if (cols.length < 2) { parsedRows.push({ _error: `Línea ${lineNum}: pocas columnas` }); return; }

    const producto = (cols[0] || '').trim();
    const cantidad = parseFloat((cols[1] || '').trim().replace(/\./g,'').replace(',','.'));
    const unidad = (cols[2] || 'unidad').trim() || 'unidad';
    const costo_usd = parseFloat((cols[3] || '0').trim().replace(',','.')) || 0;
    const precio_distribuidor = parseFloat((cols[4] || '0').trim().replace(',','.')) || 0;
    const precio_peluqueria = parseFloat((cols[5] || '0').trim().replace(',','.')) || 0;

    if (!producto) { parsedRows.push({ _error: `Línea ${lineNum}: producto vacío` }); return; }
    if (isNaN(cantidad) || cantidad < 0) { parsedRows.push({ _error: `Línea ${lineNum}: cantidad inválida en "${producto}"` }); return; }

    parsedRows.push({ producto, cantidad, unidad, costo_usd, precio_distribuidor, precio_peluqueria });
  });
}

function parseClientesRows(dataLines, hasHeader) {
  const existingRifs = new Set(db.getAll(db.COLLECTIONS.customers).map(c => normalizeRif(c.rif)));
  const seenRifs = new Set();

  dataLines.forEach((line, i) => {
    const lineNum = (hasHeader ? i + 2 : i + 1);
    const cols = parseCsvLine(line);
    if (cols.length < 2) { parsedRows.push({ _error: `Línea ${lineNum}: pocas columnas` }); return; }

    const nombre = (cols[0] || '').trim();
    const rif = (cols[1] || '').trim();
    const contacto = (cols[2] || '').trim();
    const tipo = mapClientType((cols[3] || '').trim());
    const direccion = (cols[4] || '').trim();
    const telefono = (cols[5] || '').trim();
    const email = (cols[6] || '').trim();
    const vendedor = (cols[7] || '').trim();

    if (!nombre) { parsedRows.push({ _error: `Línea ${lineNum}: nombre vacío` }); return; }
    if (!rif) { parsedRows.push({ _error: `Línea ${lineNum}: RIF vacío en "${nombre}"` }); return; }

    const normRif = normalizeRif(rif);
    const isDuplicate = existingRifs.has(normRif) || seenRifs.has(normRif);
    seenRifs.add(normRif);

    parsedRows.push({ nombre, rif, contacto, tipo, direccion, telefono, email, vendedor, _duplicate: isDuplicate });
  });
}

function parseProveedoresRows(dataLines, hasHeader) {
  const existingRifs = new Set(db.getAll(db.COLLECTIONS.suppliers).map(s => normalizeRif(s.rif)));
  const seenRifs = new Set();

  dataLines.forEach((line, i) => {
    const lineNum = (hasHeader ? i + 2 : i + 1);
    const cols = parseCsvLine(line);
    if (cols.length < 2) { parsedRows.push({ _error: `Línea ${lineNum}: pocas columnas` }); return; }

    const nombre = (cols[0] || '').trim();
    const rif = (cols[1] || '').trim();
    const contacto = (cols[2] || '').trim();
    const direccion = (cols[3] || '').trim();
    const telefono = (cols[4] || '').trim();
    const email = (cols[5] || '').trim();

    if (!nombre) { parsedRows.push({ _error: `Línea ${lineNum}: nombre vacío` }); return; }
    if (!rif) { parsedRows.push({ _error: `Línea ${lineNum}: RIF vacío en "${nombre}"` }); return; }

    const normRif = normalizeRif(rif);
    const isDuplicate = existingRifs.has(normRif) || seenRifs.has(normRif);
    seenRifs.add(normRif);

    parsedRows.push({ nombre, rif, contacto, direccion, telefono, email, _duplicate: isDuplicate });
  });
}

// =============================================================================
// PARSEO DE EXCEL (XLSX)
// =============================================================================

function onExcelFileChange(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') {
    ui.toast('Esperá un momento, la librería XLSX se está cargando...', 'info');
    setTimeout(() => onExcelFileChange(event), 1000);
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      // Tomar primera hoja con datos
      let sheet = null;
      for (const sheetName of wb.SheetNames) {
        const s = wb.Sheets[sheetName];
        const range = XLSX.utils.decode_range(s['!ref'] || 'A1');
        if (range.e.r > 0) { sheet = s; break; }
      }
      if (!sheet) {
        ui.toast('El archivo no tiene hojas con datos', 'error');
        return;
      }
      // Convertir a array de arrays (sin header — lo detectamos manualmente)
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
      processExcelRows(rows);
    } catch (err) {
      ui.toast('Error leyendo Excel: ' + err.message, 'error');
      console.error(err);
    }
  };
  reader.onerror = () => ui.toast('Error al leer el archivo', 'error');
  reader.readAsArrayBuffer(file);

  // Reset input para permitir re-subir el mismo archivo
  event.target.value = '';
}

/**
 * Detecta el header en las primeras 15 filas del Excel y lo mapea a campos.
 * Soporta:
 *  - Profit Plus exports (header en fila ~10-11)
 *  - Excel simple con header en fila 1
 *  - Variaciones de nombres de columna
 */
function processExcelRows(rows) {
  parsedRows = [];
  parseErrors = [];

  if (!rows || rows.length === 0) {
    parseErrors.push('Archivo vacío');
    render();
    return;
  }

  // Detectar fila de header (la que tiene mayor # de keywords esperadas)
  const expectedKeywords = activeTab === 'pt'
    ? ['producto','descripcion','cantidad','unidad','costo','precio']
    : activeTab === 'clientes'
    ? ['nombre','descripcion','rif','tipo','direc','telefono','vendedor','email']
    : ['nombre','descripcion','rif','direc','telefono','email'];

  let headerRowIdx = -1;
  let bestScore = 0;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const row = rows[i];
    if (!row) continue;
    const lower = row.map(c => String(c||'').toLowerCase().trim());
    const score = expectedKeywords.reduce((s, kw) => s + (lower.some(c => c.includes(kw)) ? 1 : 0), 0);
    if (score > bestScore) { bestScore = score; headerRowIdx = i; }
  }

  if (headerRowIdx < 0 || bestScore < 2) {
    parseErrors.push('No se encontró un encabezado válido en las primeras 20 filas. Verifica que el archivo tenga columnas como: ' + expectedKeywords.join(', '));
    render();
    return;
  }

  const headers = (rows[headerRowIdx] || []).map(c => String(c||'').trim());
  const dataRows = rows.slice(headerRowIdx + 1).filter(r => r && r.some(c => String(c||'').trim() !== ''));

  if (dataRows.length === 0) {
    parseErrors.push('Sin filas de datos después del encabezado');
    render();
    return;
  }

  // Mapeo de columnas según tab
  const colMap = mapHeaders(headers, activeTab);

  if (activeTab === 'pt') parseExcelPt(dataRows, colMap);
  else if (activeTab === 'clientes') parseExcelClientes(dataRows, colMap);
  else if (activeTab === 'proveedores') parseExcelProveedores(dataRows, colMap);

  const validCount = parsedRows.filter(r => !r._error && !r._duplicate).length;
  const dupCount = parsedRows.filter(r => r._duplicate).length;
  const errCount = parsedRows.filter(r => r._error).length;

  if (validCount > 0 || dupCount > 0) {
    let msg = `Excel leído: ${validCount} nuevos`;
    if (dupCount > 0) msg += `, ${dupCount} duplicados (se omitirán)`;
    if (errCount > 0) msg += `, ${errCount} con errores`;
    ui.toast(msg, validCount > 0 ? 'success' : 'info', 5000);
  } else {
    ui.toast('No se pudieron extraer registros válidos del Excel', 'error');
  }
  render();
}

/** Mapea los headers del Excel a las claves estándar del importador */
function mapHeaders(headers, tab) {
  const map = {};
  headers.forEach((h, idx) => {
    const lower = String(h||'').toLowerCase().trim();
    if (!lower) return;

    if (tab === 'pt') {
      if (/^(producto|descripcion|description|item|nombre)/.test(lower)) map.producto = idx;
      else if (/^(cantidad|qty|stock|unds|unidades)/.test(lower)) map.cantidad = idx;
      else if (/^(unidad|unit|um)$/.test(lower)) map.unidad = idx;
      else if (/costo|cost/.test(lower)) map.costo = idx;
      else if (/precio.*(distribu|dist)/.test(lower)) map.precio_dist = idx;
      else if (/precio.*(peluq|pelq|salon)/.test(lower)) map.precio_pelu = idx;
      else if (/^precio$/.test(lower) && map.precio_dist === undefined) map.precio_dist = idx;
    }
    else if (tab === 'clientes' || tab === 'proveedores') {
      if (/^(nombre|descripcion|description|razon|cliente|proveedor)/.test(lower)) map.nombre = idx;
      else if (/^rif|cedula|rfc|nit/.test(lower)) map.rif = idx;
      else if (/^(responsable|contacto|contact)/.test(lower)) map.contacto = idx;
      else if (/^(des.?tipo|tipo|type|categoria|categor)/.test(lower)) map.tipo = idx;
      else if (/^(dir.*fiscal|direc1|direccion fiscal)/.test(lower)) map.direccion = idx;
      else if (map.direccion === undefined && /^(direc|address|dir|domicilio)/.test(lower)) map.direccion = idx;
      else if (/^(telefono|tel|phone|tlf|telf)/.test(lower)) map.telefono = idx;
      else if (/^(email|correo|mail)/.test(lower)) map.email = idx;
      else if (/^(ven.?des|vendedor)/.test(lower) && !/codigo|cod/.test(lower)) map.vendedor = idx;
    }
  });
  return map;
}

function getCell(row, idx) {
  if (idx === undefined || idx < 0) return '';
  const v = row[idx];
  if (v == null) return '';
  return String(v).trim();
}

function parseExcelPt(dataRows, colMap) {
  dataRows.forEach((row, i) => {
    const lineNum = i + 1;
    const producto = getCell(row, colMap.producto);
    if (!producto || producto.toLowerCase().startsWith('codigo')) return; // skip header repetido o vacíos

    const cantidadStr = getCell(row, colMap.cantidad);
    const cantidad = parseFloat(cantidadStr.replace(/\./g,'').replace(',','.')) || 0;

    if (cantidad < 0) { parsedRows.push({ _error: `Fila ${lineNum}: cantidad negativa en "${producto}"` }); return; }

    const unidad = getCell(row, colMap.unidad) || 'unidad';
    const costo_usd = parseFloat(getCell(row, colMap.costo).replace(',','.')) || 0;
    const precio_distribuidor = parseFloat(getCell(row, colMap.precio_dist).replace(',','.')) || 0;
    const precio_peluqueria = parseFloat(getCell(row, colMap.precio_pelu).replace(',','.')) || 0;

    parsedRows.push({ producto, cantidad, unidad, costo_usd, precio_distribuidor, precio_peluqueria });
  });
}

function parseExcelClientes(dataRows, colMap) {
  const existingRifs = new Set(db.getAll(db.COLLECTIONS.customers).map(c => normalizeRif(c.rif)));
  const seenRifs = new Set();

  dataRows.forEach((row, i) => {
    const lineNum = i + 1;
    const nombre = getCell(row, colMap.nombre);
    if (!nombre || nombre.toLowerCase().startsWith('codigo') || nombre.toLowerCase() === 'descripcion') return;

    const rif = getCell(row, colMap.rif);
    const contacto = getCell(row, colMap.contacto);
    const tipoOrig = getCell(row, colMap.tipo);
    const tipo = mapClientType(tipoOrig);
    const direccion = getCell(row, colMap.direccion);
    const telefono = getCell(row, colMap.telefono);
    const email = getCell(row, colMap.email);
    let vendedor = getCell(row, colMap.vendedor);
    // Limpiar vendedor: "MIRIAM MATA  (Distribuidor)" → "MIRIAM MATA"
    if (vendedor && vendedor.includes('(')) vendedor = vendedor.split('(')[0].trim();

    if (!nombre) { parsedRows.push({ _error: `Fila ${lineNum}: nombre vacío` }); return; }
    if (!rif) { parsedRows.push({ _error: `Fila ${lineNum}: RIF vacío en "${nombre}"` }); return; }

    const normRif = normalizeRif(rif);
    const isDuplicate = existingRifs.has(normRif) || seenRifs.has(normRif);
    seenRifs.add(normRif);

    parsedRows.push({ nombre, rif, contacto, tipo, direccion, telefono, email, vendedor, _duplicate: isDuplicate });
  });
}

function parseExcelProveedores(dataRows, colMap) {
  const existingRifs = new Set(db.getAll(db.COLLECTIONS.suppliers).map(s => normalizeRif(s.rif)));
  const seenRifs = new Set();

  dataRows.forEach((row, i) => {
    const lineNum = i + 1;
    const nombre = getCell(row, colMap.nombre);
    if (!nombre || nombre.toLowerCase().startsWith('codigo') || nombre.toLowerCase() === 'descripcion') return;

    const rif = getCell(row, colMap.rif);
    const contacto = getCell(row, colMap.contacto);
    const direccion = getCell(row, colMap.direccion);
    const telefono = getCell(row, colMap.telefono);
    const email = getCell(row, colMap.email);

    if (!nombre) { parsedRows.push({ _error: `Fila ${lineNum}: nombre vacío` }); return; }
    if (!rif) { parsedRows.push({ _error: `Fila ${lineNum}: RIF vacío en "${nombre}"` }); return; }

    const normRif = normalizeRif(rif);
    const isDuplicate = existingRifs.has(normRif) || seenRifs.has(normRif);
    seenRifs.add(normRif);

    parsedRows.push({ nombre, rif, contacto, direccion, telefono, email, _duplicate: isDuplicate });
  });
}

function parseCsvLine(line) {
  const cols = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i+1] === '"') { current += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      cols.push(current);
      current = '';
    } else current += ch;
  }
  cols.push(current);
  return cols;
}

function normalizeRif(rif) {
  if (!rif) return '';
  return rif.toUpperCase().replace(/[\s\-]/g, '');
}

function mapClientType(t) {
  if (!t) return 'Distribuidor';
  const lower = t.toLowerCase();
  const valid = ['Mayorista','Distribuidor','Salón de belleza','Tienda','Particular','Marca privada'];
  if (valid.includes(t)) return t;
  if (lower.includes('salon') || lower.includes('salón')) return 'Salón de belleza';
  if (lower.includes('mayorista') || lower.includes('maxi')) return 'Mayorista';
  if (lower.includes('distribuidor')) return 'Distribuidor';
  if (lower.includes('tienda') || lower.includes('supermercado')) return 'Tienda';
  if (lower.includes('particular') || lower.includes('persona')) return 'Particular';
  return 'Distribuidor';
}

function confirmImport() {
  const validRows = parsedRows.filter(r => !r._error);
  const newCount = validRows.filter(r => !r._duplicate).length;
  if (newCount === 0) return;
  const config = IMPORTERS[activeTab];
  const dupCount = validRows.length - newCount;
  const msg = activeTab === 'pt'
    ? `¿Importar ${newCount} productos al inventario? Se crearán lotes PT LIBERADOS.`
    : `¿Importar ${newCount} ${config.label.toLowerCase()}? ${dupCount > 0 ? `(${dupCount} duplicados se omitirán)` : ''}`;
  ui.confirm(msg, () => doImport(validRows), { confirmLabel: 'Importar' });
}

async function doImport(rows) {
  importing = true;
  render();
  let success = 0, failed = 0, skipped = 0;
  const errors = [];

  for (const row of rows) {
    if (row._duplicate) { skipped++; continue; }
    try {
      if (activeTab === 'pt') {
        inventory.createInitialFGLot({
          productName: row.producto,
          quantity: row.cantidad,
          unit: row.unidad,
          unitCost: row.costo_usd,
          costCurrency: 'USD',
          priceDistributor: row.precio_distribuidor,
          pricePharmacy: row.precio_peluqueria,
          status: 'LIBERADO'
        });
      } else if (activeTab === 'clientes') {
        importCliente(row);
      } else if (activeTab === 'proveedores') {
        importProveedor(row);
      }
      success++;
    } catch (err) {
      failed++;
      errors.push(`${row.producto || row.nombre}: ${err.message}`);
    }
  }

  importing = false;

  if (failed === 0) {
    let msg = `✓ ${success} ${IMPORTERS[activeTab].label.toLowerCase()} importados`;
    if (skipped > 0) msg += ` (${skipped} duplicados omitidos)`;
    ui.toast(msg, 'success', 5000);
    csvText = ''; parsedRows = []; parseErrors = [];
    setTimeout(() => {
      const target = activeTab === 'pt' ? 'producto-terminado.html' : `${activeTab}.html`;
      window.location.href = target;
    }, 1500);
  } else {
    ui.toast(`${success} OK, ${failed} fallaron${skipped > 0 ? `, ${skipped} omitidos` : ''}`, 'error', 8000);
    parseErrors = errors;
    render();
  }
}

function importCliente(row) {
  const salesRepUserIds = [];
  let salesRepName = '';
  if (row.vendedor) {
    const users = db.getAll(db.COLLECTIONS.users);
    // Soportar múltiples vendedores separados por "/" o ","
    const parts = row.vendedor.split(/[\/,]/).map(s => s.trim()).filter(Boolean);
    const matchedNames = [];
    for (const part of parts) {
      const v = part.toLowerCase();
      const matched = users.find(u => {
        const fn = (u.fullName || '').toLowerCase();
        const un = (u.username || '').toLowerCase();
        return fn === v || un === v || (fn && fn.includes(v)) || (v && v.includes(fn) && fn);
      });
      if (matched && !salesRepUserIds.includes(matched.id)) {
        salesRepUserIds.push(matched.id);
        matchedNames.push(matched.fullName || matched.username);
      } else if (!matched) {
        // No se encontró usuario: dejamos el nombre como referencia para reparación posterior
        matchedNames.push(part);
      }
    }
    salesRepName = matchedNames.join(' / ');
  }

  const customer = {
    code: db.nextCode(db.COLLECTIONS.customers, 'C'),
    name: row.nombre,
    tradename: '',
    rif: row.rif,
    taxpayerType: 'Contribuyente Ordinario',
    address: row.direccion || '',
    shippingAddress: '',
    contactName: row.contacto || '',
    contactRole: '',
    phone: row.telefono || '',
    whatsapp: row.telefono || '',
    email: row.email || '',
    customerType: row.tipo,
    paymentTerms: '30 días',
    preferredCurrency: 'VES',
    creditLimit: 0,
    defaultDiscount: 0,
    salesRep: salesRepName,
    salesRepUserIds: salesRepUserIds,
    notes: 'Importado masivamente',
    creditBalance: 0,
    active: true
  };
  db.save(db.COLLECTIONS.customers, customer);
}

function importProveedor(row) {
  const supplier = {
    code: db.nextCode(db.COLLECTIONS.suppliers, 'P'),
    name: row.nombre,
    rif: row.rif,
    taxpayerType: 'Contribuyente Ordinario',
    address: row.direccion || '',
    contactName: row.contacto || '',
    contactRole: '',
    phone: row.telefono || '',
    whatsapp: row.telefono || '',
    email: row.email || '',
    paymentTerms: '30 días',
    preferredCurrency: 'VES',
    notes: 'Importado masivamente',
    active: true
  };
  db.save(db.COLLECTIONS.suppliers, supplier);
}

render();

Object.assign(window, {
  setTab, onCsvChange, clearCsv, parseCsv, confirmImport, onExcelFileChange
});

}); // end moduleInit
</script>
