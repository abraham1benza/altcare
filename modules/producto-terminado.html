<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto Terminado · altcare</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<script type="module" src="../assets/js/firebase-init.js"></script>
<script src="../assets/js/module-init-v2.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/currency.js"></script>
<script src="../assets/js/tax.js"></script>
<script src="../assets/js/inventory.js"></script>
<script src="../assets/js/formulas.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
moduleInit('producto-terminado').then(async (ok) => {
if (!ok) return;

const PT_STATUS = {
  CUARENTENA:    { label: 'Cuarentena',    color: 'badge-warning' },
  LIBERADO:      { label: 'Liberado',      color: 'badge-success' },
  OBSERVACIONES: { label: 'Con observaciones', color: 'badge-warning' },
  RECHAZADO:     { label: 'Rechazado',     color: 'badge-danger'  }
};

let statusFilter = '';
let searchTerm = '';

function render() {
  let lots = db.getAll(db.COLLECTIONS.finishedGoods).filter(l => l.active !== false);
  const all = lots;
  if (statusFilter) lots = lots.filter(l => l.status === statusFilter);
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    lots = lots.filter(l => (l.code||'').toLowerCase().includes(q) || (l.formulaName||l.productName||'').toLowerCase().includes(q));
  }
  lots.sort((a,b) => (b.manufactureDate||'').localeCompare(a.manufactureDate||''));

  const warehouses = db.getAll(db.COLLECTIONS.warehouses);
  const whMap = Object.fromEntries(warehouses.map(w => [w.id, w.name]));
  const today = new Date().toISOString().slice(0,10);

  // KPIs
  const counts = {
    cuarentena: all.filter(l => l.status==='CUARENTENA').length,
    liberado: all.filter(l => l.status==='LIBERADO').length,
    rechazado: all.filter(l => l.status==='RECHAZADO').length
  };
  const totalAvailable = all.filter(l => l.status==='LIBERADO').reduce((s,l) => s + (l.balance||0), 0);
  const totalValueUSD = all.filter(l => l.balance>0).reduce((s,l) => s + (l.balance * (l.unitCost||0)), 0);

  // Valor solo visible en modo Gerencial
  const isGerencialMode = (typeof auth !== 'undefined' && auth.getActiveMode && auth.getActiveMode() === 'gerencial');

  const tableHtml = lots.length ? `<table>
    <thead><tr><th>Lote</th><th>Fórmula</th><th>OF</th><th>Fabricado</th><th>Vence</th><th style="text-align:right;">Cantidad</th><th>Almacén</th><th>Estado</th>${isGerencialMode ? '<th style="text-align:right;">Valor</th>' : ''}<th style="text-align:right;width:120px;">Acciones</th></tr></thead>
    <tbody>${lots.map(l => {
      const s = PT_STATUS[l.status] || { label: l.status, color: 'badge-plain' };
      const days = l.expiryDate ? Math.round((new Date(l.expiryDate) - new Date(today)) / 86400000) : null;
      const expClass = days !== null && days < 30 ? 'badge-danger' : days !== null && days < 90 ? 'badge-warning' : 'badge-plain';
      return `<tr>
        <td><span class="td-mono td-strong">${ui.escape(l.code)}</span>${l.isInitialLoad ? `<div class="text-muted" style="font-size:10px;">📥 Carga inicial</div>` : ''}</td>
        <td>
          ${l.formulaId
            ? ui.escape(l.formulaName||'—')
            : `<div>${ui.escape(l.productName || l.formulaName || '—')}</div><span class="badge ${l.isInitialLoad ? 'badge-plain' : 'badge-warning'}" style="font-size:9.5px;">${l.isInitialLoad ? '📦 Sin fabricación' : '⚠️ Sin fórmula'}</span>`
          }
        </td>
        <td><span class="td-mono">${ui.escape(l.productionOrderCode||'—')}</span></td>
        <td><span class="text-muted">${ui.formatDate(l.manufactureDate)}</span></td>
        <td>${l.expiryDate ? `<span class="badge ${expClass}">${ui.formatDate(l.expiryDate)}${days !== null ? ` · ${days}d` : ''}</span>` : '<span class="td-muted">—</span>'}</td>
        <td style="text-align:right;">
          <span class="td-mono td-strong">${(l.balance||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:3})}</span>
          <span class="text-muted">${l.unit}</span>
          ${(l.minStock || 0) > 0 && (l.balance || 0) <= (l.minStock || 0) && (l.balance || 0) > 0
            ? `<div style="font-size:10px;color:var(--warning);font-weight:600;margin-top:2px;">⚠ Stock bajo (mín: ${l.minStock})</div>`
            : (l.minStock || 0) > 0 && (l.balance || 0) === 0
              ? `<div style="font-size:10px;color:var(--danger);font-weight:600;margin-top:2px;">✕ Sin stock</div>`
              : ''}
        </td>
        <td><span class="text-muted" style="font-size:12px;">${ui.escape(whMap[l.warehouseId]||'—')}</span></td>
        <td><span class="badge ${s.color}">${s.label}</span></td>
        ${isGerencialMode ? `<td style="text-align:right;"><span class="td-mono">$${((l.balance||0) * (l.unitCost||0)).toFixed(2)}</span></td>` : ''}
        <td class="td-actions">
          ${!l.formulaId && !l.isInitialLoad ? `<button class="btn-icon" onclick="openLinkFormula('${l.id}')" title="Vincular fórmula" style="color:#92400e;">🔗</button>` : ''}
          ${l.qcTestId ? `<a class="btn-icon" href="calidad.html" onclick="event.stopPropagation()" title="Ver QC">${ui.icon('flask')}</a>` : ''}
          <button class="btn-icon" onclick="editLot('${l.id}')" title="Editar">${ui.icon('edit')}</button>
        </td>
      </tr>`;
    }).join('')}</tbody></table>` : (all.length === 0
      ? `<div class="empty-state"><div class="empty-state-icon">${ui.icon('box')}</div><div class="empty-state-title">Sin producto terminado</div><div class="empty-state-text">Los lotes de PT se crean automáticamente al terminar una orden de fabricación.</div></div>`
      : `<div class="empty-state"><div class="empty-state-title">Sin resultados</div></div>`);

  // Detectar lotes sin minStock definido (carga previa al feature)
  const lotsWithoutMin = all.filter(l => l.minStock == null && (l.balance || 0) > 0);
  const showMigrateBanner = lotsWithoutMin.length > 0 && (typeof auth !== 'undefined' && auth.canSeeAll && auth.canSeeAll());

  ui.renderLayout({
    activeModule: 'producto-terminado', pageEyebrow: 'Inventario', pageTitle: 'Producto Terminado',
    contentHtml: `
      <div class="action-bar">
        <div class="action-bar-left">
          <h2 class="action-bar-title">Producto terminado</h2>
          <span class="action-bar-count">${all.length} lotes · ${counts.cuarentena} en cuarentena · ${counts.liberado} liberados · ${counts.rechazado} rechazados</span>
        </div>
        <div class="action-bar-right">
          <button class="btn btn-primary" onclick="newProduct()">${ui.icon('plus')} Nuevo producto</button>
        </div>
      </div>

      ${showMigrateBanner ? `
      <div class="card" style="background:var(--gold-soft);border-color:var(--gold);margin-bottom:16px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div>
          <div style="font-weight:600;color:var(--gold-deep);font-size:13px;">📦 ${lotsWithoutMin.length} lote${lotsWithoutMin.length!==1?'s':''} sin stock mínimo configurado</div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:2px;">Pon un valor por defecto a todos para recibir alertas cuando se acaben.</div>
        </div>
        <button class="btn btn-gold" onclick="applyDefaultMinStock()">Aplicar mínimo 25 a todos</button>
      </div>
      ` : ''}

      <div class="grid ${isGerencialMode ? 'grid-4' : 'grid-3'} mb-24">
        <div class="kpi"><div class="kpi-label">Total liberado</div><div class="kpi-value">${totalAvailable.toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:3})}</div><div class="kpi-value-sub">disponible para venta</div></div>
        <div class="kpi"><div class="kpi-label">Cuarentena</div><div class="kpi-value">${counts.cuarentena}</div><div class="kpi-value-sub">esperando QC</div></div>
        <div class="kpi"><div class="kpi-label">Rechazados</div><div class="kpi-value" style="color:var(--danger);">${counts.rechazado}</div><div class="kpi-value-sub">no aptos</div></div>
        ${isGerencialMode ? `<div class="kpi"><div class="kpi-label">Valor inventario</div><div class="kpi-value" style="color:var(--accent-ink);">$${totalValueUSD.toFixed(2)}</div><div class="kpi-value-sub">a costo de fabricación</div></div>` : ''}
      </div>

      <div class="table-wrap">
        <div class="table-toolbar">
          <div class="search-box">${ui.icon('search')}<input id="search-input" class="input" type="search" placeholder="Buscar por lote o fórmula..." value="${ui.escape(searchTerm)}" oninput="onSearch(this.value)"></div>
          <select class="select" style="max-width:200px;" onchange="onStatusFilter(this.value)">
            <option value="">Todos los estados</option>
            ${Object.entries(PT_STATUS).map(([k,s])=>`<option value="${k}" ${k===statusFilter?'selected':''}>${s.label}</option>`).join('')}
          </select>
        </div>
        ${tableHtml}
      </div>
    `
  });
}


// Helper local: preserva el foco del input activo a través de un render
function _preserveFocusRender() {
  const active = document.activeElement;
  let snapshot = null;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
    snapshot = {
      id: active.id || null,
      name: active.name || null,
      tagName: active.tagName,
      selectionStart: active.selectionStart,
      selectionEnd: active.selectionEnd
    };
  }
  render();
  if (!snapshot) return;
  let target = null;
  if (snapshot.id) target = document.getElementById(snapshot.id);
  if (!target && snapshot.name) {
    target = document.querySelector(snapshot.tagName.toLowerCase() + '[name="' + snapshot.name + '"]');
  }
  if (target) {
    target.focus();
    try {
      if (snapshot.selectionStart != null && target.setSelectionRange) {
        target.setSelectionRange(snapshot.selectionStart, snapshot.selectionEnd);
      }
    } catch(e) {}
  }
}

const _doSearchRender = ui.debounce(() => _preserveFocusRender(), 250);
function onSearch(v) { searchTerm = v; _doSearchRender(); }
function onStatusFilter(v) { statusFilter = v; render(); }

/**
 * Modal para agregar un nuevo producto al inventario que NO requiere fabricación.
 * Útil para productos comprados para reventa, regalos, accesorios (carta de color,
 * capas, toallas, etc.) que se venden pero no se fabrican con una fórmula.
 * Usa inventory.createInitialFGLot que ya soporta lotes sin fórmula.
 */
function newProduct() {
  const warehouses = db.getAll(db.COLLECTIONS.warehouses);
  if (!warehouses.length) {
    ui.toast('Primero creá un almacén en el módulo Almacenes', 'error');
    return;
  }
  const today = new Date().toISOString().slice(0,10);

  ui.openModal({
    size: 'lg',
    title: 'Nuevo producto (sin fabricación)',
    subtitle: 'Para productos comprados, accesorios o regalos que se venden sin requerir fórmula',
    body: `
      <form id="new-product-form" onsubmit="saveNewProduct(event)">
        <div class="text-muted" style="font-size:12px;line-height:1.5;margin-bottom:16px;padding:10px 12px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;color:#0369a1;">
          💡 Estos productos aparecerán en ventas para poder facturarlos. Como no tienen fórmula, no consumen materia prima ni se descuentan de producción — solo se descuenta su stock al venderse.
        </div>

        <div class="section-title">Producto</div>
        <div class="form-grid form-grid-2 mb-24">
          <div class="field" style="grid-column:1/-1;">
            <label class="field-label">Nombre del producto *</label>
            <input class="input" name="productName" required placeholder="Ej: Carta de color, Capa peluquería, Toalla, etc.">
          </div>
          <div class="field">
            <label class="field-label">Cantidad inicial *</label>
            <input class="input" type="number" name="quantity" required min="0" step="0.001" value="1">
          </div>
          <div class="field">
            <label class="field-label">Unidad *</label>
            <select class="select" name="unit">
              <option value="unidad">unidad</option>
              <option value="caja">caja</option>
              <option value="paquete">paquete</option>
              <option value="par">par</option>
              <option value="kg">kg</option>
              <option value="g">g</option>
              <option value="ml">ml</option>
              <option value="L">L</option>
              <option value="m">metros</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label">Almacén *</label>
            <select class="select" name="warehouseId" required>
              ${warehouses.map(w => `<option value="${w.id}">${ui.escape(w.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label class="field-label">Estado inicial</label>
            <select class="select" name="status">
              <option value="LIBERADO" selected>Liberado (vendible)</option>
              <option value="CUARENTENA">En cuarentena</option>
            </select>
          </div>
        </div>

        <div class="section-title">Costos y precios</div>
        <div class="form-grid form-grid-2 mb-24">
          <div class="field">
            <label class="field-label">Costo unitario (USD)</label>
            <input class="input" type="number" name="unitCost" min="0" step="0.0001" value="0">
            <div class="field-hint">Lo que te costó comprarlo (para márgenes y reportes)</div>
          </div>
          <div class="field">
            <label class="field-label">Precio distribuidor (USD)</label>
            <input class="input" type="number" name="priceDistributor" min="0" step="0.0001" value="0">
          </div>
          <div class="field">
            <label class="field-label">Precio peluquería (USD)</label>
            <input class="input" type="number" name="pricePharmacy" min="0" step="0.0001" value="0">
          </div>
          <div class="field">
            <label class="field-label">Stock mínimo</label>
            <input class="input" type="number" name="minStock" min="0" step="1" value="5">
            <div class="field-hint">Te alertará cuando el balance baje a este número. 0 = sin alerta.</div>
          </div>
        </div>

        <div class="section-title">Detalles opcionales</div>
        <div class="form-grid form-grid-2 mb-24">
          <div class="field">
            <label class="field-label">Fecha de ingreso</label>
            <input class="input" type="date" name="manufactureDate" value="${today}">
            <div class="field-hint">Cuándo entró a inventario</div>
          </div>
          <div class="field">
            <label class="field-label">Vencimiento (opcional)</label>
            <input class="input" type="date" name="expiryDate">
            <div class="field-hint">Solo si aplica (productos perecederos)</div>
          </div>
          <div class="field" style="grid-column:1/-1;">
            <label class="field-label">Notas</label>
            <textarea class="textarea" name="notes" placeholder="Proveedor, marca, observaciones..."></textarea>
          </div>
        </div>
      </form>
    `,
    footer: `
      <button class="btn btn-secondary" onclick="ui.closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="document.getElementById('new-product-form').requestSubmit()">${ui.icon('check')} Crear producto</button>
    `
  });
}

function saveNewProduct(e) {
  e.preventDefault();
  const data = ui.formData(e.target);
  if (!data.productName || !data.productName.trim()) {
    ui.toast('El nombre es obligatorio', 'error');
    return;
  }
  const qty = parseFloat(data.quantity) || 0;
  if (qty <= 0) {
    ui.toast('La cantidad inicial debe ser mayor a 0', 'error');
    return;
  }
  try {
    inventory.createInitialFGLot({
      productName: data.productName.trim(),
      quantity: qty,
      unit: data.unit || 'unidad',
      warehouseId: data.warehouseId,
      status: data.status || 'LIBERADO',
      unitCost: parseFloat(data.unitCost) || 0,
      costCurrency: 'USD',
      priceDistributor: parseFloat(data.priceDistributor) || 0,
      pricePharmacy: parseFloat(data.pricePharmacy) || 0,
      minStock: data.minStock != null && data.minStock !== '' ? parseFloat(data.minStock) : 5,
      manufactureDate: data.manufactureDate || new Date().toISOString().slice(0,10),
      expiryDate: data.expiryDate || null,
      notes: data.notes || ''
    });
    ui.closeModal();
    ui.toast(`Producto "${data.productName.trim()}" creado`, 'success');
    render();
  } catch (err) {
    ui.toast('Error: ' + err.message, 'error');
  }
}

function editLot(id) {
  const l = db.getById(db.COLLECTIONS.finishedGoods, id);
  const warehouses = db.getAll(db.COLLECTIONS.warehouses);
  // Si es un producto sin fórmula (carga inicial), permitimos editar campos
  // adicionales: nombre, unidad, cantidad y costo. Para lotes producidos con fórmula
  // estos campos vienen de la OF y no se editan acá.
  const editableProduct = !l.formulaId && l.isInitialLoad;
  ui.openModal({
    size: editableProduct ? 'lg' : 'md',
    title: `Editar ${editableProduct ? 'producto' : 'lote'} ${l.code}`,
    body: `
      <form id="edit-form" onsubmit="saveLot(event, '${id}')">
        ${editableProduct ? `
          <div class="section-title">Producto</div>
          <div class="form-grid form-grid-2 mb-24">
            <div class="field" style="grid-column:1/-1;">
              <label class="field-label">Nombre del producto</label>
              <input class="input" name="productName" value="${ui.escape(l.productName || l.formulaName || '')}">
            </div>
            <div class="field">
              <label class="field-label">Cantidad / balance actual</label>
              <input class="input" type="number" name="balance" value="${l.balance || 0}" min="0" step="0.001">
              <div class="field-hint">⚠️ Cambiarlo afecta directamente el inventario sin generar movimiento. Para movimientos contables usá ajustes en almacén.</div>
            </div>
            <div class="field">
              <label class="field-label">Unidad</label>
              <select class="select" name="unit">
                ${['unidad','caja','paquete','par','kg','g','ml','L','m'].map(u => `<option value="${u}" ${u===l.unit?'selected':''}>${u}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label class="field-label">Costo unitario (USD)</label>
              <input class="input" type="number" name="unitCost" value="${l.unitCost || 0}" min="0" step="0.0001">
            </div>
          </div>
          <div class="section-title">Lote</div>
        ` : ''}
        <div class="form-grid form-grid-2">
          <div class="field"><label class="field-label">Código de lote</label><input class="input" name="code" value="${ui.escape(l.code)}" style="font-family:var(--font-mono);"></div>
          <div class="field"><label class="field-label">Vencimiento</label><input class="input" type="date" name="expiryDate" value="${l.expiryDate||''}"></div>
          <div class="field"><label class="field-label">Almacén</label><select class="select" name="warehouseId">${warehouses.map(w => `<option value="${w.id}" ${w.id===l.warehouseId?'selected':''}>${ui.escape(w.name)}</option>`).join('')}</select></div>
          <div class="field"><label class="field-label">Estado</label><select class="select" name="status">${Object.entries(PT_STATUS).map(([k,s])=>`<option value="${k}" ${k===l.status?'selected':''}>${s.label}</option>`).join('')}</select></div>
          <div class="field"><label class="field-label">Stock mínimo</label><input class="input" type="number" name="minStock" value="${l.minStock != null ? l.minStock : 25}" min="0" step="1"><div class="field-hint" style="font-size:11px;color:var(--ink-3);margin-top:4px;">Te alertará cuando el balance sea menor o igual a este valor. Pon 0 para no usar alerta.</div></div>
          <div class="field"><label class="field-label">Precio distribuidor (USD)</label><input class="input" type="number" name="priceDistributor" value="${l.priceDistributor || 0}" min="0" step="0.0001"></div>
          <div class="field"><label class="field-label">Precio peluquería (USD)</label><input class="input" type="number" name="pricePharmacy" value="${l.pricePharmacy || 0}" min="0" step="0.0001"></div>
          <div class="field" style="grid-column:1/-1;"><label class="field-label">Notas</label><textarea class="textarea" name="notes">${ui.escape(l.notes||'')}</textarea></div>
        </div>
      </form>
    `,
    footer: `<button class="btn btn-secondary" onclick="ui.closeModal()">Cancelar</button><button class="btn btn-primary" onclick="document.getElementById('edit-form').requestSubmit()">${ui.icon('check')} Guardar</button>`
  });
}

function saveLot(e, id) {
  e.preventDefault();
  const data = ui.formData(e.target);
  const l = db.getById(db.COLLECTIONS.finishedGoods, id);
  // Parsear numéricos
  if (data.minStock != null) data.minStock = parseFloat(data.minStock) || 0;
  if (data.priceDistributor != null) data.priceDistributor = parseFloat(data.priceDistributor) || 0;
  if (data.pricePharmacy != null) data.pricePharmacy = parseFloat(data.pricePharmacy) || 0;
  // Solo para productos sin fórmula (carga inicial): permitir editar nombre, balance, unit, unitCost
  if (!l.formulaId && l.isInitialLoad) {
    if (data.productName != null) {
      data.productName = String(data.productName).trim();
      data.formulaName = data.productName; // mantener consistencia con el campo legacy
    }
    if (data.balance != null) data.balance = parseFloat(data.balance) || 0;
    if (data.unitCost != null) data.unitCost = parseFloat(data.unitCost) || 0;
  } else {
    // Para lotes con fórmula no permitimos editar estos campos por accidente
    delete data.productName;
    delete data.balance;
    delete data.unit;
    delete data.unitCost;
  }
  Object.assign(l, data);
  db.save(db.COLLECTIONS.finishedGoods, l);
  ui.closeModal();
  ui.toast('Lote actualizado', 'success');
  render();
}

/** Aplica stock mínimo de 25 a todos los lotes que no tengan minStock definido */
function applyDefaultMinStock() {
  if (!confirm('Esto aplicará stock mínimo = 25 a todos los lotes que actualmente no tienen ningún mínimo configurado. ¿Continuar?')) return;
  const lotsToUpdate = db.getAll(db.COLLECTIONS.finishedGoods).filter(l => l.minStock == null);
  let count = 0;
  lotsToUpdate.forEach(l => {
    l.minStock = 25;
    db.save(db.COLLECTIONS.finishedGoods, l);
    count++;
  });
  ui.toast(`${count} lote${count!==1?'s':''} actualizado${count!==1?'s':''} con stock mínimo de 25`, 'success');
  render();
}

render();


// Vincular un lote sin fórmula a una fórmula existente
function openLinkFormula(lotId) {
  const lot = db.getById(db.COLLECTIONS.finishedGoods, lotId);
  if (!lot) return;
  const formulas = db.getAll(db.COLLECTIONS.formulas).filter(f => f.active !== false);
  if (formulas.length === 0) {
    ui.toast('Primero creá fórmulas en el módulo Fórmulas', 'error');
    return;
  }

  // Sugerir la fórmula más probable según similitud de nombre
  const lotName = (lot.productName || lot.formulaName || '').toLowerCase();
  const sortedFormulas = [...formulas].sort((a, b) => {
    const aMatch = (a.name || '').toLowerCase().includes(lotName) || lotName.includes((a.name || '').toLowerCase()) ? 1 : 0;
    const bMatch = (b.name || '').toLowerCase().includes(lotName) || lotName.includes((b.name || '').toLowerCase()) ? 1 : 0;
    return bMatch - aMatch;
  });

  ui.openModal({
    title: `Vincular fórmula a ${lot.code}`,
    body: `
      <p style="font-size:13px;color:var(--ink-2);line-height:1.5;margin-bottom:14px;">
        Lote: <strong>${ui.escape(lot.productName || lot.formulaName)}</strong> (${lot.balance} ${lot.unit})
        <br>Al vincular, el costo del lote se actualizará si la fórmula tiene costo calculado.
      </p>
      <form id="link-form" onsubmit="confirmLinkFormula(event, '${lot.id}')">
        <div class="field">
          <label class="field-label">Fórmula *</label>
          <select class="select" name="formulaId" required>
            <option value="">— Seleccionar —</option>
            ${sortedFormulas.map(f => `<option value="${f.id}">${ui.escape(f.code)} · ${ui.escape(f.name)}${f.costUSD?` · costo $${f.costUSD.toFixed(2)}`:''}</option>`).join('')}
          </select>
          <div class="field-hint">Ordenadas por similitud con el nombre del lote.</div>
        </div>
      </form>
    `,
    footer: `<button class="btn btn-secondary" onclick="ui.closeModal()">Cancelar</button><button class="btn btn-primary" onclick="document.getElementById('link-form').requestSubmit()">${ui.icon('check')||'✓'} Vincular</button>`
  });
}

function confirmLinkFormula(e, lotId) {
  e.preventDefault();
  const data = ui.formData(e.target);
  if (!data.formulaId) { ui.toast('Selecciona una fórmula', 'error'); return; }
  try {
    inventory.linkLotToFormula(lotId, data.formulaId);
    ui.closeModal();
    ui.toast('Fórmula vinculada correctamente', 'success');
    render();
  } catch (err) {
    ui.toast(err.message, 'error');
  }
}

// Exponer funciones a window (para que onclick="" del HTML pueda llamarlas)

// Sincronizar variables de estado del módulo con window
try { Object.defineProperty(window, 'statusFilter', { get: () => statusFilter, set: (val) => { statusFilter = val; }, configurable: true }); } catch(e) {}

Object.assign(window, {
  render: typeof render !== 'undefined' ? render : undefined,
  onSearch: typeof onSearch !== 'undefined' ? onSearch : undefined,
  onStatusFilter: typeof onStatusFilter !== 'undefined' ? onStatusFilter : undefined,
  newProduct: typeof newProduct !== 'undefined' ? newProduct : undefined,
  saveNewProduct: typeof saveNewProduct !== 'undefined' ? saveNewProduct : undefined,
  editLot: typeof editLot !== 'undefined' ? editLot : undefined,
  saveLot: typeof saveLot !== 'undefined' ? saveLot : undefined,
  applyDefaultMinStock: typeof applyDefaultMinStock !== 'undefined' ? applyDefaultMinStock : undefined,
  openLinkFormula: typeof openLinkFormula !== 'undefined' ? openLinkFormula : undefined,
  confirmLinkFormula: typeof confirmLinkFormula !== 'undefined' ? confirmLinkFormula : undefined,
});
});
</script>
</body>
</html>
