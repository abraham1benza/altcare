<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comisiones · altcare</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<script type="module" src="../assets/js/firebase-init.js"></script>
<script src="../assets/js/module-init-v2.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/currency.js"></script>
<script src="../assets/js/tax.js"></script>
<script src="../assets/js/payments.js"></script>
<script src="../assets/js/commissions.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
moduleInit('comisiones').then(async (ok) => {
if (!ok) return;

let view = 'list';      // list | detail
let selectedUserId = null;
let searchTerm = '';

const _doSearchRender = ui.debounce(() => ui.preserveFocus(() => render()), 250);
function onSearch(v) { searchTerm = v; _doSearchRender(); }

function render() {
  if (view === 'detail' && selectedUserId) return renderDetail();
  return renderList();
}

// =============================================================================
// LISTA: cards por vendedor
// =============================================================================

function renderList() {
  let summaries = commissions.getAllSummaries();

  // Filtrar por visibilidad: vendedor solo ve su propio resumen, gerente ve su equipo
  if (!auth.canSeeAll()) {
    const visibleUsers = auth.visibleUserIds() || [];
    summaries = summaries.filter(s => visibleUsers.includes(s.userId));
  }
  const filtered = searchTerm
    ? summaries.filter(s => (s.user.fullName || s.user.username || '').toLowerCase().includes(searchTerm.toLowerCase()))
    : summaries;

  // Totales globales
  const totalDevengado = summaries.reduce((s, x) => s + x.totalCommission, 0);
  const totalPagado = summaries.reduce((s, x) => s + x.totalPaid, 0);
  const totalPrestamos = summaries.reduce((s, x) => s + x.loansBalance, 0);
  const totalSaldo = summaries.reduce((s, x) => s + x.netBalance, 0);

  const cards = filtered.map(s => renderUserCard(s)).join('');

  ui.renderLayout({
    activeModule: 'comisiones',
    pageEyebrow: 'Comercial',
    pageTitle: 'Comisiones',
    contentHtml: `
      <div class="action-bar">
        <div class="action-bar-left">
          <h2 class="action-bar-title">Comisiones de venta</h2>
          <div class="text-muted" style="font-size:13px;margin-top:4px;">
            ${summaries.length} vendedor${summaries.length!==1?'es':''} con comisión activa
          </div>
        </div>
      </div>

      <p class="text-muted mb-24" style="font-size:13px;line-height:1.5;">
        Cada vendedor con comisión habilitada genera un evento al <strong>emitir factura</strong> (comisión por venta) y otro <strong>cada vez que cobra</strong> (comisión por cobranza).
        Los % se configuran en cada perfil de usuario. Acá podés pagarles, otorgarles préstamos y ver su saldo.
      </p>

      ${summaries.length === 0 ? `
        <div class="empty-state">
          <div class="empty-state-icon">${ui.icon('users')||'👥'}</div>
          <div class="empty-state-title">Sin vendedores con comisión</div>
          <div class="empty-state-text">Activá la opción "Gana comisiones por ventas" en el perfil de algún usuario desde el módulo Usuarios.</div>
          <a href="usuarios.html" class="btn btn-primary" style="margin-top:16px;text-decoration:none;">${ui.icon('plus')} Ir a Usuarios</a>
        </div>
      ` : `
        <!-- Resumen global -->
        <div class="grid grid-4 mb-24">
          <div class="kpi">
            <div class="kpi-label">Devengado total</div>
            <div class="kpi-value" style="font-size:26px;">${currency.format(totalDevengado, 'USD')}</div>
            <div class="kpi-value-sub">comisiones generadas</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Pagado</div>
            <div class="kpi-value" style="font-size:26px;color:var(--accent-ink);">${currency.format(totalPagado, 'USD')}</div>
            <div class="kpi-value-sub">a vendedores</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Préstamos activos</div>
            <div class="kpi-value" style="font-size:26px;color:#92400e;">${currency.format(totalPrestamos, 'USD')}</div>
            <div class="kpi-value-sub">por cobrar</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Saldo neto a pagar</div>
            <div class="kpi-value" style="font-size:26px;color:${totalSaldo>=0?'var(--success)':'var(--danger)'};">${currency.format(Math.abs(totalSaldo), 'USD')}</div>
            <div class="kpi-value-sub">${totalSaldo>=0?'se les debe':'deben a la empresa'}</div>
          </div>
        </div>

        <div class="search-box mb-24">${ui.icon('search')}<input id="search-input" class="input" type="search" placeholder="Buscar vendedor..." value="${ui.escape(searchTerm)}" oninput="onSearch(this.value)"></div>

        <div class="grid grid-2">${cards}</div>
      `}
    `
  });
}

function renderUserCard(s) {
  const u = s.user;
  const cfg = s.config;
  const balanceColor = s.netBalance >= 0 ? 'var(--success)' : 'var(--danger)';
  const balanceLabel = s.netBalance >= 0 ? 'Se le debe' : 'Debe a la empresa';
  const balanceAbs = Math.abs(s.netBalance);

  return `
    <div class="card" style="padding:0;overflow:hidden;border-radius:12px;border:2px solid var(--border);">
      <!-- Header -->
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg, var(--accent-soft) 0%, transparent 100%);display:flex;justify-content:space-between;align-items:start;">
        <div style="flex:1;min-width:0;">
          <div class="text-muted" style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;color:var(--accent-ink);">VENDEDOR</div>
          <div style="font-family:var(--font-display);font-size:20px;line-height:1.2;font-weight:500;color:var(--accent-ink);margin-top:2px;">${ui.escape(u.fullName || u.username)}</div>
          <div class="text-muted" style="font-size:11px;margin-top:3px;">${ui.escape(u.email || '')}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          <span class="badge badge-paid" style="font-size:9.5px;">Venta ${cfg.rateSale}%</span>
          <span class="badge badge-invoice" style="font-size:9.5px;">Cobro ${cfg.rateCollection}%</span>
          <span class="badge badge-plain" style="font-size:9px;">${cfg.base==='TOTAL'?'sobre TOTAL':'sobre SUBTOTAL'}</span>
        </div>
      </div>

      <!-- Saldo neto destacado -->
      <div style="padding:16px 20px;background:${s.netBalance>=0?'#f0fdf4':'#fef2f2'};border-bottom:1px solid var(--border);">
        <div class="text-muted" style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;">${balanceLabel}</div>
        <div style="font-family:var(--font-display);font-size:30px;color:${balanceColor};line-height:1.1;margin-top:4px;font-weight:500;">${currency.format(balanceAbs, 'USD')}</div>
      </div>

      <!-- Ventas: total / semana / mes -->
      <div style="padding:14px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-bottom:1px solid var(--border);">
        <div>
          <div class="text-muted" style="font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;">Vendido total</div>
          <div class="td-mono td-strong" style="font-size:13px;margin-top:3px;">${currency.format(s.totalSold, 'USD')}</div>
        </div>
        <div>
          <div class="text-muted" style="font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;">Semana</div>
          <div class="td-mono td-strong" style="font-size:13px;margin-top:3px;">${currency.format(s.weekSold, 'USD')}</div>
        </div>
        <div>
          <div class="text-muted" style="font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;">Mes</div>
          <div class="td-mono td-strong" style="font-size:13px;margin-top:3px;">${currency.format(s.monthSold, 'USD')}</div>
        </div>
      </div>

      <!-- Comisiones generadas -->
      <div style="padding:14px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--border);">
        <div style="padding:8px 12px;background:#dbeafe;border-radius:6px;">
          <div class="text-muted" style="font-size:9px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;color:#1e40af;">Por venta</div>
          <div class="td-mono" style="font-size:13px;font-weight:600;color:#1e3a8a;margin-top:2px;">${currency.format(s.commissionSale, 'USD')}</div>
          <div class="text-muted" style="font-size:10px;color:#3730a3;">${s.saleEventsCount} factura${s.saleEventsCount!==1?'s':''}</div>
        </div>
        <div style="padding:8px 12px;background:#dcfce7;border-radius:6px;">
          <div class="text-muted" style="font-size:9px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;color:#166534;">Por cobranza</div>
          <div class="td-mono" style="font-size:13px;font-weight:600;color:#15803d;margin-top:2px;">${currency.format(s.commissionCollection, 'USD')}</div>
          <div class="text-muted" style="font-size:10px;color:#14532d;">${s.collectionEventsCount} cobro${s.collectionEventsCount!==1?'s':''}</div>
        </div>
      </div>

      <!-- Pagado / Préstamos -->
      <div style="padding:14px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--border);">
        <div>
          <div class="text-muted" style="font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;">Pagado</div>
          <div class="td-mono" style="font-size:13px;color:var(--ink-2);margin-top:3px;">${currency.format(s.totalPaid, 'USD')}</div>
        </div>
        <div>
          <div class="text-muted" style="font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;font-weight:600;">Préstamos activos</div>
          <div class="td-mono" style="font-size:13px;color:${s.loansBalance>0?'#92400e':'var(--ink-3)'};margin-top:3px;">${currency.format(s.loansBalance, 'USD')}</div>
        </div>
      </div>

      <!-- Botones -->
      <div style="padding:14px 16px;display:grid;grid-template-columns:${auth.canSeeAll() || auth.isManager() ? '1fr 1fr 1fr' : '1fr'};gap:6px;">
        ${auth.canSeeAll() || auth.isManager() ? `
          <button class="btn btn-primary btn-sm" onclick="openPayCommission('${u.id}')" style="font-size:11px;padding:6px 8px;">$ Pagar</button>
          <button class="btn btn-secondary btn-sm" onclick="openGiveLoan('${u.id}')" style="font-size:11px;padding:6px 8px;">📋 Préstamo</button>
        ` : ''}
        <button class="btn btn-ghost btn-sm" onclick="openDetail('${u.id}')" style="font-size:11px;padding:6px 8px;">📊 Detalle</button>
      </div>
    </div>
  `;
}

// =============================================================================
// DETALLE: historial completo del vendedor
// =============================================================================

function openDetail(userId) {
  selectedUserId = userId;
  view = 'detail';
  render();
}

function renderDetail() {
  const s = commissions.getUserSummary(selectedUserId);
  if (!s) { view = 'list'; render(); return; }

  const events = db.query(db.COLLECTIONS.commissionEvents, e => e.userId === selectedUserId)
    .sort((a, b) => (b.date||'').localeCompare(a.date||''));
  const payments = db.query(db.COLLECTIONS.commissionPayments, p => p.userId === selectedUserId)
    .sort((a, b) => (b.date||'').localeCompare(a.date||''));
  const loans = db.query(db.COLLECTIONS.loans, l => l.userId === selectedUserId)
    .sort((a, b) => (b.date||'').localeCompare(a.date||''));

  ui.renderLayout({
    activeModule: 'comisiones',
    pageEyebrow: 'VENDEDOR',
    pageTitle: s.user.fullName || s.user.username,
    contentHtml: `
      <button class="btn btn-ghost mb-24" onclick="goBackToList()">← Volver</button>

      <!-- Resumen -->
      <div class="grid grid-4 mb-24">
        <div class="kpi"><div class="kpi-label">Vendido total</div><div class="kpi-value" style="font-size:24px;">${currency.format(s.totalSold,'USD')}</div><div class="kpi-value-sub">${s.invoiceCount} factura${s.invoiceCount!==1?'s':''}</div></div>
        <div class="kpi"><div class="kpi-label">Devengado total</div><div class="kpi-value" style="font-size:24px;color:var(--accent-ink);">${currency.format(s.totalCommission,'USD')}</div><div class="kpi-value-sub">${s.saleEventsCount}+${s.collectionEventsCount} eventos</div></div>
        <div class="kpi"><div class="kpi-label">Pagado</div><div class="kpi-value" style="font-size:24px;">${currency.format(s.totalPaid,'USD')}</div><div class="kpi-value-sub">${s.paymentsCount} pago${s.paymentsCount!==1?'s':''}</div></div>
        <div class="kpi"><div class="kpi-label">Saldo neto</div><div class="kpi-value" style="font-size:24px;color:${s.netBalance>=0?'var(--success)':'var(--danger)'};">${currency.format(Math.abs(s.netBalance),'USD')}</div><div class="kpi-value-sub">${s.netBalance>=0?'se le debe':'debe a empresa'}</div></div>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:16px;">
        ${auth.canSeeAll() || auth.isManager() ? `
          <button class="btn btn-primary" onclick="openPayCommission('${s.userId}')">$ Pagar comisión</button>
          <button class="btn btn-secondary" onclick="openGiveLoan('${s.userId}')">📋 Otorgar préstamo</button>
        ` : ''}
      </div>

      <!-- Eventos de comisión -->
      <div class="card mb-24" style="padding:0;">
        <div style="padding:14px 20px;border-bottom:1px solid var(--border);"><div class="card-title">📈 Eventos de comisión (${events.length})</div></div>
        ${events.length ? `<div class="table-wrap" style="border-radius:0;"><table>
          <thead><tr><th>Fecha</th><th>Tipo</th><th>Factura</th><th>Cliente</th><th style="text-align:right;">Base</th><th style="text-align:right;">%</th><th style="text-align:right;">Comisión USD</th><th>Estado</th></tr></thead>
          <tbody>${events.map(e => `<tr style="${e.reversed?'opacity:0.45;text-decoration:line-through;':''}">
            <td><span class="text-muted" style="font-size:12px;">${ui.formatDate(e.date)}</span></td>
            <td><span class="badge ${e.type==='SALE'?'badge-invoice':'badge-paid'}" style="font-size:10px;">${e.type==='SALE'?'🛒 Venta':'💰 Cobranza'}</span></td>
            <td><span class="td-mono">${e.invoiceCode}</span>${e.invoiceNumber?`<div class="text-muted" style="font-size:10px;">${e.invoiceNumber}</div>`:''}</td>
            <td>${ui.escape(e.customerName||'')}</td>
            <td style="text-align:right;"><span class="td-mono">${currency.format(e.baseAmount, e.currency)}</span><div class="text-muted" style="font-size:10px;">${e.baseLabel}</div></td>
            <td style="text-align:right;"><span class="td-mono">${e.rate}%</span></td>
            <td style="text-align:right;"><span class="td-mono td-strong">${currency.format(e.amountUSD,'USD')}</span></td>
            <td>${e.reversed ? `<span class="badge badge-cancelled" style="font-size:10px;">Reversado</span>` : `<span class="badge badge-paid" style="font-size:10px;">Activo</span>`}</td>
          </tr>`).join('')}</tbody>
        </table></div>` : '<div class="empty-state-text" style="padding:24px;">Sin eventos de comisión.</div>'}
      </div>

      <!-- Pagos al vendedor -->
      <div class="card mb-24" style="padding:0;">
        <div style="padding:14px 20px;border-bottom:1px solid var(--border);"><div class="card-title">💸 Pagos al vendedor (${payments.length})</div></div>
        ${payments.length ? `<div class="table-wrap" style="border-radius:0;"><table>
          <thead><tr><th>Fecha</th><th>Cuenta</th><th style="text-align:right;">Monto</th><th>Notas</th><th>Estado</th><th style="text-align:right;">Acciones</th></tr></thead>
          <tbody>${payments.map(p => `<tr style="${p.cancelled?'opacity:0.45;':''}">
            <td><span class="text-muted">${ui.formatDate(p.date)}</span></td>
            <td>${ui.escape(p.bankAccountName||'')}</td>
            <td style="text-align:right;"><span class="td-mono td-strong">${currency.format(p.amount, p.currency)}</span>${p.loanRepaymentId?`<div class="text-muted" style="font-size:10px;">incluye ${currency.format(p.loanRepayAmount, p.currency)} de préstamo</div>`:''}</td>
            <td><span class="text-muted" style="font-size:12px;">${ui.escape(p.notes||'—')}</span></td>
            <td>${p.cancelled ? `<span class="badge badge-cancelled">Anulado</span>` : `<span class="badge badge-paid">Pagado</span>`}</td>
            <td style="text-align:right;">${!p.cancelled ? `<button class="btn btn-ghost btn-sm" style="font-size:11px;color:var(--danger);" onclick="cancelPayment('${p.id}')">Anular</button>`:''}</td>
          </tr>`).join('')}</tbody>
        </table></div>` : '<div class="empty-state-text" style="padding:24px;">Sin pagos registrados.</div>'}
      </div>

      <!-- Préstamos -->
      <div class="card mb-24" style="padding:0;">
        <div style="padding:14px 20px;border-bottom:1px solid var(--border);"><div class="card-title">📋 Préstamos (${loans.length})</div></div>
        ${loans.length ? `<div class="table-wrap" style="border-radius:0;"><table>
          <thead><tr><th>Fecha</th><th>Cuenta origen</th><th style="text-align:right;">Monto</th><th style="text-align:right;">Saldo</th><th>Notas</th><th>Estado</th><th style="text-align:right;">Acciones</th></tr></thead>
          <tbody>${loans.map(l => {
            const status = l.status==='PAID' ? {label:'Pagado',color:'badge-paid'} : l.status==='CANCELLED' ? {label:'Anulado',color:'badge-cancelled'} : {label:'Activo',color:'badge-warning'};
            return `<tr style="${l.status==='CANCELLED'?'opacity:0.45;':''}">
              <td><span class="text-muted">${ui.formatDate(l.date)}</span></td>
              <td>${ui.escape(l.bankAccountName||'')}</td>
              <td style="text-align:right;"><span class="td-mono">${currency.format(l.originalAmount, l.currency)}</span></td>
              <td style="text-align:right;"><span class="td-mono td-strong" style="${l.balance>0?'color:#92400e;':''}">${currency.format(l.balance, l.currency)}</span></td>
              <td><span class="text-muted" style="font-size:12px;">${ui.escape(l.notes||'—')}</span></td>
              <td><span class="badge ${status.color}" style="font-size:10px;">${status.label}</span></td>
              <td style="text-align:right;">${l.status==='OPEN' && (l.repayments||[]).length===0 ? `<button class="btn btn-ghost btn-sm" style="font-size:11px;color:var(--danger);" onclick="cancelLoan('${l.id}')">Anular</button>`:''}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>` : '<div class="empty-state-text" style="padding:24px;">Sin préstamos otorgados.</div>'}
      </div>
    `
  });
}

function goBackToList() { view = 'list'; selectedUserId = null; render(); }

// =============================================================================
// MODAL: PAGAR COMISIÓN
// =============================================================================

let _paymentForm = null;

function openPayCommission(userId) {
  const s = commissions.getUserSummary(userId);
  if (!s) return;
  const accounts = db.getAll(db.COLLECTIONS.bankAccounts).filter(a => a.active !== false);
  if (!accounts.length) {
    ui.toast('Necesitás crear una cuenta bancaria primero', 'error');
    return;
  }
  const bcv = currency.getRate('BCV_USD');

  _paymentForm = {
    userId,
    userName: s.user.fullName || s.user.username,
    amount: '',
    paymentCurrency: 'USD',          // Moneda en la que pago al vendedor (yo elijo)
    bankAccountId: accounts[0].id,   // Cuenta de la que sale la plata
    date: new Date().toISOString().slice(0,10),
    notes: '',
    // Tasa para conversión a moneda de cuenta (si difieren)
    conversionRate: bcv?.value || 0,
    conversionRateType: 'BCV_USD',
    useCustomRate: false,
    // Préstamo
    loanIdToRepay: '',
    loanRepayAmount: 0
  };

  ui.openModal({
    title: `Pagar comisión a ${_paymentForm.userName}`,
    body: `<div id="paycomm-body"></div>`,
    footer: `<button class="btn btn-secondary" onclick="ui.closeModal();_paymentForm=null;">Cancelar</button><button class="btn btn-primary" onclick="confirmPayCommission()">${ui.icon('check')} Pagar</button>`
  });
  renderPayCommissionForm();
}

function renderPayCommissionForm() {
  const f = _paymentForm;
  if (!f) return;
  const s = commissions.getUserSummary(f.userId);
  const accounts = db.getAll(db.COLLECTIONS.bankAccounts).filter(a => a.active !== false);
  const activeLoans = db.query(db.COLLECTIONS.loans, l => l.userId === f.userId && l.status === 'OPEN');
  const account = db.getById(db.COLLECTIONS.bankAccounts, f.bankAccountId);
  const accountCcy = account ? account.currency : 'VES';

  const isCrossCurrency = f.paymentCurrency !== accountCcy;
  const amt = parseFloat(f.amount) || 0;

  // Calcular monto que sale de la cuenta (en moneda de cuenta)
  let amountFromAccount = amt;
  if (isCrossCurrency && f.conversionRate > 0) {
    let amtInVES = 0;
    if (f.paymentCurrency === 'VES') amtInVES = amt;
    else amtInVES = amt * f.conversionRate;  // USD/EUR → VES
    if (accountCcy === 'VES') amountFromAccount = amtInVES;
    else amountFromAccount = f.conversionRate > 0 ? amtInVES / f.conversionRate : 0;
    amountFromAccount = Math.round(amountFromAccount * 100) / 100;
  }

  // Tasas disponibles según par de monedas
  const allRates = currency.getRates().filter(r => r.value > 0);
  const applicableRates = allRates.filter(r => {
    if (!isCrossCurrency) return false;
    if (r.type === 'BCV_USD' || r.type === 'BINANCE') {
      return (f.paymentCurrency === 'USD' && accountCcy === 'VES') || (f.paymentCurrency === 'VES' && accountCcy === 'USD');
    }
    if (r.type === 'BCV_EUR' || r.type === 'P2P_EUR') {
      return (f.paymentCurrency === 'EUR' && accountCcy === 'VES') || (f.paymentCurrency === 'VES' && accountCcy === 'EUR');
    }
    return false;
  });

  // Auto-elegir tasa si no hay una válida
  if (isCrossCurrency && !f.useCustomRate && applicableRates.length > 0) {
    const stillValid = applicableRates.some(r => r.type === f.conversionRateType);
    if (!stillValid) {
      const bcv = applicableRates.find(r => r.type === 'BCV_USD') || applicableRates.find(r => r.type === 'BCV_EUR') || applicableRates[0];

// Funciones de actualización del form sin re-render completo (evita perder foco)
function setPayAmount(val) {
  _paymentForm.amount = val;
  refreshPayPreview();
}

function setPayCurrency(ccy) {
  _paymentForm.paymentCurrency = ccy;
  // Reset tasa: el par cambió
  _paymentForm.useCustomRate = false;
  const bcv = currency.getRate(ccy === 'EUR' ? 'BCV_EUR' : 'BCV_USD');
  if (bcv) {
    _paymentForm.conversionRate = bcv.value;
    _paymentForm.conversionRateType = bcv.type;
  }
  renderPayCommissionForm();
}

function selectPayRate(rateType, value) {
  _paymentForm.conversionRateType = rateType;
  _paymentForm.conversionRate = parseFloat(value) || 0;
  _paymentForm.useCustomRate = false;
  renderPayCommissionForm();
}

function useCustomPayRate() {
  _paymentForm.useCustomRate = true;
  _paymentForm.conversionRateType = 'CUSTOM';
  renderPayCommissionForm();
}

function updateCustomPayRate(val) {
  _paymentForm.conversionRate = parseFloat(val) || 0;
  refreshPayPreview();
}

/** Refresca solo los textos del preview (mantiene foco del input) */
function refreshPayPreview() {
  const f = _paymentForm;
  if (!f) return;
  const account = db.getById(db.COLLECTIONS.bankAccounts, f.bankAccountId);
  if (!account) return;
  const accountCcy = account.currency;
  const isCross = f.paymentCurrency !== accountCcy;
  const amt = parseFloat(f.amount) || 0;
  let amountFromAccount = amt;
  if (isCross && f.conversionRate > 0) {
    let amtInVES = 0;
    if (f.paymentCurrency === 'VES') amtInVES = amt;
    else amtInVES = amt * f.conversionRate;
    if (accountCcy === 'VES') amountFromAccount = amtInVES;
    else amountFromAccount = f.conversionRate > 0 ? amtInVES / f.conversionRate : 0;
    amountFromAccount = Math.round(amountFromAccount * 100) / 100;
  }
  const elRecv = document.getElementById('pay-recv');
  const elOut = document.getElementById('pay-out');
  if (elRecv) elRecv.textContent = currency.format(amt, f.paymentCurrency);
  if (elOut) elOut.textContent = currency.format(amountFromAccount, accountCcy);
}

function confirmPayCommission() {
  const f = _paymentForm;
  if (!f) return;
  const amount = parseFloat(f.amount) || 0;
  if (amount <= 0) { ui.toast('Indicá un monto válido', 'error'); return; }
  const account = db.getById(db.COLLECTIONS.bankAccounts, f.bankAccountId);
  if (!account) { ui.toast('Selecciona una cuenta', 'error'); return; }

  const isCross = f.paymentCurrency !== account.currency;
  if (isCross) {
    if (f.useCustomRate) {
      const inp = document.querySelector('input[type="number"][step="0.0001"]');
      if (inp) f.conversionRate = parseFloat(inp.value) || 0;
    }
    if (!f.conversionRate || f.conversionRate <= 0) {
      ui.toast('Indicá una tasa válida', 'error');
      return;
    }
  }

  try {
    commissions.payCommission({
      userId: f.userId,
      amount,
      currency: f.paymentCurrency,
      bankAccountId: f.bankAccountId,
      // Pasamos la tasa elegida para que registerBankMove la respete
      conversionRate: isCross ? f.conversionRate : null,
      conversionRateType: isCross ? f.conversionRateType : null,
      date: f.date,
      notes: f.notes,
      loanIdToRepay: f.loanIdToRepay || null,
      loanRepayAmount: f.loanRepayAmount || 0
    });
    ui.closeModal();
    _paymentForm = null;
    ui.toast(`Pago de ${currency.format(amount, f.paymentCurrency)} a ${f.userName} registrado`, 'success');
    render();
  } catch (err) {
    ui.toast(err.message, 'error');
  }
}

      currency: f.loanCurrency,
      bankAccountId: f.bankAccountId,
      conversionRate: isCross ? f.conversionRate : null,
      conversionRateType: isCross ? f.conversionRateType : null,
      date: f.date,
      notes: f.notes
    });
    ui.closeModal();
    _loanForm = null;
    ui.toast(`Préstamo de ${currency.format(amount, f.loanCurrency)} otorgado a ${f.userName}`, 'success');
    render();
  } catch (err) {
    ui.toast(err.message, 'error');
  }
}

// =============================================================================
// ANULAR PAGO / PRÉSTAMO
// =============================================================================

function cancelPayment(paymentId) {
  ui.confirm(
    '¿Anular este pago? La plata se devolverá a la cuenta y si descontó un préstamo, se reactivará el saldo.',
    () => {
      try {
        commissions.cancelCommissionPayment(paymentId, 'Anulado manualmente');
        ui.toast('Pago anulado', 'success');
        render();
      } catch (err) { ui.toast(err.message, 'error'); }
    },
    { danger: true, confirmLabel: 'Anular' }
  );
}

function cancelLoan(loanId) {
  ui.confirm(
    '¿Anular este préstamo? La plata se devolverá a la cuenta de origen.',
    () => {
      try {
        commissions.cancelLoan(loanId, 'Anulado manualmente');
        ui.toast('Préstamo anulado', 'success');
        render();
      } catch (err) { ui.toast(err.message, 'error'); }
    },
    { danger: true, confirmLabel: 'Anular' }
  );
}

render();

Object.assign(window, {
  render: typeof render !== 'undefined' ? render : undefined,
  onSearch: typeof onSearch !== 'undefined' ? onSearch : undefined,
  openDetail: typeof openDetail !== 'undefined' ? openDetail : undefined,
  goBackToList: typeof goBackToList !== 'undefined' ? goBackToList : undefined,
  // Pago
  openPayCommission: typeof openPayCommission !== 'undefined' ? openPayCommission : undefined,
  renderPayCommissionForm: typeof renderPayCommissionForm !== 'undefined' ? renderPayCommissionForm : undefined,
  setPayAmount: typeof setPayAmount !== 'undefined' ? setPayAmount : undefined,
  setPayCurrency: typeof setPayCurrency !== 'undefined' ? setPayCurrency : undefined,
  selectPayRate: typeof selectPayRate !== 'undefined' ? selectPayRate : undefined,
  useCustomPayRate: typeof useCustomPayRate !== 'undefined' ? useCustomPayRate : undefined,
  updateCustomPayRate: typeof updateCustomPayRate !== 'undefined' ? updateCustomPayRate : undefined,
  refreshPayPreview: typeof refreshPayPreview !== 'undefined' ? refreshPayPreview : undefined,
  confirmPayCommission: typeof confirmPayCommission !== 'undefined' ? confirmPayCommission : undefined,
  // Préstamo
  openGiveLoan: typeof openGiveLoan !== 'undefined' ? openGiveLoan : undefined,
  renderLoanForm: typeof renderLoanForm !== 'undefined' ? renderLoanForm : undefined,
  setLoanAmount: typeof setLoanAmount !== 'undefined' ? setLoanAmount : undefined,
  setLoanCurrency: typeof setLoanCurrency !== 'undefined' ? setLoanCurrency : undefined,
  selectLoanRate: typeof selectLoanRate !== 'undefined' ? selectLoanRate : undefined,
  useCustomLoanRate: typeof useCustomLoanRate !== 'undefined' ? useCustomLoanRate : undefined,
  updateCustomLoanRate: typeof updateCustomLoanRate !== 'undefined' ? updateCustomLoanRate : undefined,
  refreshLoanPreview: typeof refreshLoanPreview !== 'undefined' ? refreshLoanPreview : undefined,
  confirmGiveLoan: typeof confirmGiveLoan !== 'undefined' ? confirmGiveLoan : undefined,
  // Anular
  cancelPayment: typeof cancelPayment !== 'undefined' ? cancelPayment : undefined,
  cancelLoan: typeof cancelLoan !== 'undefined' ? cancelLoan : undefined,
});

}); // end moduleInit
</script>
</body>
</html>
