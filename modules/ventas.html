<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventas · altcare</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<script type="module" src="../assets/js/firebase-init.js"></script>
<script src="../assets/js/module-init-v2.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/db.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/currency.js"></script>
<script src="../assets/js/tax.js"></script>
<script src="../assets/js/inventory.js"></script>
<script src="../assets/js/formulas.js"></script>
<script src="../assets/js/purchases.js"></script>
<script src="../assets/js/sales.js"></script>
<script src="../assets/js/payments.js"></script>
<script src="../assets/js/commissions.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
moduleInit('ventas').then(async (ok) => {
if (!ok) return;

let view = 'list';        // list | detail | create | assignLots
let selectedId = null;
let creating = null;
let assigning = null;
let typeFilter = '';
let deliveryFilter = ''; // '' | 'PENDIENTE' | 'DESPACHADO' | 'ENTREGADO'
let searchTerm = '';
// Estado de ordenamiento por columna. null = orden por defecto (fecha desc).
let sortDocs = null;       // { key, dir } para la lista de documentos
let sortCXC = null;        // { key, dir } para el cuadro de cuentas por cobrar
// === FLUJO DE APROBACIÓN ===
// Tab activa en la lista. Admin/gerente ven 3 pestañas; vendedor solo Pendientes y CXC.
// Las cotizaciones aparecen en "ventas" (van directo, sin aprobación).
let listTab = 'sales';     // sales | pending | cxc
let pendingVendorFilter = '';  // filtro por vendedor para admin/gerente

// Aplicar filtro inicial desde URL (?filter=PEDIDO viene del dashboard)
(function applyUrlFilter() {
  const params = new URLSearchParams(window.location.search);
  const filterParam = params.get('filter');
  if (filterParam && ['PEDIDO','COTIZACION','NOTA_ENTREGA','FACTURA','PAID','PARTIAL','CANCELLED'].includes(filterParam)) {
    typeFilter = filterParam;
    window.history.replaceState({}, '', window.location.pathname);
  }
})();

function render() {
  if (view === 'detail' && selectedId) return renderDetail();
  if (view === 'create') return renderCreate();
  if (view === 'assignLots') return renderAssignLots();
  return renderList();
}

// ====== LISTA ======

function renderList() {
  let docs = db.getAll(db.COLLECTIONS.salesOrders).filter(d => !d.cancelled || typeFilter === 'CANCELLED');

  // Filtrado por visibilidad: si no es admin, mostrar:
  //   - Documentos donde el vendedor es el user actual (o de su equipo)
  //   - Documentos cuyos clientes están asignados al user actual (o su equipo)
  if (!auth.canSeeAll()) {
    const visibleUsers = auth.visibleUserIds() || [];
    // Pre-calcular clientes visibles (soporta array de vendedores)
    const myCustomerIds = new Set(
      db.getAll(db.COLLECTIONS.customers)
        .filter(c => auth.canSeeCustomer(c))
        .map(c => c.id)
    );
    docs = docs.filter(d =>
      (d.salespersonId && visibleUsers.includes(d.salespersonId)) ||
      (d.customerId && myCustomerIds.has(d.customerId))
    );
  }

  const all = docs;

  // === SEPARAR POR APROVAL STATUS ===
  // Pendientes: docs creados por vendedor que aún no se aprobaron.
  // El resto (APPROVED, REJECTED viejo, sin approvalStatus = legacy) son "ventas".
  // Cotizaciones (COTIZACION) van siempre a "ventas" — no necesitan aprobación.
  const allPending = all.filter(d =>
    d.approvalStatus === 'PENDING' &&
    (d.type === 'PEDIDO' || d.type === 'NOTA_ENTREGA')
  );
  // Los rechazados (auditoría) también caen a "Pendientes" para que el vendedor pueda
  // re-editarlos. Los "Ventas" son todo lo que NO esté pendiente ni rechazado.
  const allRejected = all.filter(d =>
    d.approvalStatus === 'REJECTED' &&
    (d.type === 'PEDIDO' || d.type === 'NOTA_ENTREGA')
  );
  const pendingPlusRejected = [...allPending, ...allRejected];
  const allSales = all.filter(d => !pendingPlusRejected.includes(d));

  // Según pestaña, restringimos `docs` a uno de los dos universos.
  // (CXC se renderiza aparte, no usa `docs` directamente).
  if (listTab === 'pending') {
    docs = pendingPlusRejected;
    // Filtro adicional por vendedor (solo admin/gerente puede usarlo)
    if (pendingVendorFilter && auth.canApproveSales && auth.canApproveSales()) {
      docs = docs.filter(d => d.salespersonId === pendingVendorFilter);
    }
  } else if (listTab === 'sales') {
    docs = allSales;
  }

  if (typeFilter) docs = docs.filter(d => d.type === typeFilter || d.status === typeFilter);
  if (deliveryFilter) {
    docs = docs.filter(d => {
      // Excluir cotizaciones del filtro de entrega
      if (d.type === 'COTIZACION') return false;
      const status = d.deliveryStatus || 'PENDIENTE';
      return status === deliveryFilter;
    });
  }
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    docs = docs.filter(d => (d.code||'').toLowerCase().includes(q) || (d.invoiceNumber||'').toLowerCase().includes(q) || (d.customerName||'').toLowerCase().includes(q));
  }
  docs.sort((a,b) => (b.issueDate||'').localeCompare(a.issueDate||''));

  // Aplicar orden por columna seleccionada por el usuario (sobrescribe el default).
  docs = ui.sortRows(docs, sortDocs, {
    code:             d => d.code,
    invoiceNumber:    d => d.invoiceNumber,
    customerName:     d => (d.customerName || '').toLowerCase(),
    salespersonName:  d => (d.salespersonName || '').toLowerCase(),
    issueDate:        d => d.issueDate,
    dueDate:          d => d.dueDate,
    total:            d => d.total,
    type:             d => d.type,
    deliveryStatus:   d => d.deliveryStatus || '',
    status:           d => d.status
  });

  // Stats
  const counts = {
    pedidos: all.filter(d => d.type === 'PEDIDO').length,
    cotizaciones: all.filter(d => d.type === 'COTIZACION').length,
    facturas: all.filter(d => d.type === 'FACTURA').length
  };

  const isGerencial = (typeof auth !== 'undefined' && auth.getActiveMode() === 'gerencial');

  // Total facturado/vendido por moneda.
  //   - En modo Gerencial: cuenta TODO lo vendido (NE despachadas/entregadas + Facturas)
  //     porque es la visión real de cuánto se movió.
  //   - En modo Contable: solo FACTURAS porque es lo que entra al libro fiscal.
  const billedByCcy = { VES: 0, USD: 0, EUR: 0 };
  all.forEach(d => {
    if (d.cancelled) return;
    if (d.type === 'FACTURA') {
      billedByCcy[d.currency] = (billedByCcy[d.currency] || 0) + (d.total || 0);
    } else if (isGerencial && d.type === 'NOTA_ENTREGA') {
      // En gerencial sumamos NE solo si efectivamente se despachó/entregó
      if (d.deliveryStatus === 'DESPACHADO' || d.deliveryStatus === 'ENTREGADO') {
        billedByCcy[d.currency] = (billedByCcy[d.currency] || 0) + (d.total || 0);
      }
    }
  });
  const fmtMulti = (byCcy) => {
    const parts = [];
    if (byCcy.VES > 0.01) parts.push(currency.format(byCcy.VES, 'VES'));
    if (byCcy.USD > 0.01) parts.push(currency.format(byCcy.USD, 'USD'));
    if (byCcy.EUR > 0.01) parts.push(currency.format(byCcy.EUR, 'EUR'));
    return parts.length ? parts : ['0,00'];
  };
  const billedParts = fmtMulti(billedByCcy);
  const billedLabel = isGerencial ? 'Total vendido' : 'Total facturado';

  // KPI: Notas pendientes (NE entregadas/despachadas con saldo > 0 sin anular).
  // Usamos sales.isReceivable que ya filtra por todas las condiciones.
  const pendingNotes = all.filter(d => d.type === 'NOTA_ENTREGA' && sales.isReceivable(d));
  const pendingNotesAmount = { VES: 0, USD: 0, EUR: 0 };
  pendingNotes.forEach(d => {
    pendingNotesAmount[d.currency] = (pendingNotesAmount[d.currency] || 0) + ((d.total||0) - (d.paidAmount||0));
  });
  const pendingNotesParts = fmtMulti(pendingNotesAmount);

  const tableHtml = docs.length ? `<table>
    <thead><tr>
      <th onclick="onSortDocs('code')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Código', 'code', sortDocs)}</th>
      <th onclick="onSortDocs('invoiceNumber')" style="cursor:pointer;user-select:none;">${ui.sortHeader('N° Factura', 'invoiceNumber', sortDocs)}</th>
      <th onclick="onSortDocs('customerName')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Cliente', 'customerName', sortDocs)}</th>
      <th onclick="onSortDocs('salespersonName')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Vendedor', 'salespersonName', sortDocs)}</th>
      <th onclick="onSortDocs('issueDate')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Fecha', 'issueDate', sortDocs)}</th>
      <th onclick="onSortDocs('dueDate')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Vence', 'dueDate', sortDocs)}</th>
      <th onclick="onSortDocs('total')" style="cursor:pointer;user-select:none;text-align:right;">${ui.sortHeader('Total ' + (isGerencial ? 'USD' : 'Bs'), 'total', sortDocs)}</th>
      ${isGerencial ? `<th style="text-align:right;">Total Bs</th>` : ''}
      <th onclick="onSortDocs('type')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Tipo', 'type', sortDocs)}</th>
      <th onclick="onSortDocs('deliveryStatus')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Entrega', 'deliveryStatus', sortDocs)}</th>
      <th onclick="onSortDocs('status')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Estado', 'status', sortDocs)}</th>
      <th style="text-align:right;width:100px;">Acciones</th>
    </tr></thead>
    <tbody>${docs.map(d => {
      const today = new Date().toISOString().slice(0,10);
      const overdue = d.dueDate && d.dueDate < today && d.status !== 'PAID' && d.type === 'FACTURA';
      const tBadge = sales.STATUS[d.type]?.color || 'badge-plain';
      const sBadge = sales.STATUS[d.status]?.color || 'badge-plain';

      // Calcular USD y VES
      const isFrozen = !!d.rateAtFullPayment;
      let usdValue, vesValue;
      if (isFrozen) {
        usdValue = d.totalUSD_atFullPayment || 0;
        vesValue = d.totalVES_atFullPayment || 0;
      } else {
        const convVES = currency.toFiscal(d.total, d.currency, 'VES');
        const convUSD = currency.toFiscal(d.total, d.currency, 'USD');
        usdValue = d.currency === 'USD' ? d.total : convUSD.value;
        vesValue = d.currency === 'VES' ? d.total : convVES.value;
      }
      const lockIcon = isFrozen ? '<span title="Tasa congelada al pagar" style="opacity:0.6;font-size:10px;">🔒</span>' : '';

      return `<tr style="cursor:pointer;${d.cancelled?'opacity:0.5;':''}" onclick="openDetail('${d.id}')">
        <td><span class="td-mono td-strong">${d.code}</span></td>
        <td>${d.invoiceNumber ? `<span class="td-mono">${d.invoiceNumber}</span><div class="text-muted" style="font-size:11px;">Ctrl: ${d.controlNumber||'—'}</div>` : '<span class="td-muted">—</span>'}</td>
        <td><div class="td-strong">${ui.escape(d.customerName)}</div><div class="text-muted" style="font-size:11px;">${ui.escape(d.customerRif||'')}</div></td>
        <td>${d.salespersonName
          ? `<span style="font-size:12px;">${ui.escape(d.salespersonName)}</span>`
          : '<span class="td-muted" style="font-size:11px;">—</span>'}</td>
        <td><span class="text-muted">${ui.formatDate(d.issueDate)}</span></td>
        <td>${d.dueDate ? `<span class="${overdue?'badge badge-danger':'text-muted'}">${ui.formatDate(d.dueDate)}</span>` : '<span class="td-muted">—</span>'}</td>
        <td style="text-align:right;">
          <span class="td-mono td-strong">${currency.format(isGerencial ? usdValue : vesValue, isGerencial ? 'USD' : 'VES')}</span>
          ${lockIcon}
        </td>
        ${isGerencial ? `<td style="text-align:right;"><span class="td-mono text-muted" style="font-size:12px;">${currency.format(vesValue, 'VES')}</span></td>` : ''}
        <td><span class="badge ${tBadge}">${d.type}</span></td>
        <td>${(() => {
          if (d.type === 'COTIZACION') return '<span class="text-muted" style="font-size:11px;">N/A</span>';
          const ds = d.deliveryStatus || (d.cancelled ? null : null);
          if (!ds) return '<span class="td-muted">—</span>';
          if (ds === 'PENDIENTE')  return '<span class="badge badge-warning" style="font-size:10px;">📦 Pendiente</span>';
          if (ds === 'DESPACHADO') return '<span class="badge badge-accent" style="font-size:10px;">🚚 Despachado</span>';
          if (ds === 'ENTREGADO')  return '<span class="badge badge-success" style="font-size:10px;">✅ Entregado</span>';
          return '<span class="td-muted">—</span>';
        })()}</td>
        <td>${d.cancelled ? '<span class="badge badge-cancelled">Anulada</span>' : `<span class="badge ${sBadge}">${sales.STATUS[d.status]?.label || d.status}</span>`}</td>
        <td class="td-actions" onclick="event.stopPropagation()">
          ${(() => {
            // Botón "Cambiar vencimiento": solo si el doc está emitido, no anulado,
            // es NE/FACTURA, y todavía tiene saldo pendiente.
            const remaining = (d.total || 0) - (d.paidAmount || 0);
            const isPending = !d.cancelled
              && (d.type === 'NOTA_ENTREGA' || d.type === 'FACTURA')
              && remaining > 0.01;
            return isPending
              ? `<button class="btn-icon" onclick="openChangeDueDate('${d.id}')" title="Cambiar fecha de vencimiento">📅</button>`
              : '';
          })()}
          <button class="btn-icon" onclick="openDetail('${d.id}')">${ui.icon('edit')}</button>
        </td>
      </tr>`;
    }).join('')}</tbody></table>` : (all.length === 0 ?
      `<div class="empty-state"><div class="empty-state-icon">${ui.icon('flask')}</div><div class="empty-state-title">Sin documentos de venta</div><div class="empty-state-text">Crea tu primer pedido. Después podrás convertirlo en cotización o factura.</div></div>`
      : '<div class="empty-state"><div class="empty-state-title">Sin resultados</div></div>');

  // === PESTAÑAS: Ventas / Pendientes / Cuentas por cobrar ===
  // Conteos para los badges de las pestañas
  const pendingCount = pendingPlusRejected.length;
  const cxcCount = all.filter(d => sales.isReceivable(d)).length;
  const canApprove = auth.canApproveSales && auth.canApproveSales();
  const isSellerOnly = auth.isSeller && auth.isSeller();

  // Lista de vendedores con docs pendientes (para filtro en pestaña Pendientes)
  const pendingVendors = (() => {
    if (!canApprove) return [];
    const ids = new Set();
    pendingPlusRejected.forEach(d => { if (d.salespersonId) ids.add(d.salespersonId); });
    return Array.from(ids)
      .map(id => db.getById(db.COLLECTIONS.users, id))
      .filter(Boolean)
      .sort((a, b) => (a.fullName||a.username||'').localeCompare(b.fullName||b.username||''));
  })();

  const tabsHtml = `
    <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;gap:0;">
      <button class="btn btn-ghost" style="border-radius:0;border-bottom:2px solid ${listTab==='sales'?'var(--ink)':'transparent'};color:${listTab==='sales'?'var(--ink)':'var(--ink-3)'};font-weight:${listTab==='sales'?'600':'400'};" onclick="setListTab('sales')">Ventas (${allSales.length})</button>
      <button class="btn btn-ghost" style="border-radius:0;border-bottom:2px solid ${listTab==='pending'?'var(--ink)':'transparent'};color:${listTab==='pending'?'var(--ink)':'var(--ink-3)'};font-weight:${listTab==='pending'?'600':'400'};" onclick="setListTab('pending')">⏳ Pendientes de aprobación${pendingCount>0?` <span class="badge badge-warning" style="margin-left:6px;font-size:10px;">${pendingCount}</span>`:''}</button>
      <button class="btn btn-ghost" style="border-radius:0;border-bottom:2px solid ${listTab==='cxc'?'var(--ink)':'transparent'};color:${listTab==='cxc'?'var(--ink)':'var(--ink-3)'};font-weight:${listTab==='cxc'?'600':'400'};" onclick="setListTab('cxc')">💰 Cuentas por cobrar${cxcCount>0?` <span class="badge badge-plain" style="margin-left:6px;font-size:10px;">${cxcCount}</span>`:''}</button>
    </div>
  `;

  // Render condicional según pestaña:
  let mainContent;
  if (listTab === 'cxc') {
    mainContent = renderCuentasPorCobrar(all);
  } else if (listTab === 'pending') {
    mainContent = renderPendingTable(docs, pendingVendors, canApprove);
  } else {
    // Pestaña Ventas: tabla con toolbar de filtros (búsqueda, tipo, entrega)
    mainContent = `
      <div class="table-wrap">
        <div class="table-toolbar">
          <div class="search-box">${ui.icon('search')}<input id="search-input" class="input" type="search" placeholder="Buscar por código, factura o cliente..." value="${ui.escape(searchTerm)}" oninput="onSearch(this.value)"></div>
          <select class="select" style="max-width:200px;" onchange="onTypeFilter(this.value)">
            <option value="">Todos los tipos</option>
            <option value="PEDIDO" ${typeFilter==='PEDIDO'?'selected':''}>Pedidos</option>
            <option value="COTIZACION" ${typeFilter==='COTIZACION'?'selected':''}>Cotizaciones</option>
            <option value="NOTA_ENTREGA" ${typeFilter==='NOTA_ENTREGA'?'selected':''}>Notas de Entrega</option>
            <option value="FACTURA" ${typeFilter==='FACTURA'?'selected':''}>Facturas</option>
            <option value="PAID" ${typeFilter==='PAID'?'selected':''}>Pagadas</option>
            <option value="PARTIAL" ${typeFilter==='PARTIAL'?'selected':''}>Pago parcial</option>
            <option value="CANCELLED" ${typeFilter==='CANCELLED'?'selected':''}>Anuladas</option>
          </select>
          <select class="select" style="max-width:190px;" onchange="onDeliveryFilter(this.value)">
            <option value="">Todas las entregas</option>
            <option value="PENDIENTE" ${deliveryFilter==='PENDIENTE'?'selected':''}>📦 Pendientes de despacho</option>
            <option value="DESPACHADO" ${deliveryFilter==='DESPACHADO'?'selected':''}>🚚 Despachadas (sin entregar)</option>
            <option value="ENTREGADO" ${deliveryFilter==='ENTREGADO'?'selected':''}>✅ Entregadas</option>
          </select>
        </div>
        ${tableHtml}
      </div>
    `;
  }

  ui.renderLayout({
    activeModule: 'ventas', pageEyebrow: 'Comercial', pageTitle: 'Ventas',
    contentHtml: `
      <div class="action-bar">
        <div class="action-bar-left">
          <h2 class="action-bar-title">Ventas</h2>
          <span class="action-bar-count">${all.length} documentos · ${counts.pedidos} pedidos · ${counts.cotizaciones} cotizaciones · ${counts.facturas} facturas</span>
        </div>
        <div class="action-bar-right" style="display:flex;gap:8px;">
          <button class="btn btn-secondary" onclick="newDoc('NOTA_ENTREGA')" title="Sin IVA, no entra en libros fiscales">${ui.icon('file')} Nueva Nota de Entrega</button>
          <button class="btn btn-primary" onclick="newDoc('PEDIDO')">${ui.icon('plus')} Nuevo Pedido</button>
        </div>
      </div>

      <div class="grid grid-5 mb-24">
        <div class="kpi"><div class="kpi-label">Pedidos abiertos</div><div class="kpi-value">${all.filter(d=>d.type==='PEDIDO'&&!d.cancelled).length}</div><div class="kpi-value-sub">en gestión</div></div>
        <div class="kpi"><div class="kpi-label">Cotizaciones</div><div class="kpi-value">${all.filter(d=>d.type==='COTIZACION'&&!d.cancelled).length}</div><div class="kpi-value-sub">enviadas</div></div>
        <div class="kpi"><div class="kpi-label">Facturas</div><div class="kpi-value">${all.filter(d=>d.type==='FACTURA'&&!d.cancelled).length}</div><div class="kpi-value-sub">emitidas</div></div>
        <div class="kpi">
          <div class="kpi-label">Notas pendientes</div>
          <div class="kpi-value" style="color:${pendingNotes.length>0?'var(--warning, #c2410c)':'var(--ink-3)'};">${pendingNotes.length}</div>
          ${pendingNotes.length > 0
            ? `<div style="display:flex;flex-direction:column;gap:1px;margin-top:2px;">${pendingNotesParts.map(p => `<div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2);line-height:1.2;">${p}</div>`).join('')}</div>`
            : `<div class="kpi-value-sub">sin pendientes</div>`}
        </div>
        <div class="kpi">
          <div class="kpi-label">${billedLabel}</div>
          ${billedParts.length === 1
            ? `<div class="kpi-value" style="color:var(--accent-ink);font-size:22px;">${billedParts[0]}</div>`
            : `<div style="display:flex;flex-direction:column;gap:2px;margin-top:4px;">${billedParts.map(p => `<div style="font-family:var(--font-display);font-size:16px;letter-spacing:-0.02em;color:var(--accent-ink);line-height:1.2;">${p}</div>`).join('')}</div>`}
        </div>
      </div>

      ${tabsHtml}

      ${mainContent}
    `
  });
}

/**
 * Tabla de pestaña "Pendientes de aprobación".
 * - Vendedor: solo ve sus docs (ya filtrado por visibilidad)
 * - Admin/Gerente: ven todos y pueden filtrar por vendedor
 * Botones Aprobar / Rechazar solo aparecen para admin/gerente.
 */
function renderPendingTable(docs, pendingVendors, canApprove) {
  const filterBar = canApprove && pendingVendors.length > 0 ? `
    <div class="table-toolbar" style="gap:10px;">
      <span class="text-muted" style="font-size:12px;">Filtrar por vendedor:</span>
      <select class="select" style="max-width:240px;" onchange="setPendingVendorFilter(this.value)">
        <option value="">Todos los vendedores</option>
        ${pendingVendors.map(u => `<option value="${u.id}" ${pendingVendorFilter===u.id?'selected':''}>${ui.escape(u.fullName||u.username||'—')}</option>`).join('')}
      </select>
    </div>
  ` : '';

  if (!docs.length) {
    return `<div class="table-wrap">${filterBar}
      <div class="empty-state">
        <div class="empty-state-icon">⏳</div>
        <div class="empty-state-title">Sin pedidos pendientes de aprobación</div>
        <div class="empty-state-text">Los pedidos y notas de entrega que carguen los vendedores van a aparecer acá hasta que se aprueben.</div>
      </div>
    </div>`;
  }

  return `<div class="table-wrap">${filterBar}
    <table>
      <thead><tr>
        <th>Código</th>
        <th>Tipo</th>
        <th>Cliente</th>
        <th>Vendedor</th>
        <th>Fecha</th>
        <th style="text-align:right;">Total</th>
        <th>Estado</th>
        <th style="text-align:right;width:220px;">Acciones</th>
      </tr></thead>
      <tbody>${docs.map(d => {
        const isRejected = d.approvalStatus === 'REJECTED';
        const rowBg = isRejected ? 'background:#fee2e2;' : 'background:#fef3c7;';
        return `<tr style="${rowBg}cursor:pointer;" onclick="openDetail('${d.id}')">
          <td><span class="td-mono td-strong">${d.code}</span></td>
          <td><span class="badge ${d.type==='PEDIDO'?'badge-plain':'badge-accent'}" style="font-size:10px;">${d.type==='PEDIDO'?'Pedido':'Nota Ent.'}</span></td>
          <td>${ui.escape(d.customerName||'—')}</td>
          <td><span style="font-size:12px;">${ui.escape(d.salespersonName||'—')}</span></td>
          <td><span class="text-muted">${ui.formatDate(d.issueDate)}</span></td>
          <td style="text-align:right;"><span class="td-mono td-strong">${currency.format(d.total, d.currency)}</span></td>
          <td>
            ${isRejected
              ? `<span class="badge badge-danger" style="font-size:10px;">❌ Rechazado</span>${d.rejectionReason?`<div class="text-muted" style="font-size:10px;margin-top:2px;">${ui.escape(d.rejectionReason)}</div>`:''}`
              : `<span class="badge badge-warning" style="font-size:10px;">⏳ Pendiente</span>`}
          </td>
          <td class="td-actions" onclick="event.stopPropagation()" style="display:flex;gap:4px;justify-content:flex-end;">
            ${canApprove && !isRejected ? `
              <button class="btn btn-primary btn-sm" onclick="approveDoc('${d.id}')" style="font-size:11px;padding:4px 10px;">✓ Aprobar</button>
              <button class="btn btn-secondary btn-sm" onclick="openRejectModal('${d.id}')" style="font-size:11px;padding:4px 10px;">✕ Rechazar</button>
            ` : ''}
            <button class="btn-icon" onclick="openDetail('${d.id}')" title="Ver detalle">${ui.icon('edit')}</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>
  </div>`;
}


/** Cuadro de Cuentas por Cobrar: facturas Y NEs entregadas/despachadas con saldo pendiente */
function renderCuentasPorCobrar(allDocs) {
  const today = new Date().toISOString().slice(0,10);
  let pending = allDocs
    .filter(d => sales.isReceivable(d))
    .sort((a, b) => {
      if (!a.dueDate) return 1;
      if (!b.dueDate) return -1;
      return a.dueDate.localeCompare(b.dueDate);
    });

  // Aplicar orden por columna seleccionada por el usuario
  pending = ui.sortRows(pending, sortCXC, {
    invoiceNumber: d => d.invoiceNumber || d.code,
    customerName:  d => (d.customerName || '').toLowerCase(),
    issueDate:     d => d.issueDate,
    dueDate:       d => d.dueDate,
    total:         d => d.total,
    paidAmount:    d => d.paidAmount || 0,
    remaining:     d => d.total - (d.paidAmount || 0),
    type:          d => d.type,
    status:        d => d.status
  });

  if (!pending.length) {
    return `<div class="card mb-24" style="margin-top:32px;padding:0;">
      <div style="padding:18px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg, var(--accent-soft) 0%, transparent 100%);">
        <div class="card-title" style="display:flex;align-items:center;gap:8px;">💰 Cuentas por cobrar</div>
      </div>
      <div style="padding:32px;text-align:center;color:var(--ink-3);">
        ✓ No tenés documentos pendientes de cobro
      </div>
    </div>`;
  }

  // Desglose: cuántas facturas y cuántas NEs hay
  const facturasCount = pending.filter(d => d.type === 'FACTURA').length;
  const notasCount = pending.filter(d => d.type === 'NOTA_ENTREGA').length;
  const subtitleParts = [];
  if (facturasCount > 0) subtitleParts.push(`${facturasCount} factura${facturasCount!==1?'s':''}`);
  if (notasCount > 0) subtitleParts.push(`${notasCount} nota${notasCount!==1?'s':''} de entrega`);

  // Total por cobrar en USD
  const totalUSD = pending.reduce((s, d) => {
    const remaining = d.total - (d.paidAmount||0);
    if (d.currency === 'USD') return s + remaining;
    if (d.currency === 'VES') {
      const r = currency.getRate('BCV_USD');
      return s + (r?.value ? remaining / r.value : 0);
    }
    return s + remaining;
  }, 0);

  return `<div class="card mb-24" style="margin-top:32px;padding:0;">
    <div style="padding:18px 20px;border-bottom:1px solid var(--border);background:linear-gradient(180deg, #d1fae5 0%, transparent 100%);display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div class="card-title" style="display:flex;align-items:center;gap:8px;">💰 Cuentas por cobrar</div>
        <div class="text-muted" style="font-size:11px;margin-top:2px;">${subtitleParts.join(' · ')} · Total: ${currency.format(totalUSD, 'USD')} aprox.</div>
      </div>
    </div>
    <div class="table-wrap" style="border-radius:0;">
      <table>
        <thead><tr>
          <th onclick="onSortCXC('invoiceNumber')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Documento', 'invoiceNumber', sortCXC)}</th>
          <th onclick="onSortCXC('type')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Tipo', 'type', sortCXC)}</th>
          <th onclick="onSortCXC('customerName')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Cliente', 'customerName', sortCXC)}</th>
          <th onclick="onSortCXC('issueDate')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Emitida', 'issueDate', sortCXC)}</th>
          <th onclick="onSortCXC('dueDate')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Vence', 'dueDate', sortCXC)}</th>
          <th onclick="onSortCXC('total')" style="cursor:pointer;user-select:none;text-align:right;">${ui.sortHeader('Total', 'total', sortCXC)}</th>
          <th onclick="onSortCXC('paidAmount')" style="cursor:pointer;user-select:none;text-align:right;">${ui.sortHeader('Cobrado', 'paidAmount', sortCXC)}</th>
          <th onclick="onSortCXC('remaining')" style="cursor:pointer;user-select:none;text-align:right;">${ui.sortHeader('Pendiente', 'remaining', sortCXC)}</th>
          <th onclick="onSortCXC('status')" style="cursor:pointer;user-select:none;">${ui.sortHeader('Estado', 'status', sortCXC)}</th>
          <th style="text-align:right;width:280px;">Acciones</th>
        </tr></thead>
        <tbody>${pending.map(d => {
          const remaining = d.total - (d.paidAmount||0);
          const overdue = d.dueDate && d.dueDate < today;
          const customer = db.getById(db.COLLECTIONS.customers, d.customerId);
          const hasPhone = customer && (customer.whatsapp || customer.phone);
          const notifyUrl = hasPhone
            ? `notificaciones.html?quickSend=1&type=customer&id=${d.customerId}&template=COBRO_PENDIENTE_CLIENTE&docId=${d.id}`
            : `clientes.html`;
          const btnTitle = hasPhone ? 'Avisar al cliente por WhatsApp' : 'Sin WhatsApp · click para agregarlo';
          const s = sales.STATUS[d.status] || { label: d.status, color: 'badge-plain' };
          const isNE = d.type === 'NOTA_ENTREGA';

          return `<tr ${overdue?'style="background:#fef2f2;"':''}>
            <td>
              <span class="td-mono td-strong">${d.invoiceNumber||d.code}</span>
              ${d.controlNumber ? `<div class="text-muted" style="font-size:11px;">Ctrl: ${d.controlNumber}</div>` : ''}
            </td>
            <td><span class="badge ${isNE?'badge-plain':'badge-invoice'}" style="font-size:10px;">${isNE?'Nota Ent.':'Factura'}</span></td>
            <td>${ui.escape(d.customerName)}</td>
            <td><span class="text-muted" style="font-size:12px;">${ui.formatDate(d.issueDate)}</span></td>
            <td>
              ${d.dueDate
                ? `<span class="badge ${overdue?'badge-overdue':'badge-plain'}" style="font-size:10px;">${ui.formatDate(d.dueDate)}</span>`
                : '<span class="text-muted">—</span>'}
            </td>
            <td style="text-align:right;"><span class="td-mono">${currency.format(d.total, d.currency)}</span></td>
            <td style="text-align:right;"><span class="td-mono text-muted">${currency.format(d.paidAmount||0, d.currency)}</span></td>
            <td style="text-align:right;"><span class="td-mono td-strong" style="${overdue?'color:var(--danger);':''}">${currency.format(remaining, d.currency)}</span></td>
            <td><span class="badge ${s.color}" style="font-size:10px;">${s.label}</span></td>
            <td>
              <div style="display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap;">
                <button class="btn btn-ghost btn-sm" onclick="openDetail('${d.id}')" title="Ver detalle" style="font-size:11px;padding:4px 8px;">${ui.icon('eye')||'👁'} Ver</button>
                <a href="pagos.html?doc=${d.id}" class="btn btn-secondary btn-sm" title="Registrar cobro" style="font-size:11px;padding:4px 8px;text-decoration:none;">$ Cobrar</a>
                <a href="${notifyUrl}" class="btn ${hasPhone?'btn-secondary':'btn-ghost'} btn-sm" title="${btnTitle}" style="font-size:11px;padding:4px 8px;${!hasPhone?'opacity:0.5;':''}">📱 Avisar</a>
              </div>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
  </div>`;
}

function onDeliveryFilter(v) { deliveryFilter = v; render(); }

// ====== CREAR ======

function newDoc(initialType) {
  const customers = db.getAll(db.COLLECTIONS.customers);
  if (!customers.length) { ui.toast('Primero crea un cliente', 'error'); return; }
  const formulas = db.getAll(db.COLLECTIONS.formulas);
  const fgLots = db.getAll(db.COLLECTIONS.finishedGoods).filter(l => l.status === 'LIBERADO' && l.balance > 0);
  if (!formulas.length && !fgLots.length) {
    ui.toast('Necesitas fórmulas o lotes de PT liberados para vender', 'error', 4000);
    return;
  }

  const cfg = db.getById(db.COLLECTIONS.config, 'main') || {};
  const docType = initialType || 'PEDIDO';
  const codePrefix = docType === 'NOTA_ENTREGA' ? 'NE' : 'V';
  // Auto-asignar vendedor: usuario logueado (si tiene comisión habilitada)
  const me = auth.currentUser();
  const meUser = me ? db.query(db.COLLECTIONS.users, u => u.email === me.email)[0] : null;
  const autoVendor = (meUser && meUser.commissionEnabled) ? meUser : null;
  const issueDate = new Date().toISOString().slice(0,10);
  const defaultTerms = cfg.invoicePaymentTermsDefault || 'Contado';
  const defaultDays = parsePaymentTermsDays(defaultTerms);
  creating = {
    type: docType,
    code: db.nextCode(db.COLLECTIONS.salesOrders, codePrefix),
    customerId: '', customerName: '', customerAddress: '',
    currency: 'VES',
    rateType: cfg.defaultRateType || 'BCV_USD',
    issueDate: issueDate,
    dueDate: defaultDays > 0 ? addDaysToDateStr(issueDate, defaultDays) : '',
    paymentTerms: defaultTerms,
    items: [],
    notes: '',
    salespersonId: autoVendor ? autoVendor.id : '',
    salespersonName: autoVendor ? (autoVendor.fullName || autoVendor.username) : ''
  };
  view = 'create'; render();
}

function renderCreate() {
  const c = creating;
  const customers = db.getAll(db.COLLECTIONS.customers);
  const formulas = db.getAll(db.COLLECTIONS.formulas);

  // Helper local: label legible del tipo de documento
  const labelByType = (t) => ({ PEDIDO: 'Nuevo Pedido', NOTA_ENTREGA: 'Nueva Nota de Entrega', COTIZACION: 'Nueva Cotización', FACTURA: 'Nueva Factura' }[t] || 'Nuevo documento');

  // Cálculos
  const cfg = db.getById(db.COLLECTIONS.config, 'main') || {};
  const ivaRate = cfg.ivaRate || 16;
  const subtotal = c.items.reduce((s, it) => s + ((parseFloat(it.quantity)||0) * (parseFloat(it.unitPrice)||0) * (1 - (parseFloat(it.discount)||0)/100)), 0);
  const taxableBase = c.items.filter(it => !it.exempt).reduce((s, it) => s + ((parseFloat(it.quantity)||0) * (parseFloat(it.unitPrice)||0) * (1 - (parseFloat(it.discount)||0)/100)), 0);
  const ivaAmount = taxableBase * ivaRate / 100;
  const total = subtotal + ivaAmount;

  const itemsHtml = `<div class="card mb-24" style="padding:0;">
    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
      <div class="card-title" style="font-size:15px;">Ítems</div>
      <button class="btn btn-secondary btn-sm" onclick="addItem()">${ui.icon('plus')} Agregar producto</button>
    </div>
    ${c.items.length ? `<table>
      <thead><tr>
        <th style="width:25%;">Producto</th>
        <th style="text-align:right;">Cantidad</th>
        <th>Unidad</th>
        <th style="width:160px;">Precio</th>
        <th style="text-align:right;">Precio unit.</th>
        <th style="text-align:right;">Desc %</th>
        <th style="text-align:center;">Exento</th>
        <th style="text-align:right;">Subtotal</th>
        <th style="width:40px;"></th>
      </tr></thead>
      <tbody>${c.items.map((it, idx) => {
        // Productos disponibles: fórmulas + lotes sin fórmula con stock
        const lotsWithoutFormula = db.query(db.COLLECTIONS.finishedGoods, l => !l.formulaId && l.status === 'LIBERADO' && (l.balance||0) > 0);

        return `<tr>
          <td>${renderSalesProductPicker(idx, it, formulas, lotsWithoutFormula)}</td>
          <td style="text-align:right;"><input class="input" type="number" step="0.001" value="${it.quantity||''}" style="text-align:right;font-family:var(--font-mono);" oninput="updateItemFast(${idx},'quantity',this.value)"></td>
          <td><span class="text-muted" id="ven-unit-${idx}">${it.unit||'—'}</span></td>
          <td>
            <select class="select" onchange="updateItemPriceType(${idx}, this.value)" style="font-size:11.5px;">
              <option value="distributor" ${(it.priceType||'distributor')==='distributor'?'selected':''}>Distribuidor</option>
              <option value="pharmacy" ${it.priceType==='pharmacy'?'selected':''}>Peluquería</option>
              <option value="custom" ${it.priceType==='custom'?'selected':''}>Personalizado</option>
            </select>
          </td>
          <td style="text-align:right;"><input class="input" type="number" step="0.0001" value="${it.unitPrice||''}" style="text-align:right;font-family:var(--font-mono);" oninput="updateItemFast(${idx},'unitPrice',this.value)" ${it.priceType && it.priceType !== 'custom' ? 'readonly' : ''}></td>
          <td style="text-align:right;"><input class="input" type="number" step="0.01" value="${it.discount||0}" style="text-align:right;font-family:var(--font-mono);width:80px;" oninput="updateItemFast(${idx},'discount',this.value)"></td>
          <td style="text-align:center;"><input type="checkbox" ${it.exempt?'checked':''} onchange="updateItemExempt(${idx}, this.checked)"></td>
          <td style="text-align:right;"><span class="td-mono td-strong" id="ven-line-${idx}">${currency.format((it.quantity||0)*(it.unitPrice||0)*(1-(it.discount||0)/100), c.currency)}</span></td>
          <td><button class="btn-icon" onclick="removeItem(${idx})">${ui.icon('trash')}</button></td>
        </tr>`;
      }).join('')}</tbody>
    </table>` : '<div style="padding:32px;text-align:center;color:var(--ink-3);">Sin productos. Agregá al menos uno.</div>'}
  </div>`;

  // Disponibilidad de cada producto
  const stockInfoHtml = c.items.length && c.items.some(it => it.formulaId) ? `<div class="card mb-24" style="padding:14px 18px;background:#eff6ff;border-color:#bfdbfe;">
    <div style="font-size:12.5px;color:#1e3a8a;line-height:1.6;">
      <strong>📦 Stock disponible (Producto Terminado liberado):</strong>
      <div style="margin-top:6px;">${c.items.filter(it => it.formulaId).map(it => {
        const f = db.getById(db.COLLECTIONS.formulas, it.formulaId);
        const lots = db.query(db.COLLECTIONS.finishedGoods, l => l.formulaId === it.formulaId && l.status === 'LIBERADO' && (l.balance - (l.reserved||0)) > 0);
        const totalAvail = lots.reduce((s,l) => s + (l.balance - (l.reserved||0)), 0);
        const enough = totalAvail >= it.quantity;
        return `<div style="${!enough?'color:var(--danger);':''}">${ui.escape(f?.name||'')}: ${totalAvail.toFixed(3)} ${lots[0]?.unit||''} disponible${enough?' ✓':` (faltan ${(it.quantity - totalAvail).toFixed(3)})`}</div>`;
      }).join('')}</div>
    </div>
  </div>` : '';

  ui.renderLayout({
    activeModule: 'ventas', pageEyebrow: 'Nuevo pedido', pageTitle: c.code,
    contentHtml: `
      <div class="action-bar" style="margin-bottom:18px;">
        <div class="action-bar-left">
          <h2 class="action-bar-title">${labelByType(c.type)}</h2>
          <span class="action-bar-count">${c.items.length} ítem(s) · Total: ${currency.format(total, c.currency)}</span>
        </div>
        <div class="action-bar-right" style="display:flex;gap:8px;">
          <button class="btn btn-secondary" onclick="cancelCreate()">← Cancelar</button>
          <button class="btn btn-primary" onclick="saveDoc()">${ui.icon('check')} Crear ${labelByType(c.type).toLowerCase()}</button>
        </div>
      </div>

      <div class="card mb-24">
        <div class="card-header"><div class="card-title">Información</div></div>
        <div class="form-grid form-grid-2">
          <div class="field"><label class="field-label">Código</label><input class="input" value="${c.code}" disabled style="font-family:var(--font-mono);"></div>
          <div class="field"><label class="field-label">Cliente *</label><select class="select" onchange="onCustomerChange(this.value)">
            <option value="">— Selecciona —</option>
            ${customers.map(cu => `<option value="${cu.id}" ${cu.id===c.customerId?'selected':''}>${ui.escape(cu.name)} · ${ui.escape(cu.rif||'')}</option>`).join('')}
          </select></div>
          <div class="field" style="grid-column:1/-1;"><label class="field-label">Dirección</label>
            <input class="input" value="${ui.escape(c.customerAddress||'')}" placeholder="${c.customerId ? 'Sin dirección registrada — podés escribirla acá' : 'Selecciona un cliente para autocompletar'}" oninput="creating.customerAddress=this.value">
            <div class="field-hint">Se autocompleta al elegir el cliente. Podés editarla solo para este pedido sin afectar la ficha del cliente.</div>
          </div>
          <div class="field"><label class="field-label">Fecha emisión</label><input class="input" type="date" value="${c.issueDate}" onchange="onIssueDateChange(this.value)"></div>
          <div class="field"><label class="field-label">Vencimiento</label><input id="ven-due-date" class="input" type="date" value="${c.dueDate||''}" onchange="onDueDateChange(this.value)"></div>
          <div class="field"><label class="field-label">Términos de pago (días)</label>
            <div style="display:flex;gap:8px;align-items:center;">
              <input id="ven-terms-days" class="input" type="number" min="0" step="1" value="${parsePaymentTermsDays(c.paymentTerms)}" placeholder="0 = Contado" style="flex:1;font-family:var(--font-mono);text-align:right;" oninput="onPaymentTermsDaysChange(this.value)">
              <span style="color:var(--ink-3);font-size:12px;white-space:nowrap;">días</span>
            </div>
            <div style="font-size:11px;color:var(--ink-3);margin-top:4px;">Actual: <strong id="ven-terms-label">${ui.escape(c.paymentTerms||'Contado')}</strong> · El vencimiento se recalcula automáticamente</div>
          </div>
          <div class="field"><label class="field-label">Moneda</label><select class="select" onchange="creating.currency=this.value;render()">
            <option value="VES" ${c.currency==='VES'?'selected':''}>Bolívares (VES)</option>
            <option value="USD" ${c.currency==='USD'?'selected':''}>Dólares (USD)</option>
            <option value="EUR" ${c.currency==='EUR'?'selected':''}>Euros (EUR)</option>
          </select></div>
          ${(() => {
            const me = auth.currentUser();
            const isAdmin = me && (me.role === 'admin' || me.role === 'gerente');
            const vendors = db.getAll(db.COLLECTIONS.users).filter(u => u.commissionEnabled === true && u.active !== false);
            if (isAdmin) {
              return `<div class="field"><label class="field-label">Vendedor (comisión)</label><select class="select" onchange="setSalesperson(this.value)">
                <option value="">— Sin comisión —</option>
                ${vendors.map(v => `<option value="${v.id}" ${v.id===c.salespersonId?'selected':''}>${ui.escape(v.fullName||v.username)}</option>`).join('')}
              </select><div class="field-hint">Quién genera comisión por esta venta. Solo admins pueden cambiar.</div></div>`;
            } else if (c.salespersonName) {
              return `<div class="field"><label class="field-label">Vendedor</label><input class="input" value="${ui.escape(c.salespersonName)}" disabled><div class="field-hint">Solo un admin puede cambiarlo.</div></div>`;
            }
            return '';
          })()}
          ${c.currency !== 'VES' ? `<div class="field" style="grid-column:1/-1;"><label class="field-label">Tasa para conversión a Bs (libro de ventas)</label><select class="select" onchange="creating.rateType=this.value">${currency.getRates().map(r => `<option value="${r.type}" ${r.type===c.rateType?'selected':''}>${r.label} (${r.value.toFixed(2)})</option>`).join('')}</select><div class="field-hint">SENIAT exige reportar todo en Bs aunque factures en USD</div></div>` : ''}

        <div class="card-header"><div class="card-title">Notas</div></div>
        <textarea class="textarea" onchange="creating.notes=this.value">${ui.escape(c.notes||'')}</textarea>
      </div>

      <div style="display:flex;justify-content:space-between;gap:8px;padding:24px 0;border-top:1px solid var(--border);margin-top:24px;">
        <button class="btn btn-secondary" onclick="cancelCreate()">← Cancelar</button>
        <button class="btn btn-primary" onclick="saveDoc()">${ui.icon('check')} Crear ${labelByType(c.type).toLowerCase()}</button>
      </div>
      <div style="height:40px;"></div>
