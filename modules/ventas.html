}

function renderVenSummary(subtotal, ivaAmount, total, ivaRate, c) {
  const exemptTotal = c.items.filter(it => it.exempt).reduce((s, it) => s + ((parseFloat(it.quantity)||0) * (parseFloat(it.unitPrice)||0) * (1 - (parseFloat(it.discount)||0)/100)), 0);
  return [
    ['Subtotal', currency.format(subtotal, c.currency), false],
    ...(exemptTotal > 0 ? [[`Exento de IVA`, currency.format(exemptTotal, c.currency), false]] : []),
    [`IVA ${ivaRate}%`, currency.format(ivaAmount, c.currency), false],
    ['Total', currency.format(total, c.currency), true, true]
  ].map(([label, val, strong, accent]) => `
    <div class="list-row" style="grid-template-columns:1fr auto;border:none;padding:10px 0;${accent?'border-top:1px solid var(--border);background:var(--accent-soft);margin:0 -20px;padding:14px 20px;':''}">
      <span style="font-size:13px;${strong?'font-weight:600;':''}${accent?'color:var(--accent-ink);font-weight:600;':''}">${label}</span>
      <span class="${strong?'td-mono td-strong':'td-mono'}" style="font-size:14px;${accent?'color:var(--accent-ink);font-size:18px;font-family:var(--font-display);font-style:italic;':''}">${val}</span>
    </div>
  `).join('');
}

function onCustomerChange(cid) {
  creating.customerId = cid;
  const cu = db.getById(db.COLLECTIONS.customers, cid);
  if (cu) {
    creating.customerName = cu.name;
    creating.customerAddress = cu.address || '';
    if (cu.preferredCurrency) creating.currency = cu.preferredCurrency;
    if (cu.paymentTerms) {
      creating.paymentTerms = cu.paymentTerms;
      // Recalcular vencimiento según los días que vengan del cliente
      const days = parsePaymentTermsDays(cu.paymentTerms);
      creating.dueDate = addDaysToDateStr(creating.issueDate, days);
    }
  } else {
    creating.customerAddress = '';
  }
  render();
}

/**
 * Extrae los días de un string de términos de pago.
 * "30 días" → 30, "Contado" → 0, "" → 0, "15" → 15
 */
function parsePaymentTermsDays(terms) {
  if (!terms) return 0;
  if (typeof terms === 'number') return terms;
  const s = String(terms).trim().toLowerCase();
  if (s === 'contado' || s === '') return 0;
  const m = s.match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
}

/**
 * Suma días a una fecha en formato 'YYYY-MM-DD' y devuelve string en el mismo formato.
 * Usa parsing local para evitar corrimientos de zona horaria.
 */
function addDaysToDateStr(dateStr, days) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(n => parseInt(n, 10));
  const dt = new Date(y, (m||1) - 1, d||1);
  dt.setDate(dt.getDate() + (parseInt(days, 10) || 0));
  const yy = dt.getFullYear();
  const mm = String(dt.getMonth() + 1).padStart(2, '0');
  const dd = String(dt.getDate()).padStart(2, '0');
  return `${yy}-${mm}-${dd}`;
}

/**
 * Calcula la diferencia en días entre dos fechas 'YYYY-MM-DD' (b - a).
 */
function daysBetweenDateStr(a, b) {
  if (!a || !b) return 0;
  const [ya, ma, da] = a.split('-').map(n => parseInt(n, 10));
  const [yb, mb, db_] = b.split('-').map(n => parseInt(n, 10));
  const dA = new Date(ya, (ma||1) - 1, da||1);
  const dB = new Date(yb, (mb||1) - 1, db_||1);
  const ms = dB.getTime() - dA.getTime();
  return Math.round(ms / (1000 * 60 * 60 * 24));
}

/** El usuario escribe la cantidad de días → recalcula vencimiento y paymentTerms */
function onPaymentTermsDaysChange(val) {
  const days = Math.max(0, parseInt(val, 10) || 0);
  creating.paymentTerms = days === 0 ? 'Contado' : `${days} días`;
  creating.dueDate = days === 0 ? '' : addDaysToDateStr(creating.issueDate, days);
  // Update parcial sin re-render (para no perder el foco mientras se escribe)
  const dueEl = document.getElementById('ven-due-date');
  if (dueEl) dueEl.value = creating.dueDate || '';
  const labelEl = document.getElementById('ven-terms-label');
  if (labelEl) labelEl.textContent = creating.paymentTerms || 'Contado';
}

/** El usuario cambia la fecha de emisión → recalcula vencimiento manteniendo los días */
function onIssueDateChange(val) {
  creating.issueDate = val;
  const days = parsePaymentTermsDays(creating.paymentTerms);
  if (days > 0) {
    creating.dueDate = addDaysToDateStr(val, days);
  }
  // Si es doc en moneda extranjera, mostrar info sobre la tasa BCV de ese día.
  // El doc se va a guardar con la tasa histórica de esa fecha (no la de hoy).
  if (creating.currency && creating.currency !== 'VES' && currency.getRateOnDate) {
    const info = currency.getRateOnDate(val, creating.rateType || 'BCV_USD');
    if (info?.value && !info.found && info.date) {
      ui.toast(`Tasa BCV no cargada para ${val}. Se usará la del ${info.date} (${info.value.toLocaleString('es-VE',{maximumFractionDigits:4})}). Si querés otra, cargala en Tasas de Cambio.`, 'warning', 6500);
    }
  }
  render();
}

/** El usuario cambia el vencimiento manualmente → recalcula los días y paymentTerms */
function onDueDateChange(val) {
  creating.dueDate = val;
  if (!val) {
    creating.paymentTerms = 'Contado';
  } else {
    const days = Math.max(0, daysBetweenDateStr(creating.issueDate, val));
    creating.paymentTerms = days === 0 ? 'Contado' : `${days} días`;
  }
  render();
}

function setSalesperson(userId) {
  if (!userId) {
    creating.salespersonId = '';
    creating.salespersonName = '';
    return;
  }
  const u = db.getById(db.COLLECTIONS.users, userId);
  if (u) {
    creating.salespersonId = u.id;
    creating.salespersonName = u.fullName || u.username;
  }
}

function addItem() {
  creating.items.push({ formulaId: '', formulaName: '', fgLotId: null, description: '', quantity: 0, unit: 'unidad', unitPrice: 0, discount: 0, exempt: false, priceType: 'distributor' });
  render();
}

// ==========================================================================
// ====== BUSCADOR DE PRODUCTOS PARA NUEVA VENTA ======
// ==========================================================================
// Estado por fila: query, dropdown abierto/cerrado, etc.
// Vive aparte del documento (creating) porque son detalles de UI, no datos.
const _salesPickerState = {};

/**
 * Renderiza la celda del selector de producto.
 * - Si ya hay producto seleccionado → pill verde con nombre + botón "cambiar".
 * - Si no → input de búsqueda con dropdown desplegable.
 */
function renderSalesProductPicker(idx, item, formulas, lotsWithoutFormula) {
  const state = _salesPickerState[idx] || {};
  const hasProduct = item.formulaId || item.fgLotId;

  // Estado: producto ya seleccionado → pill
  if (hasProduct && !state.changing) {
    let label = item.formulaName || item.description || '—';
    let code = '';
    let extra = '';
    if (item.fgLotId) {
      const lot = db.getById(db.COLLECTIONS.finishedGoods, item.fgLotId);
      if (lot) {
        code = lot.code;
        extra = `(${lot.balance} ${lot.unit||''})`;
        label = lot.productName || lot.formulaName || label;
      }
    } else if (item.formulaId) {
      const f = db.getById(db.COLLECTIONS.formulas, item.formulaId);
      if (f) {
        code = f.code;
      }
    }
    return `
      <div style="display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;">
        <div style="flex:1;min-width:0;">
          ${code ? `<div class="td-mono" style="font-size:11px;color:var(--ink-3);">${ui.escape(code)}</div>` : ''}
          <div style="font-size:12.5px;font-weight:500;line-height:1.3;">${ui.escape(label)}</div>
          ${extra ? `<div class="text-muted" style="font-size:10.5px;">${extra}</div>` : ''}
        </div>
        <button class="btn-icon" onclick="changeSalesProduct(${idx})" title="Cambiar producto">${ui.icon('edit')||'✎'}</button>
      </div>
    `;
  }

  // Estado: buscador con dropdown
  // El dropdown va con position:fixed para escapar el overflow del card padre.
  return `
    <div style="position:relative;">
      <input id="ven-prod-search-${idx}" class="input" placeholder="Buscar producto por nombre o código..."
             value="${ui.escape(state.query||'')}"
             oninput="onSalesProductSearch(${idx},this.value)"
             onfocus="openSalesProductDropdown(${idx})"
             onblur="setTimeout(()=>closeSalesProductDropdown(${idx}),200)"
             autocomplete="off"
             style="font-size:12px;">
      <div id="ven-prod-dropdown-${idx}"
           style="display:none;position:fixed;background:white;border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 16px rgba(0,0,0,0.15);z-index:9999;max-height:280px;overflow-y:auto;">
      </div>
    </div>
  `;
}

/** Genera el HTML del dropdown filtrado por query */
function renderSalesDropdownContent(idx) {
  const state = _salesPickerState[idx] || {};
  const query = (state.query || '').trim().toLowerCase();
  const formulas = db.getAll(db.COLLECTIONS.formulas);
  const lotsWithoutFormula = db.query(db.COLLECTIONS.finishedGoods, l => !l.formulaId && l.status === 'LIBERADO' && (l.balance||0) > 0);

  // Filtrar por query
  const matchesF = formulas.filter(f => {
    if (!query) return true;
    return (f.name||'').toLowerCase().includes(query)
        || (f.code||'').toLowerCase().includes(query);
  }).slice(0, 10);

  const matchesL = lotsWithoutFormula.filter(l => {
    if (!query) return true;
    return ((l.productName||l.formulaName)||'').toLowerCase().includes(query)
        || (l.code||'').toLowerCase().includes(query);
  }).slice(0, 10);

  const noMatches = query && matchesF.length === 0 && matchesL.length === 0;

  if (noMatches) {
    return `<div style="padding:14px 12px;font-size:12px;color:var(--ink-3);text-align:center;">
      Sin coincidencias para "<strong>${ui.escape(state.query)}</strong>"
    </div>`;
  }

  let html = '';

  if (matchesF.length) {
    html += `<div style="padding:6px 10px;font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;background:var(--surface-2);border-bottom:1px solid var(--border);">Fórmulas (${matchesF.length})</div>`;
    html += matchesF.map(f => `
      <div onmousedown="event.preventDefault()" onclick="selectSalesProduct(${idx},'formula:${f.id}')"
           style="padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--border);"
           onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background='white'">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <div style="min-width:0;flex:1;">
            <span class="td-mono" style="font-size:11px;color:var(--ink-3);">${ui.escape(f.code)}</span>
            <div style="font-size:13px;font-weight:500;">${ui.escape(f.name)}</div>
          </div>
        </div>
      </div>
    `).join('');
  }

  if (matchesL.length) {
    html += `<div style="padding:6px 10px;font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;background:var(--surface-2);border-bottom:1px solid var(--border);">Productos sin fabricación (${matchesL.length})</div>`;
    html += matchesL.map(l => `
      <div onmousedown="event.preventDefault()" onclick="selectSalesProduct(${idx},'lot:${l.id}')"
           style="padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--border);"
           onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background='white'">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <div style="min-width:0;flex:1;">
            <span class="td-mono" style="font-size:11px;color:var(--ink-3);">${ui.escape(l.code)}</span>
            <div style="font-size:13px;font-weight:500;">${ui.escape(l.productName||l.formulaName||'—')}</div>
            <div class="text-muted" style="font-size:10.5px;">Stock: ${l.balance} ${l.unit||''}</div>
          </div>
        </div>
      </div>
    `).join('');
  }

  return html;
}

/**
 * Posiciona el dropdown (position:fixed) debajo del input de búsqueda.
 * Si no entra debajo, lo muestra arriba.
 */
function positionSalesDropdown(idx) {
  const inp = document.getElementById(`ven-prod-search-${idx}`);
  const dd = document.getElementById(`ven-prod-dropdown-${idx}`);
  if (!inp || !dd) return;
  const r = inp.getBoundingClientRect();
  dd.style.left  = r.left + 'px';
  dd.style.top   = (r.bottom + 2) + 'px';
  dd.style.width = r.width + 'px';
  const ddHeight = 280;
  const spaceBelow = window.innerHeight - r.bottom;
  if (spaceBelow < ddHeight && r.top > ddHeight) {
    dd.style.top = (r.top - ddHeight - 2) + 'px';
    dd.style.maxHeight = (r.top - 8) + 'px';
  } else {
    dd.style.maxHeight = Math.min(ddHeight, spaceBelow - 8) + 'px';
  }
}

function onSalesProductSearch(idx, val) {
  if (!_salesPickerState[idx]) _salesPickerState[idx] = {};
  _salesPickerState[idx].query = val;
  _salesPickerState[idx].open = true;
  // Solo actualizar el dropdown — no tocar el input para preservar el foco
  const dd = document.getElementById(`ven-prod-dropdown-${idx}`);
  if (dd) {
    dd.innerHTML = renderSalesDropdownContent(idx);
    dd.style.display = 'block';
    positionSalesDropdown(idx);
  }
}

function openSalesProductDropdown(idx) {
  if (!_salesPickerState[idx]) _salesPickerState[idx] = {};
  _salesPickerState[idx].open = true;
  const dd = document.getElementById(`ven-prod-dropdown-${idx}`);
  if (dd) {
    dd.innerHTML = renderSalesDropdownContent(idx);
    dd.style.display = 'block';
    positionSalesDropdown(idx);
  }
}

function closeSalesProductDropdown(idx) {
  if (!_salesPickerState[idx]) return;
  _salesPickerState[idx].open = false;
  const dd = document.getElementById(`ven-prod-dropdown-${idx}`);
  if (dd) dd.style.display = 'none';
}

function selectSalesProduct(idx, key) {
  // Limpiar estado del picker para esta fila
  delete _salesPickerState[idx];
  // Aplicar la selección igual que el viejo onchange
  updateItemProduct(idx, key);
}

/** Cambiar el producto ya seleccionado → vuelve al modo buscador */
function changeSalesProduct(idx) {
  if (!_salesPickerState[idx]) _salesPickerState[idx] = {};
  _salesPickerState[idx].changing = true;
  _salesPickerState[idx].query = '';
  // Limpiar la selección actual del item
  const item = creating.items[idx];
  item.formulaId = '';
  item.formulaName = '';
  item.fgLotId = null;
  item._productKey = '';
  item.unitPrice = 0;
  render();
}

/**
 * Selecciona un producto. Soporta dos formatos:
 *   - "formula:<formulaId>"  → fórmula tradicional
 *   - "lot:<lotId>"          → lote sin fórmula (carga inicial)
 */
function updateItemProduct(idx, key) {
  const item = creating.items[idx];
  if (!key) {
    item.formulaId = '';
    item.formulaName = '';
    item.fgLotId = null;
    item._productKey = '';
    item.unitPrice = 0;
    render();
    return;
  }
  const [kind, id] = key.split(':');
  item._productKey = key;

  if (kind === 'formula') {
    const f = db.getById(db.COLLECTIONS.formulas, id);
    if (f) {
      item.formulaId = id;
      item.formulaName = f.name;
      item.description = f.name;
      item.unit = f.batchUnit || 'unidad';
      item.fgLotId = null;
      // Tomar precio del primer lote PT vinculado a esta fórmula (si existe)
      const lot = db.query(db.COLLECTIONS.finishedGoods, l => l.formulaId === id && l.status === 'LIBERADO' && (l.balance||0) > 0)[0];
      if (lot) {
        item._priceDistributor = lot.priceDistributor || 0;
        item._pricePharmacy = lot.pricePharmacy || 0;
      } else {
        item._priceDistributor = 0;
        item._pricePharmacy = 0;
      }
    }
  } else if (kind === 'lot') {
    const l = db.getById(db.COLLECTIONS.finishedGoods, id);
    if (l) {
      item.formulaId = l.formulaId || '';
      item.formulaName = l.productName || l.formulaName;
      item.description = item.formulaName;
      item.unit = l.unit || 'unidad';
      item.fgLotId = l.id;
      item._priceDistributor = l.priceDistributor || 0;
      item._pricePharmacy = l.pricePharmacy || 0;
    }
  }

  // Aplicar el precio según el tipo seleccionado actualmente
  applyPriceTypeToItem(idx);
  render();
}

/** Aplica el precio según el priceType del item (distributor/pharmacy/custom) */
function applyPriceTypeToItem(idx) {
  const item = creating.items[idx];
  if (!item) return;
  const type = item.priceType || 'distributor';
  if (type === 'distributor') {
    item.unitPrice = item._priceDistributor || 0;
  } else if (type === 'pharmacy') {
    item.unitPrice = item._pricePharmacy || 0;
  }
  // Si es custom, no toco el precio (el usuario lo edita)
}

function updateItemPriceType(idx, type) {
  creating.items[idx].priceType = type;
  applyPriceTypeToItem(idx);
  render();
}

// Mantener backward compat: si algún lugar todavía llama a updateItemFormula, redirigir
function updateItemFormula(idx, fid) {
  updateItemProduct(idx, fid ? `formula:${fid}` : '');
}

function updateItemFast(idx, field, val) {
  const num = parseFloat(val) || 0;
  creating.items[idx][field] = num;
  // Actualizar línea
  const item = creating.items[idx];
  const line = (item.quantity||0) * (item.unitPrice||0) * (1 - (item.discount||0)/100);
  const lineEl = document.getElementById(`ven-line-${idx}`);
  if (lineEl) lineEl.textContent = currency.format(line, creating.currency);
  // Actualizar totales
  recomputeAndRefreshSummary();
}

function updateItemExempt(idx, checked) {
  creating.items[idx].exempt = checked;
  recomputeAndRefreshSummary();
}

function recomputeAndRefreshSummary() {
  const cfg = db.getById(db.COLLECTIONS.config, 'main') || {};
  const ivaRate = cfg.ivaRate || 16;
  const subtotal = creating.items.reduce((s, it) => s + ((parseFloat(it.quantity)||0) * (parseFloat(it.unitPrice)||0) * (1 - (parseFloat(it.discount)||0)/100)), 0);
  const taxableBase = creating.items.filter(it => !it.exempt).reduce((s, it) => s + ((parseFloat(it.quantity)||0) * (parseFloat(it.unitPrice)||0) * (1 - (parseFloat(it.discount)||0)/100)), 0);
  const ivaAmount = taxableBase * ivaRate / 100;
  const total = subtotal + ivaAmount;
  const summaryBody = document.getElementById('ven-summary-body');
  if (summaryBody) summaryBody.innerHTML = renderVenSummary(subtotal, ivaAmount, total, ivaRate, creating);
}

function removeItem(idx) {
  creating.items.splice(idx, 1);
  render();
}

function cancelCreate() { creating = null; view = 'list'; render(); }

function saveDoc() {
  const c = creating;
  if (!c.customerId) { ui.toast('Selecciona un cliente', 'error'); return; }
  if (!c.items.length) { ui.toast('Agrega al menos un ítem', 'error'); return; }
  for (const it of c.items) {
    // Acepta items con fórmula tradicional O con lote sin fórmula (carga inicial vía ingreso)
    if (!it.formulaId && !it.fgLotId) { ui.toast('Cada ítem debe tener producto seleccionado', 'error'); return; }
    if (!it.quantity || it.quantity <= 0) { ui.toast('Cada ítem debe tener cantidad', 'error'); return; }
    if (!it.unitPrice || it.unitPrice <= 0) { ui.toast('Cada ítem debe tener precio', 'error'); return; }
  }

  // Verificar disponibilidad (solo para tipos que afectan stock)
  if (sales.STOCK_AFFECTING_TYPES.includes(c.type || 'PEDIDO')) {
    const check = sales.checkStockAvailability(c.items);
    if (!check.ok) {
      // Mostrar warning y pedir confirmación
      const lines = check.warnings.map(w =>
        `· ${w.formulaName}: pediste ${w.requested}, disponible ${w.available} (faltan ${w.missing})`
      ).join('\n');
      const confirmed = confirm(
        `⚠️ ATENCIÓN: Stock insuficiente\n\n${lines}\n\n` +
        `El sistema descontará todo lo disponible y dejará el resto como faltante.\n` +
        `Podés reponer producto y luego completar.\n\n` +
        `¿Querés guardar el documento igual?`
      );
      if (!confirmed) return;
    }
  }

  try {
    const doc = sales.create({
      customerId: c.customerId,
      currency: c.currency,
      rateType: c.rateType,
      items: c.items,
      status: c.type || 'PEDIDO',
      notes: c.notes,
      paymentTerms: c.paymentTerms,
      dueDate: c.dueDate,
      issueDate: c.issueDate,
      salespersonId: c.salespersonId || null,
      salespersonName: c.salespersonName || '',
      customerAddress: c.customerAddress || ''
    });
    const labels = { PEDIDO: 'Pedido', NOTA_ENTREGA: 'Nota de Entrega', COTIZACION: 'Cotización', FACTURA: 'Factura' };
    ui.toast(`${labels[c.type] || 'Pedido'} creada`, 'success');

    // Ya no se redirige a assignLots: el create automáticamente asigna FEFO.
    // El usuario puede cambiar lotes manualmente desde el detalle.
    selectedId = doc.id; view = 'detail'; creating = null;
    render();
  } catch (err) {
    ui.toast(err.message, 'error');
  }
}

// ====== DETALLE ======

function openDetail(id) { selectedId = id; view = 'detail'; render(); }
function backToList() { view = 'list'; selectedId = null; render(); }

// ====== ESTADO DE ENTREGA / LOGÍSTICA ======

/**
 * Renderiza el card de "Estado de entrega" en la pantalla de detalle.
 * Muestra el flujo PENDIENTE → DESPACHADO → ENTREGADO con datos asociados
 * y los botones para avanzar el estado.
 */
function renderDeliveryCard(d) {
  // Cotizaciones no se entregan
  if (!d || d.type === 'COTIZACION' || d.deliveryStatus === 'NO_APLICA') return '';
  // Documentos viejos sin estado de entrega: mostrar opción de iniciar el seguimiento
  // pero de forma más sutil (el dato no se perdió, simplemente no se cargó).
  const hasNoStatus = !d.deliveryStatus;
  const status = d.deliveryStatus || 'PENDIENTE';
  const cancelled = d.cancelled;

  // Cálculo del aviso de vencimiento recalculado
  const daysCredit = parsePaymentTermsDays(d.paymentTerms);
  let dueHint = '';
  if (daysCredit > 0 && d.dueDateAuto !== false) {
    if (status === 'ENTREGADO' && d.deliveredDate) {
      dueHint = `Vence el <strong>${ui.formatDate(d.dueDate)}</strong> (${daysCredit} días desde la entrega)`;
    } else if (status === 'DESPACHADO' && d.shippedDate) {
      dueHint = `Vence el <strong>${ui.formatDate(d.dueDate)}</strong> (${daysCredit} días desde el despacho — se recalculará al confirmar entrega)`;
    } else {
      dueHint = `Vence el <strong>${ui.formatDate(d.dueDate)}</strong> (${daysCredit} días desde la emisión — se recalculará al despachar/entregar)`;
    }
  } else if (daysCredit === 0) {
    dueHint = `Pago al contado — el estado de entrega no afecta el vencimiento`;
  } else if (d.dueDateAuto === false) {
    dueHint = `Vencimiento manual: <strong>${d.dueDate ? ui.formatDate(d.dueDate) : '—'}</strong> (no se recalcula automáticamente)`;
  }

  // Resumen del despacho (cuando ya se despachó)
  const shipmentInfo = (status === 'DESPACHADO' || status === 'ENTREGADO') ? `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;font-size:12px;margin-top:8px;">
      <div>
        <div class="kpi-label">Despachado el</div>
        <div class="td-mono td-strong" style="font-size:13px;margin-top:2px;">${ui.formatDate(d.shippedDate||'')}</div>
      </div>
      <div>
        <div class="kpi-label">Transportista</div>
        <div style="font-weight:600;font-size:13px;margin-top:2px;">${ui.escape(d.carrierName||'—')}</div>
        ${d.carrierType ? `<div class="text-muted" style="font-size:11px;">${ui.escape(d.carrierType)}</div>` : ''}
      </div>
      ${d.trackingNumber ? `<div>
        <div class="kpi-label">Guía / Tracking</div>
        <div class="td-mono td-strong" style="font-size:13px;margin-top:2px;">${ui.escape(d.trackingNumber)}</div>
      </div>` : ''}
      ${status === 'ENTREGADO' ? `<div>
        <div class="kpi-label">Entregado el</div>
        <div class="td-mono td-strong" style="font-size:13px;color:var(--success);margin-top:2px;">${ui.formatDate(d.deliveredDate||'')}</div>
      </div>` : ''}
    </div>
    ${d.deliveryNotes ? `<div style="margin-top:10px;font-size:12px;padding:8px 10px;background:var(--surface-2);border-radius:6px;color:var(--ink-2);white-space:pre-wrap;">${ui.escape(d.deliveryNotes)}</div>` : ''}
  ` : '';

  // Estilos del header según estado
  const statusStyles = {
    PENDIENTE: { bg: '#fef3c7', border: '#fcd34d', icon: '📦', color: '#78350f', label: 'Pendiente de despacho' },
    DESPACHADO: { bg: '#dbeafe', border: '#93c5fd', icon: '🚚', color: '#1e40af', label: 'Despachado · en tránsito' },
    ENTREGADO: { bg: '#dcfce7', border: '#86efac', icon: '✅', color: '#14532d', label: 'Entregado al cliente' }
  };
  const s = statusStyles[status] || statusStyles.PENDIENTE;

  // Botones según el estado y si está cancelado
  let actions = '';
  if (!cancelled && !hasNoStatus) {
    if (status === 'PENDIENTE') {
      actions = `<button class="btn btn-primary" onclick="openShipModal('${d.id}')">${ui.icon('check')||'✓'} Marcar despachado</button>`;
    } else if (status === 'DESPACHADO') {
      actions = `
        <button class="btn btn-primary" onclick="openDeliveredModal('${d.id}')">${ui.icon('check')||'✓'} Marcar entregado</button>
        <button class="btn btn-ghost btn-sm" onclick="openEditDeliveryModal('${d.id}')">Editar datos</button>
        <button class="btn btn-ghost btn-sm" onclick="confirmRevertDelivery('${d.id}')" style="color:var(--danger);">Revertir</button>
      `;
    } else if (status === 'ENTREGADO') {
      actions = `
        <button class="btn btn-ghost btn-sm" onclick="openEditDeliveryModal('${d.id}')">Editar datos</button>
        <button class="btn btn-ghost btn-sm" onclick="confirmRevertDelivery('${d.id}')" style="color:var(--danger);">Revertir</button>
      `;
    }
  } else if (hasNoStatus && !cancelled) {
    actions = `<button class="btn btn-secondary btn-sm" onclick="openShipModal('${d.id}')">Iniciar seguimiento de entrega</button>`;
  }

  if (hasNoStatus) {
    return `
      <div class="card mb-24" style="padding:14px 18px;background:var(--surface-2);border:1px dashed var(--border-strong);">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
          <div style="font-size:13px;color:var(--ink-2);">
            <strong>Estado de entrega no registrado</strong>
            <div class="text-muted" style="font-size:11px;margin-top:2px;">Pedido anterior al sistema de entregas. Podés iniciar el seguimiento ahora si necesitás.</div>
          </div>
          <div>${actions}</div>
        </div>
      </div>
    `;
  }

  return `
    <div class="card mb-24" style="padding:16px 18px;background:${s.bg};border-color:${s.border};">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:8px;">
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:18px;">${s.icon}</span>
            <strong style="color:${s.color};font-size:14px;">${s.label}</strong>
          </div>
          ${dueHint ? `<div style="font-size:12px;margin-top:6px;color:${s.color};">${dueHint}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${actions}</div>
      </div>
      ${shipmentInfo}
    </div>
  `;
}

/** Modal: marcar despachado */
function openShipModal(docId) {
  const d = db.getById(db.COLLECTIONS.salesOrders, docId);
  if (!d) return;
  const today = new Date().toISOString().slice(0,10);
  const carriers = db.getAll(db.COLLECTIONS.carriers).filter(c => c.active !== false).sort((a,b)=>(a.name||'').localeCompare(b.name||''));

  if (carriers.length === 0) {
    if (confirm('No hay transportistas configurados. ¿Querés ir al módulo de Transportistas para crear uno?')) {
      window.location.href = 'transportistas.html';
    }
    return;
  }

  ui.openModal({
    size: 'md',
    title: `Marcar como despachado · ${d.code}`,
    body: `
      <form id="ship-form" onsubmit="confirmShip(event, '${docId}')">
        <div class="form-grid form-grid-2">
          <div class="field">
            <label class="field-label">Fecha de despacho *</label>
            <input class="input" type="date" name="shippedDate" value="${today}" required>
            <div class="field-hint">Cuándo salió la mercancía de tu almacén</div>
          </div>
          <div class="field">
            <label class="field-label">Transportista *</label>
            <select class="select" name="carrierId" required>
              <option value="">— Seleccionar —</option>
              ${carriers.map(c => `<option value="${c.id}">${ui.escape(c.name)}${c.carrierType?` (${ui.escape(c.carrierType)})`:''}</option>`).join('')}
            </select>
          </div>
          <div class="field" style="grid-column:1/-1;">
            <label class="field-label">Número de guía / tracking</label>
            <input class="input" name="trackingNumber" placeholder="Opcional" style="font-family:var(--font-mono);">
          </div>
          <div class="field" style="grid-column:1/-1;">
            <label class="field-label">Notas</label>
            <textarea class="textarea" name="notes" placeholder="Observaciones del despacho..."></textarea>
          </div>
        </div>
      </form>
    `,
    footer: `
      <button class="btn btn-secondary" onclick="ui.closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="document.getElementById('ship-form').requestSubmit()">${ui.icon('check')||'✓'} Confirmar despacho</button>
    `
  });
}

function confirmShip(e, docId) {
  e.preventDefault();
  const data = ui.formData(e.target);
  if (!data.carrierId) { ui.toast('Seleccioná un transportista', 'error'); return; }
  if (!data.shippedDate) { ui.toast('La fecha de despacho es obligatoria', 'error'); return; }
  try {
    sales.markShipped(docId, {
      shippedDate: data.shippedDate,
      carrierId: data.carrierId,
      trackingNumber: data.trackingNumber,
      notes: data.notes
    });
    ui.closeModal();
    ui.toast('Pedido marcado como despachado', 'success');
    render();
  } catch (err) {
    ui.toast(err.message, 'error');
  }
}

/** Modal: marcar entregado */
function openDeliveredModal(docId) {
  const d = db.getById(db.COLLECTIONS.salesOrders, docId);
  if (!d) return;
  const today = new Date().toISOString().slice(0,10);

  ui.openModal({
    size: 'md',
    title: `Marcar como entregado · ${d.code}`,
    subtitle: 'A partir de la fecha de entrega arrancan los días de crédito',
    body: `
      <form id="deliver-form" onsubmit="confirmDelivered(event, '${docId}')">
        <div class="form-grid form-grid-2">
          <div class="field" style="grid-column:1/-1;">
            <label class="field-label">Fecha de entrega *</label>
            <input class="input" type="date" name="deliveredDate" value="${today}" min="${d.shippedDate||''}" required>
            <div class="field-hint">Cuándo el cliente recibió la mercancía. Se usará para recalcular el vencimiento.</div>
          </div>
          <div class="field" style="grid-column:1/-1;">
            <label class="field-label">Notas de la entrega</label>
            <textarea class="textarea" name="notes" placeholder="Recibió: nombre y cédula, observaciones..."></textarea>
          </div>
        </div>
      </form>
    `,
    footer: `
      <button class="btn btn-secondary" onclick="ui.closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="document.getElementById('deliver-form').requestSubmit()">${ui.icon('check')||'✓'} Confirmar entrega</button>
    `
  });
}

function confirmDelivered(e, docId) {
  e.preventDefault();
  const data = ui.formData(e.target);
  if (!data.deliveredDate) { ui.toast('La fecha es obligatoria', 'error'); return; }
  try {
    sales.markDelivered(docId, {
      deliveredDate: data.deliveredDate,
      notes: data.notes
    });
    ui.closeModal();
    ui.toast('Pedido marcado como entregado. Vencimiento recalculado.', 'success');
    render();
  } catch (err) {
    ui.toast(err.message, 'error');
  }
}

/** Modal: editar datos del despacho/entrega */
function openEditDeliveryModal(docId) {
  const d = db.getById(db.COLLECTIONS.salesOrders, docId);
  if (!d) return;
  const carriers = db.getAll(db.COLLECTIONS.carriers).filter(c => c.active !== false).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const isDelivered = d.deliveryStatus === 'ENTREGADO';

  ui.openModal({
    size: 'md',
    title: `Editar entrega · ${d.code}`,
    body: `
      <form id="edit-deliv-form" onsubmit="confirmEditDelivery(event, '${docId}')">
        <div class="form-grid form-grid-2">
          <div class="field">
            <label class="field-label">Fecha de despacho</label>
            <input class="input" type="date" name="shippedDate" value="${d.shippedDate||''}">
          </div>
          <div class="field">
            <label class="field-label">Transportista</label>
            <select class="select" name="carrierId">
              <option value="">— Sin transportista —</option>
              ${carriers.map(c => `<option value="${c.id}" ${c.id===d.carrierId?'selected':''}>${ui.escape(c.name)}${c.carrierType?` (${ui.escape(c.carrierType)})`:''}</option>`).join('')}
            </select>
          </div>
          <div class="field" style="grid-column:1/-1;">
            <label class="field-label">Número de guía / tracking</label>
            <input class="input" name="trackingNumber" value="${ui.escape(d.trackingNumber||'')}" style="font-family:var(--font-mono);">
          </div>
          ${isDelivered ? `
            <div class="field" style="grid-column:1/-1;">
              <label class="field-label">Fecha de entrega</label>
              <input class="input" type="date" name="deliveredDate" value="${d.deliveredDate||''}">
              <div class="field-hint">Si la cambiás, se recalcula el vencimiento.</div>
            </div>
          ` : ''}
          <div class="field" style="grid-column:1/-1;">
            <label class="field-label">Notas</label>
            <textarea class="textarea" name="notes">${ui.escape(d.deliveryNotes||'')}</textarea>
          </div>
        </div>
      </form>
    `,
    footer: `
      <button class="btn btn-secondary" onclick="ui.closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="document.getElementById('edit-deliv-form').requestSubmit()">${ui.icon('check')||'✓'} Guardar</button>
    `
  });
}

function confirmEditDelivery(e, docId) {
  e.preventDefault();
  const data = ui.formData(e.target);
  try {
    sales.editDelivery(docId, {
      shippedDate: data.shippedDate,
      deliveredDate: data.deliveredDate,
      carrierId: data.carrierId || null,
      trackingNumber: data.trackingNumber,
      notes: data.notes
    });
    ui.closeModal();
    ui.toast('Datos de entrega actualizados', 'success');
    render();
  } catch (err) {
    ui.toast(err.message, 'error');
  }
}

function confirmRevertDelivery(docId) {
  ui.confirm(
    'Esto borra los datos de despacho y entrega y vuelve el estado a "Pendiente". ¿Continuar?',
    () => {
      try {
        sales.revertDelivery(docId);
        ui.toast('Estado de entrega revertido', 'success');
        render();
      } catch (err) {
        ui.toast(err.message, 'error');
      }
    },
    { danger: true, confirmLabel: 'Revertir' }
  );
}

function renderDetail() {
  const d = db.getById(db.COLLECTIONS.salesOrders, selectedId);
  if (!d) { backToList(); return; }
  const sBadge = d.cancelled ? 'badge-cancelled' : (sales.STATUS[d.status]?.color || 'badge-plain');
  const sLabel = d.cancelled ? 'Anulada' : (sales.STATUS[d.status]?.label || d.status);
  const tBadge = sales.STATUS[d.type]?.color || 'badge-plain';
  const remaining = d.total - (d.paidAmount||0);
  // Cobros: incluye cobros normales (IN) y ajustes negativos (ADJUSTMENT_IN) que reducen el saldo
  const paymentsForDoc = db.query(db.COLLECTIONS.payments, p =>
    p.relatedDocId === d.id &&
    (p.direction === 'IN' || p.direction === 'ADJUSTMENT_IN' || p.direction === 'ADJUSTMENT_OUT')
  );
  const isGerencial = (typeof auth !== 'undefined' && auth.getActiveMode() === 'gerencial');

  // Tasa congelada o actual
  const isFrozen = !!d.rateAtFullPayment;
  const frozen = isFrozen ? { rate: d.rateAtFullPayment, rateType: d.rateTypeAtFullPayment } : null;

  // Helper inline dual
  const fmtDual = (amount) => {
    if (d.currency === 'VES' || d.currency === 'USD') {
      return currency.formatBoth(amount, d.currency, frozen);
    }
    return currency.format(amount, d.currency);
  };

  // Banner de tasa
  const rateBanner = isFrozen
    ? `<div style="padding:10px 14px;background:#dbeafe;border:1px solid #93c5fd;border-radius:6px;font-size:12px;color:#1e40af;margin-bottom:16px;">
        🔒 <strong>Tasa congelada:</strong> ${(d.rateAtFullPayment).toLocaleString('es-VE',{maximumFractionDigits:4})} ${d.rateTypeAtFullPayment} · al completar cobro el ${ui.formatDate(d.fullPaymentDate)}
      </div>`
    : (d.currency !== 'VES' && d.type === 'FACTURA')
      ? `<div style="padding:10px 14px;background:#fef3c7;border:1px solid #fcd34d;border-radius:6px;font-size:12px;color:#92400e;margin-bottom:16px;">
          📊 <strong>Tasa actual:</strong> BCV ${(currency.getRate('BCV_USD')?.value||0).toLocaleString('es-VE',{maximumFractionDigits:4})} · Los Bs varían cada día hasta que se cobre
        </div>`
      : '';

  // Acciones según tipo y estado
  let actions = '';

  // === BANNER Y BOTONES DE APROBACIÓN ===
  // Si el doc está pendiente o rechazado, mostramos un banner explicativo
  // y los botones Aprobar/Rechazar (solo admin/gerente).
  const _isPending = d.approvalStatus === 'PENDING';
  const _isRejected = d.approvalStatus === 'REJECTED';
  const _canApprove = auth.canApproveSales && auth.canApproveSales();
  let approvalBanner = '';
  if (_isPending) {
    approvalBanner = `<div style="padding:14px 18px;background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;">
      <div style="flex:1;min-width:240px;">
        <div style="font-weight:600;font-size:13px;color:#78350f;">⏳ Pendiente de aprobación</div>
        <div class="text-muted" style="font-size:11.5px;color:#92400e;margin-top:2px;">
          Creado por ${ui.escape(d.createdByName || d.salespersonName || '—')}. El stock está reservado.
          ${_canApprove ? 'Aprobá para descontar el stock real y generar comisión por venta.' : 'Esperá la aprobación del administrador o gerente.'}
        </div>
      </div>
      ${_canApprove ? `<div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="approveDoc('${d.id}')">✓ Aprobar</button>
        <button class="btn btn-secondary" onclick="openRejectModal('${d.id}')">✕ Rechazar</button>
      </div>` : ''}
    </div>`;
  } else if (_isRejected) {
    approvalBanner = `<div style="padding:14px 18px;background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;margin-bottom:16px;">
      <div style="font-weight:600;font-size:13px;color:#991b1b;">❌ Pedido rechazado</div>
      <div class="text-muted" style="font-size:11.5px;color:#7f1d1d;margin-top:2px;">
        Rechazado por ${ui.escape(d.rejectedByName || '—')} el ${ui.formatDate(d.rejectedAt?.slice(0,10) || '')}.
        ${d.rejectionReason ? `<br>Motivo: ${ui.escape(d.rejectionReason)}` : ''}
      </div>
    </div>`;
  }

  // Si está pendiente o rechazado, no mostramos las acciones normales (anular, NC, ND, etc.)
  // Solo se permite editar el pedido (botón ya disponible) o las acciones del banner.
  if (_isPending || _isRejected) {
    // El botón "Editar" sigue disponible (es la acción principal en este estado)
    // No agregamos más acciones a la barra; el banner ya tiene los CTAs principales.
  } else
  if (!d.cancelled) {
    if (d.type === 'PEDIDO') {
      actions += `<button class="btn btn-secondary" onclick="convertTo('${d.id}','COTIZACION')">→ Cotización</button>`;
      actions += `<button class="btn btn-secondary" onclick="convertTo('${d.id}','NOTA_ENTREGA')">→ Nota de Entrega</button>`;
      actions += `<button class="btn btn-primary" onclick="convertTo('${d.id}','FACTURA')">${ui.icon('check')} → Factura</button>`;
    } else if (d.type === 'COTIZACION') {
      actions += `<button class="btn btn-secondary" onclick="convertTo('${d.id}','NOTA_ENTREGA')">→ Nota de Entrega</button>`;
      actions += `<button class="btn btn-primary" onclick="convertTo('${d.id}','FACTURA')">${ui.icon('check')} Convertir a Factura</button>`;
    } else if (d.type === 'NOTA_ENTREGA') {
      // NE puede convertirse a Factura si el cliente decide pagar IVA
      actions += `<button class="btn btn-primary" onclick="convertTo('${d.id}','FACTURA')">${ui.icon('check')} Convertir a Factura</button>`;
      actions += `<button class="btn btn-secondary" onclick="printDoc('${d.id}')">${ui.icon('download')} Imprimir Nota</button>`;
      if (remaining > 0.01 && d.status !== 'PAID') {
        actions += `<button class="btn btn-secondary" onclick="openChangeDueDate('${d.id}')" title="Cambiar fecha de vencimiento (días de gracia)">📅 Cambiar vencimiento</button>`;
        actions += `<a href="pagos.html?doc=${d.id}" class="btn btn-primary">${ui.icon('plus')} Registrar cobro</a>`;
      }
    } else if (d.type === 'FACTURA') {
      if (!d.lotsAssigned) {
        actions += `<button class="btn btn-primary" onclick="goAssignLots('${d.id}')">${ui.icon('box')} Asignar lotes</button>`;
      }
      // Solo permitir reversión a NE si no hay pagos
      if ((d.paidAmount || 0) === 0) {
        actions += `<button class="btn btn-secondary" onclick="convertTo('${d.id}','NOTA_ENTREGA')" title="Solo si no hay pagos">↩ Revertir a Nota de Entrega</button>`;
      }
      actions += `<button class="btn btn-secondary" onclick="printDoc('${d.id}')">${ui.icon('download')} Imprimir factura</button>`;
      if (remaining > 0.01 && d.status !== 'PAID') {
        actions += `<button class="btn btn-secondary" onclick="openChangeDueDate('${d.id}')" title="Cambiar fecha de vencimiento (días de gracia)">📅 Cambiar vencimiento</button>`;
        actions += `<a href="pagos.html?doc=${d.id}" class="btn btn-primary">${ui.icon('plus')} Registrar cobro</a>`;
      }
      // Botones de NC/ND solo para admin/gerente (vendedor no puede emitirlos).
      const _canEmitNotes = !(auth.isSeller && auth.isSeller());
      // Botón de Nota de Crédito (solo facturas no totalmente acreditadas)
      if (_canEmitNotes && !d.fullyCredited) {
        actions += `<button class="btn btn-secondary" onclick="openCreditNoteForm('${d.id}')" title="Emitir nota de crédito">📝 Emitir NC</button>`;
      }
      // Botón de Nota de Débito (siempre disponible para facturas activas)
      if (_canEmitNotes) {
        actions += `<button class="btn btn-secondary" onclick="openDebitNoteForm('${d.id}')" title="Emitir nota de débito (mora, recargo, ajuste, gastos extras)">📈 Emitir ND</button>`;
      }
    }
    actions += `<button class="btn btn-danger" onclick="cancelDoc('${d.id}')">${ui.icon('x')} Anular</button>`;
  }

  const itemsTable = `<table>
    <thead><tr><th>Producto</th><th style="text-align:right;">Cantidad</th><th>Unidad</th><th style="text-align:right;">Precio</th><th style="text-align:right;">Desc</th><th>IVA</th><th style="text-align:right;">Subtotal</th></tr></thead>
    <tbody>${d.items.map((it, idx) => {
      const allocs = it.allocations || [];
      const allocText = allocs.length
        ? `<div class="text-muted" style="font-size:11px;margin-top:4px;line-height:1.5;">
            ${allocs.map(a => `<span style="display:inline-block;background:var(--accent-soft);padding:2px 6px;border-radius:4px;margin:1px 2px 1px 0;font-family:var(--font-mono);font-size:10px;">${ui.escape(a.lotCode)} (${a.quantity.toFixed(2)})</span>`).join('')}
            ${!d.cancelled && d.type !== 'COTIZACION' ? `<button class="btn btn-ghost btn-sm" onclick="changeLotsForItem('${d.id}', ${idx})" style="font-size:10px;padding:2px 6px;margin-left:4px;">Cambiar</button>` : ''}
          </div>`
        : '';
      const missing = it.missing || 0;
      const missingText = missing > 0
        ? `<div style="font-size:11px;color:var(--danger);margin-top:4px;font-weight:500;">⚠️ Faltan ${missing.toFixed(2)} ${ui.escape(it.unit||'')} (sin stock)</div>`
        : '';
      return `<tr>
        <td>
          <div class="td-strong">${ui.escape(it.formulaName||it.description)}</div>
          ${allocText}
          ${missingText}
        </td>
        <td style="text-align:right;"><span class="td-mono">${(it.quantity||0).toFixed(3)}</span></td>
        <td><span class="text-muted">${it.unit||'—'}</span></td>

function convertTo(docId, newStatus) {
  const d = db.getById(db.COLLECTIONS.salesOrders, docId);
  const labels = { COTIZACION: 'Cotización', NOTA_ENTREGA: 'Nota de Entrega', FACTURA: 'Factura' };

  let message = '';
  if (newStatus === 'FACTURA') {
    if (d.type === 'NOTA_ENTREGA') {
      message = `¿Convertir esta Nota de Entrega en Factura? Se asignará número fiscal, se calculará el IVA y entrará en el Libro de Ventas.`;
    } else {
      message = `¿Convertir a Factura? Se asignará un número fiscal de factura y de control. Después podrás asignar los lotes de PT que se entregarán.`;
    }
  } else if (newStatus === 'NOTA_ENTREGA') {
    if (d.type === 'FACTURA') {
      message = `¿Revertir a Nota de Entrega? Se quitará el IVA, el número fiscal y saldrá del Libro de Ventas. Solo es posible porque no hay pagos asociados.`;
    } else {
      message = `¿Convertir a Nota de Entrega? Se descontará inventario inmediatamente pero NO se calculará IVA ni entrará en libros fiscales.`;
    }
  } else {
    message = `¿Convertir a ${labels[newStatus]}?`;
  }

  ui.confirm(message, async () => {
    try {
      // convertTo es async: reserva el número fiscal con una transacción
      await sales.convertTo(docId, newStatus);
      ui.toast(`Convertido a ${labels[newStatus]}`, 'success');
      // Si se convierte a NE o Factura y no tiene lotes asignados, ir a asignación
      const updated = db.getById(db.COLLECTIONS.salesOrders, docId);
      if ((newStatus === 'NOTA_ENTREGA' || newStatus === 'FACTURA') && !updated.lotsAssigned) {
        view = 'assign';
        render();
      } else {
        render();
      }
    } catch (err) {
      ui.toast(err.message, 'error');
    }
  }, { confirmLabel: 'Convertir' });
}

/** Variable global para el formulario de ND */
let _ndForm = null;

/** Abre el modal para crear ND sobre una factura */
function openDebitNoteForm(invoiceId) {
  const inv = db.getById(db.COLLECTIONS.salesOrders, invoiceId);
  if (!inv) return;

  // Días de mora si la factura está vencida (para sugerir el cálculo de interés)
  const today = new Date().toISOString().slice(0,10);
  let daysOverdue = 0;
  if (inv.dueDate && inv.dueDate < today) {
    const [y1,m1,d1] = inv.dueDate.split('-').map(n=>parseInt(n,10));
    const [y2,m2,d2] = today.split('-').map(n=>parseInt(n,10));
    const a = new Date(y1, m1-1, d1).getTime();
    const b = new Date(y2, m2-1, d2).getTime();
    daysOverdue = Math.max(0, Math.round((b-a)/(1000*60*60*24)));
  }

  _ndForm = {
    invoiceId: inv.id,
    reason: 'SURCHARGE',
    mode: 'FREE_AMOUNT',
    applyIva: true,
    items: [],
    freeAmount: 0,
    freeAmountIsGross: false,
    notes: '',
    invoiceNumber: '',
    controlNumber: '',
    // Para mora
    interestRate: 12, // % anual default
    interestDays: daysOverdue,
    interestData: null,
    daysOverdueAvailable: daysOverdue
  };

  ui.openModal({
    size: 'lg',
    title: `Emitir Nota de Débito sobre ${inv.code}`,
    body: `<div id="nd-form-host"></div>`,
    footer: `<button class="btn btn-secondary" onclick="ui.closeModal();_ndForm=null;">Cancelar</button><button class="btn btn-primary" onclick="confirmDebitNote()">${ui.icon('check')||'✓'} Emitir ND</button>`
  });
  renderDebitNoteForm();
}

function renderDebitNoteForm() {
  if (!_ndForm) return;
  const f = _ndForm;
  const inv = db.getById(db.COLLECTIONS.salesOrders, f.invoiceId);
  const reasons = sales.DEBIT_NOTE_REASONS;
  const cfg = db.getById(db.COLLECTIONS.config, 'main') || {};
  const ivaRate = cfg.defaultIvaRate || 16;

  // Cálculo en vivo de totales
  let subtotal = 0, taxableBase = 0, exemptBase = 0;
  if (f.mode === 'BY_ITEMS') {
    f.items.forEach(it => {
      const sub = (parseFloat(it.quantity)||0) * (parseFloat(it.unitPrice)||0);
      subtotal += sub;
      const isExempt = !f.applyIva || !!it.exempt;
      if (isExempt) exemptBase += sub; else taxableBase += sub;
    });
  } else {
    const amt = parseFloat(f.freeAmount) || 0;
    if (f.applyIva && f.freeAmountIsGross) {
      const base = amt / (1 + ivaRate/100);
      subtotal = base; taxableBase = base;
    } else if (f.applyIva) {
      subtotal = amt; taxableBase = amt;
    } else {
      subtotal = amt; exemptBase = amt;
    }
  }
  const ivaAmount = taxableBase * (ivaRate/100);
  const total = subtotal + ivaAmount;
  const round2 = n => Math.round(n*100)/100;

  // Bloque especial para "Intereses de mora"
  const interestBlock = f.reason === 'INTEREST' ? `
    <div style="margin-top:12px;padding:12px;background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;">
      <div style="font-size:11px;font-weight:700;color:#78350f;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;">⏱️ Calculadora de interés por mora</div>
      <div class="form-grid form-grid-3" style="gap:8px;">
        <div class="field">
          <label class="field-label">Tasa anual (%)</label>
          <input class="input" type="number" min="0" step="0.01" value="${f.interestRate}" onchange="setNDInterestRate(this.value)" style="font-family:var(--font-mono);text-align:right;">
        </div>
        <div class="field">
          <label class="field-label">Días de mora</label>
          <input class="input" type="number" min="0" step="1" value="${f.interestDays}" onchange="setNDInterestDays(this.value)" style="font-family:var(--font-mono);text-align:right;">
          ${f.daysOverdueAvailable > 0 ? `<div class="field-hint" style="color:#78350f;">Vencida hace ${f.daysOverdueAvailable} días</div>` : ''}
        </div>
        <div class="field" style="display:flex;flex-direction:column;justify-content:flex-end;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="applyNDInterestCalc()" style="font-size:11px;">📊 Calcular y aplicar</button>
        </div>
      </div>
      <div style="margin-top:8px;font-size:11px;color:#78350f;">

    <div class="section-title">Motivo</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:14px;">

        <label style="display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid ${k===f.reason?'var(--accent)':'var(--border)'};border-radius:6px;cursor:pointer;background:${k===f.reason?'var(--accent-soft)':'white'};">

            <div style="font-size:10.5px;color:var(--ink-3);">IVA por defecto: ${r.defaultIva?'Sí':'Exento'}</div>
          </div>

      `).join('')}

    ${interestBlock}

    <div class="section-title" style="margin-top:14px;">Modalidad y IVA</div>

      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;opacity:0.7;"><span>Subtotal</span><span class="td-mono">${currency.format(round2(subtotal), inv.currency)}</span></div>

// Setters del form ND
function setNDReason(reason) {
  _ndForm.reason = reason;
  // Aplicar default IVA del nuevo motivo
  const r = sales.DEBIT_NOTE_REASONS[reason];
  if (r) _ndForm.applyIva = r.defaultIva;
  // Si elige INTEREST y hay días de mora, sugerir cálculo
  if (reason === 'INTEREST' && _ndForm.daysOverdueAvailable > 0) {
    _ndForm.interestDays = _ndForm.daysOverdueAvailable;
    _ndForm.mode = 'FREE_AMOUNT';
  }
  renderDebitNoteForm();
}
function setNDMode(mode) {
  _ndForm.mode = mode;
  if (mode === 'BY_ITEMS' && (!_ndForm.items || _ndForm.items.length === 0)) {
    _ndForm.items = [{ description: '', quantity: 1, unit: 'unidad', unitPrice: 0, exempt: false }];
  }
  renderDebitNoteForm();
}
function setNDApplyIva(v) { _ndForm.applyIva = !!v; renderDebitNoteForm(); }
function setNDFreeAmount(v) { _ndForm.freeAmount = parseFloat(v)||0; renderDebitNoteForm(); }
function setNDIsGross(v) { _ndForm.freeAmountIsGross = !!v; renderDebitNoteForm(); }
function setNDInterestRate(v) { _ndForm.interestRate = parseFloat(v)||0; }
function setNDInterestDays(v) { _ndForm.interestDays = parseInt(v,10)||0; }
function applyNDInterestCalc() {
  const result = sales.calculateInterest(_ndForm.invoiceId, _ndForm.interestRate, _ndForm.interestDays);
  _ndForm.freeAmount = result.interest;
  _ndForm.applyIva = false; // mora siempre exento
  _ndForm.mode = 'FREE_AMOUNT';
  _ndForm.freeAmountIsGross = false;
  _ndForm.interestData = result.data;
  ui.toast(`Interés calculado: ${result.interest.toFixed(2)} (${result.data.days} días × ${result.data.ratePercent}% anual)`, 'success', 3500);
  renderDebitNoteForm();
}
function addNDItem() {
  _ndForm.items.push({ description: '', quantity: 1, unit: 'unidad', unitPrice: 0, exempt: false });
  renderDebitNoteForm();
}
function removeNDItem(idx) {
  _ndForm.items.splice(idx, 1);
  renderDebitNoteForm();
}
function updateNDItem(idx, field, value) {
  if (!_ndForm.items[idx]) return;
  if (field === 'quantity' || field === 'unitPrice') value = parseFloat(value)||0;
  if (field === 'exempt') value = !!value;
  _ndForm.items[idx][field] = value;
  renderDebitNoteForm();
}

function confirmDebitNote() {
  if (!_ndForm) return;
  try {
    const note = sales.createDebitNote({
      invoiceId: _ndForm.invoiceId,
      reason: _ndForm.reason,
      mode: _ndForm.mode,
      applyIva: _ndForm.applyIva,
      items: _ndForm.items,
      freeAmount: _ndForm.freeAmount,
      freeAmountIsGross: _ndForm.freeAmountIsGross,
      notes: _ndForm.notes,
      invoiceNumber: _ndForm.invoiceNumber,
      controlNumber: _ndForm.controlNumber,
      interestData: _ndForm.interestData
    });
    ui.toast(`Nota de Débito ${note.code} emitida`, 'success');
    _ndForm = null;
    ui.closeModal();
    render();
  } catch (err) {
    ui.toast(err.message, 'error', 4500);
  }
}

      <tbody>${n.items.map(it => `<tr>

      </tr>`).join('')}</tbody>

  ` : `<div class="text-muted" style="padding:12px 0;font-size:13px;">Monto libre · sin detalle de productos</div>`;

  ui.openModal({
    title: `Nota de Débito ${n.code}`,
    body: `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <span class="badge ${status.color}">${status.label}</span>
        <span class="badge badge-plain">${reason.icon} ${reason.label}</span>
        <span class="badge badge-plain">${n.mode === 'BY_ITEMS' ? 'Por items' : 'Monto libre'}</span>
        <span class="badge ${n.applyIva?'badge-warning':'badge-plain'}">${n.applyIva ? `IVA ${n.ivaRate}%` : 'Exento de IVA'}</span>
      </div>

        <div><strong>Factura origen:</strong> ${n.invoiceCode}${n.invoiceNumber?` (N° ${n.invoiceNumber})`:''}</div>
        <div><strong>Cliente:</strong> ${ui.escape(n.customerName)}</div>
        <div><strong>Fecha emisión:</strong> ${ui.formatDate(n.issueDate)}</div>
        ${n.ndInvoiceNumber ? `<div><strong>N° Factura ND:</strong> ${n.ndInvoiceNumber}</div>`:''}
        ${n.ndControlNumber ? `<div><strong>N° Control:</strong> ${n.ndControlNumber}</div>`:''}
      </div>
      ${n.interestData ? `
        <div style="margin-top:10px;padding:10px;background:#fef3c7;border:1px solid #fcd34d;border-radius:6px;font-size:12px;color:#78350f;">
          <strong>⏱️ Detalle de cálculo de interés:</strong> ${n.interestData.days} días × ${n.interestData.ratePercent}% anual sobre ${currency.format(n.interestData.baseAmount, n.currency)}
        </div>
      ` : ''}
      ${itemsHtml}
      <div style="padding:12px;background:var(--surface-2);border-radius:6px;margin-top:14px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span>Subtotal</span><span class="td-mono">${currency.format(n.subtotal, n.currency)}</span></div>
        ${n.exemptBase>0 ? `<div style="display:flex;justify-content:space-between;font-size:12px;"><span>Exento</span><span class="td-mono">${currency.format(n.exemptBase, n.currency)}</span></div>` : ''}
        ${n.taxableBase>0 ? `<div style="display:flex;justify-content:space-between;font-size:12px;"><span>IVA ${n.ivaRate}%</span><span class="td-mono">${currency.format(n.ivaAmount, n.currency)}</span></div>` : ''}
        <div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border);margin-top:6px;"><span class="td-strong">Total ND</span><span class="td-mono td-strong" style="font-size:15px;">${currency.format(n.total, n.currency)}</span></div>

      ${n.status === 'CANCELLED' ? `<div style="margin-top:12px;padding:10px;background:var(--danger-soft);border-radius:6px;font-size:12px;color:var(--danger);"><strong>Anulada:</strong> ${ui.escape(n.cancellationReason || '')}</div>` : ''}
    `,
    footer: `
      <button class="btn btn-secondary" onclick="ui.closeModal()">Cerrar</button>
      <button class="btn btn-primary" onclick="printDebitNote('${n.id}')">${ui.icon('download')||'⬇'} Imprimir / PDF</button>
    `
  });
}

function cancelDebitNote(noteId) {
  const n = db.getById(db.COLLECTIONS.debitNotes, noteId);
  if (!n) return;
  ui.confirm(
    `¿Anular la Nota de Débito ${n.code}? Esta acción no se puede deshacer.`,
    () => {
      const reason = prompt('Motivo de anulación (opcional):') || '';
      try {
        sales.cancelDebitNote(noteId, reason);
        ui.toast(`Nota de Débito ${n.code} anulada`, 'success');
        render();
      } catch (err) {
        ui.toast(err.message, 'error', 5000);
      }
    },
    { danger: true, confirmLabel: 'Anular ND' }
  );
}

/**
 * Imprime/genera PDF de una Nota de Débito.
 * Mismo formato que la NC pero con acentos en ámbar/dorado para diferenciarla.
 */
function printDebitNote(noteId) {
  const n = db.getById(db.COLLECTIONS.debitNotes, noteId);
  if (!n) { ui.toast('Nota de débito no encontrada', 'error'); return; }
  const cfg = db.getById(db.COLLECTIONS.config, 'main') || {};

  const reasonInfo = sales.DEBIT_NOTE_REASONS[n.reason] || { label: n.reason, icon: '📈' };
  const invoice = n.invoiceId ? db.getById(db.COLLECTIONS.salesOrders, n.invoiceId) : null;
  const rateValue = n.rateValue || (invoice && invoice.rateValue) || (currency.getRate(cfg.defaultRateType||'BCV_USD')?.value || 0);
  const rateType = (n.rateType || (invoice && invoice.rateType) || cfg.defaultRateType || 'BCV_USD').replace('_USD','');
  const rateDate = n.rateDate || (invoice && invoice.issueDate) || n.issueDate;

  const itemsHtml = n.mode === 'BY_ITEMS' && n.items && n.items.length ? `
    <table>
      <thead><tr>
        <th>Descripción</th>
        <th class="num" style="width:90px;">Cantidad</th>
        <th style="width:80px;">Unidad</th>
        <th class="num" style="width:120px;">Precio</th>
        <th class="num" style="width:120px;">Subtotal</th>
      </tr></thead>
      <tbody>
        ${n.items.map(it => `<tr>
          <td>${escapeHtml(it.description || '—')}</td>
          <td class="num">${(it.quantity||0).toFixed(2)}</td>
          <td>${escapeHtml(it.unit||'')}</td>
          <td class="num">${formatMoney(it.unitPrice, n.currency)}</td>
          <td class="num"><strong>${formatMoney(it.subtotal, n.currency)}</strong></td>
        </tr>`).join('')}
      </tbody>
    </table>
  ` : `
    <div style="padding:24px;background:#f4f3ef;border-radius:8px;text-align:center;font-size:11pt;color:#4a4a45;margin:16px 0;">
      <strong>Nota de débito por monto libre</strong>
      <div style="font-size:9.5pt;color:#8a8a82;margin-top:4px;">Concepto: ${escapeHtml(reasonInfo.label)}${n.notes ? ' · ' + escapeHtml(n.notes) : ''}</div>
    </div>
  `;

  const invoiceOriginBox = invoice ? `
    <div style="margin:24px 0;padding:18px 22px;background:#f4f3ef;border:2px solid #1a1a18;border-radius:8px;page-break-inside:avoid;">
      <div style="font-size:9.5pt;letter-spacing:0.14em;text-transform:uppercase;color:#8a8a82;font-weight:600;margin-bottom:12px;text-align:center;">Información de la Factura Origen</div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px 32px;font-size:11pt;">
        <div><strong>Número:</strong> ${escapeHtml(invoice.invoiceNumber || invoice.code || '—')}</div>
        <div><strong>F. Emisión:</strong> ${formatDate(invoice.issueDate)}</div>
        <div><strong>Sub-Total:</strong> <span style="font-family:monospace;">${formatMoney(invoice.subtotal, invoice.currency)}</span></div>
        <div><strong>I.V.A.:</strong> <span style="font-family:monospace;">${formatMoney(invoice.ivaAmount, invoice.currency)}</span></div>
        <div><strong>Neto:</strong> <span style="font-family:monospace;font-weight:600;">${formatMoney(invoice.total, invoice.currency)}</span></div>
        ${invoice.controlNumber ? `<div><strong>N° Control:</strong> ${escapeHtml(invoice.controlNumber)}</div>` : ''}
      </div>
    </div>
  ` : '';

  // Detalle de interés (solo si aplica)
  const interestBox = n.interestData ? `
    <div style="margin:18px 0;padding:14px 18px;background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;page-break-inside:avoid;">
      <div style="font-size:10pt;font-weight:700;color:#78350f;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;">⏱️ Detalle del cálculo de interés por mora</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:10.5pt;color:#3a3a35;">

    </div>
  ` : '';

  const legalNote = (n.currency !== 'VES') ? `

function openCreditNoteForm(invoiceId) {
  const inv = db.getById(db.COLLECTIONS.salesOrders, invoiceId);
  if (!inv) return;

  _ncForm = {
    invoiceId,
    reason: 'RETURN',
    mode: 'BY_ITEMS',
    items: (inv.items || []).map((it, idx) => ({
      origIdx: idx,
      formulaId: it.formulaId,
      formulaName: it.formulaName || it.description,
      unit: it.unit,
      unitPrice: it.unitPrice,
      exempt: it.exempt,
      maxQty: it.quantity,
      quantity: 0,
      include: false,
      stockAction: 'CUARENTENA',
      originalLotId: (it.allocations && it.allocations[0]) ? it.allocations[0].lotId : null
    })),
    freeAmount: 0,
    freeAmountExempt: false,
    invoiceNumber: '',
    controlNumber: '',
    notes: '',
    moneyAction: 'REDUCE_DEBT',
    refundAccountId: '',
    refundAmount: 0
  };

  ui.openModal({
    title: `Emitir Nota de Crédito sobre ${inv.code}`,
    body: `<div id="nc-form-body"></div>`,
    footer: `<button class="btn btn-secondary" onclick="ui.closeModal();_ncForm=null;">Cancelar</button><button class="btn btn-primary" onclick="confirmCreditNote()">${ui.icon('check')} Emitir NC</button>`
  });
  renderCreditNoteForm();
}

function renderCreditNoteForm() {
  if (!_ncForm) return;
  const f = _ncForm;
  const inv = db.getById(db.COLLECTIONS.salesOrders, f.invoiceId);
  const cfg = db.getById(db.COLLECTIONS.config, 'main') || {};
  const ivaRate = inv.ivaRate || cfg.ivaRate || 16;
  const reasonsMap = sales.CREDIT_NOTE_REASONS;

  // Calcular total preview
  let subtotal = 0, taxableBase = 0, exemptBase = 0;
  if (f.mode === 'BY_ITEMS') {
    f.items.forEach(it => {
      if (!it.include || it.quantity <= 0) return;
      const sub = (parseFloat(it.quantity) || 0) * (parseFloat(it.unitPrice) || 0);
      subtotal += sub;
      if (it.exempt) exemptBase += sub;
      else taxableBase += sub;
    });
  } else {
    const amt = parseFloat(f.freeAmount) || 0;
    subtotal = amt;
    if (f.freeAmountExempt) exemptBase = amt;
    else taxableBase = amt;
  }
  const ivaAmt = Math.round(taxableBase * ivaRate / 100 * 100) / 100;
  const total = Math.round((subtotal + ivaAmt) * 100) / 100;

  // Validar contra el restante de la factura
  const alreadyCredited = sales.getCreditedAmount(f.invoiceId);
  const maxCreditable = inv.total - alreadyCredited;
  const exceeds = total > maxCreditable + 0.01;

  // Cuentas para reembolso
  const accounts = db.getAll(db.COLLECTIONS.bankAccounts).filter(a => a.active !== false);

  const isPaid = (inv.paidAmount || 0) > 0;

  const html = `

      </div>
    </div>

    ${f.mode === 'BY_ITEMS' ? renderNCItemsTable(f, inv) : renderNCFreeAmount(f, inv)}

    <!-- Resumen -->
    <div style="padding:14px;background:var(--surface-2);border-radius:8px;margin:16px 0;" id="nc-summary-section">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span class="text-muted">Subtotal</span><span class="td-mono">${currency.format(subtotal, inv.currency)}</span></div>
      ${exemptBase > 0 ? `<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span class="text-muted">Exento</span><span class="td-mono">${currency.format(exemptBase, inv.currency)}</span></div>` : ''}
      ${taxableBase > 0 ? `<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span class="text-muted">IVA ${ivaRate}%</span><span class="td-mono">${currency.format(ivaAmt, inv.currency)}</span></div>` : ''}
      <div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border);margin-top:6px;"><span class="td-strong">Total NC</span><span class="td-mono td-strong" style="font-size:15px;color:${exceeds?'var(--danger)':'var(--accent-ink)'};">${currency.format(total, inv.currency)}</span></div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:6px;">Máximo acreditable: ${currency.format(maxCreditable, inv.currency)} ${alreadyCredited>0?`(ya hay ${currency.format(alreadyCredited, inv.currency)} acreditado)`:''}</div>
      ${exceeds ? `<div style="margin-top:8px;padding:8px;background:#fee2e2;border-radius:4px;color:#991b1b;font-size:12px;">⚠️ El total excede lo acreditable</div>` : ''}
    </div>

    <!-- Manejo del dinero -->
    <div style="padding:14px;background:#dbeafe;border-radius:8px;margin-bottom:16px;">
      <div style="font-weight:600;font-size:13px;color:#1e40af;margin-bottom:10px;">💰 Manejo del dinero</div>
      ${isPaid ? `<p class="text-muted" style="font-size:11px;margin-bottom:10px;">Esta factura tiene cobros registrados. Elegí cómo manejar la NC:</p>` : `<p class="text-muted" style="font-size:11px;margin-bottom:10px;">Esta factura no tiene cobros registrados. La NC simplemente reducirá la deuda pendiente.</p>`}
      <div style="display:flex;flex-direction:column;gap:8px;">
        <label style="display:flex;align-items:start;gap:10px;padding:10px;background:white;border-radius:6px;cursor:pointer;${f.moneyAction==='REDUCE_DEBT'?'border:1px solid var(--accent);':'border:1px solid transparent;'}">

          </div>
        </label>
        <label style="display:flex;align-items:start;gap:10px;padding:10px;background:white;border-radius:6px;cursor:pointer;${f.moneyAction==='CREDIT_BALANCE'?'border:1px solid var(--accent);':'border:1px solid transparent;'}">
          <input type="radio" name="ncMoney" ${f.moneyAction==='CREDIT_BALANCE'?'checked':''} onchange="setNCMoney('CREDIT_BALANCE')" style="margin-top:2px;">
          <div>
            <div style="font-weight:600;font-size:12.5px;">💰 Saldo a favor del cliente</div>
            <div class="text-muted" style="font-size:11px;">Queda como crédito que el cliente puede aplicar en próximas facturas. No mueve plata ahora.</div>
          </div>

        <label style="display:flex;align-items:start;gap:10px;padding:10px;background:white;border-radius:6px;cursor:pointer;${f.moneyAction==='REFUND'?'border:1px solid var(--accent);':'border:1px solid transparent;'}">

function setNCReason(reason) { _ncForm.reason = reason; renderCreditNoteForm(); }

function toggleNCItem(idx) {
  const it = _ncForm.items[idx];

  if (!it.include) it.quantity = 0;

}
function updateNCItemQty(idx, val) {
  // SIN render: actualiza en memoria. Solo actualiza el resumen total.
  const it = _ncForm.items[idx];
  const num = Math.min(parseFloat(val) || 0, it.maxQty);

}
function updateNCItemStockAction(idx, action) {
  _ncForm.items[idx].stockAction = action;
}

/** Recalcula el subtotal/total de la NC y actualiza solo esos elementos del DOM */
function refreshNCSummary() {
  if (!_ncForm) return;
  const f = _ncForm;
  const inv = db.getById(db.COLLECTIONS.salesOrders, f.invoiceId);
  if (!inv) return;
  const cfg = db.getById(db.COLLECTIONS.config, 'main') || {};
  const ivaRate = inv.ivaRate || cfg.ivaRate || 16;

  let subtotal = 0, taxableBase = 0, exemptBase = 0;
  if (f.mode === 'BY_ITEMS') {
    f.items.forEach(it => {
      if (!it.include || it.quantity <= 0) return;
      const sub = (parseFloat(it.quantity) || 0) * (parseFloat(it.unitPrice) || 0);
      subtotal += sub;
      if (it.exempt) exemptBase += sub;
      else taxableBase += sub;
    });
  } else {
    const amt = parseFloat(f.freeAmount) || 0;
    subtotal = amt;
    if (f.freeAmountExempt) exemptBase = amt;
    else taxableBase = amt;
  }
  const ivaAmt = Math.round(taxableBase * ivaRate / 100 * 100) / 100;
  const total = Math.round((subtotal + ivaAmt) * 100) / 100;

  // Actualizar elementos puntuales del DOM (no re-render)
  const summary = document.getElementById('nc-summary-section');
  if (!summary) return;

  const alreadyCredited = sales.getCreditedAmount(f.invoiceId);
  const maxCreditable = inv.total - alreadyCredited;
  const exceeds = total > maxCreditable + 0.01;

  summary.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span class="text-muted">Subtotal</span><span class="td-mono">${currency.format(subtotal, inv.currency)}</span></div>
    ${exemptBase > 0 ? `<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span class="text-muted">Exento</span><span class="td-mono">${currency.format(exemptBase, inv.currency)}</span></div>` : ''}
    ${taxableBase > 0 ? `<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span class="text-muted">IVA ${ivaRate}%</span><span class="td-mono">${currency.format(ivaAmt, inv.currency)}</span></div>` : ''}
    <div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border);margin-top:6px;"><span class="td-strong">Total NC</span><span class="td-mono td-strong" style="font-size:15px;color:${exceeds?'var(--danger)':'var(--accent-ink)'};">${currency.format(total, inv.currency)}</span></div>
    <div style="font-size:11px;color:var(--ink-3);margin-top:6px;">Máximo acreditable: ${currency.format(maxCreditable, inv.currency)} ${alreadyCredited>0?`(ya hay ${currency.format(alreadyCredited, inv.currency)} acreditado)`:''}</div>
    ${exceeds ? `<div style="margin-top:8px;padding:8px;background:#fee2e2;border-radius:4px;color:#991b1b;font-size:12px;">⚠️ El total excede lo acreditable</div>` : ''}
  `;
}

function confirmCreditNote() {
  const f = _ncForm;
  if (!f) return;

  const args = {
    invoiceId: f.invoiceId,
    reason: f.reason,
    mode: f.mode,
    invoiceNumber: f.invoiceNumber,
    controlNumber: f.controlNumber,
    notes: f.notes,
    moneyAction: f.moneyAction,
    refundAccountId: f.refundAccountId,
    refundAmount: f.refundAmount
  };

  if (f.mode === 'BY_ITEMS') {
    const includedItems = f.items.filter(i => i.include && i.quantity > 0).map(i => ({
      formulaId: i.formulaId,
      formulaName: i.formulaName,
      quantity: i.quantity,
      unit: i.unit,
      unitPrice: i.unitPrice,
      exempt: i.exempt,
      stockAction: f.reason === 'RETURN' ? i.stockAction : null,
      originalLotId: i.originalLotId
    }));
    if (!includedItems.length) {
      ui.toast('Selecciona al menos un ítem', 'error');
      return;
    }
    args.items = includedItems;
  } else {
    args.freeAmount = f.freeAmount;
    args.freeAmountExempt = f.freeAmountExempt;
  }

  if (f.moneyAction === 'REFUND') {
    if (!f.refundAccountId) { ui.toast('Selecciona una cuenta para el reembolso', 'error'); return; }
    if (!f.refundAmount || f.refundAmount <= 0) { ui.toast('Indica el monto del reembolso', 'error'); return; }
  }

  try {
    const note = sales.createCreditNote(args);
    ui.closeModal();
    _ncForm = null;
    ui.toast(`NC ${note.code} emitida correctamente`, 'success');
    render();
  } catch (err) {
    ui.toast(err.message, 'error');
  }
}

 * tiene saldo pendiente (la UI filtra el botón).

 */
function openChangeDueDate(docId) {
  const d = db.getById(db.COLLECTIONS.salesOrders, docId);
  if (!d) { ui.toast('Documento no encontrado', 'error'); return; }

  ui.openModal({
    size: 'sm',
    title: 'Cambiar fecha de vencimiento',
    subtitle: `${d.code}${d.invoiceNumber ? ' · N° '+d.invoiceNumber : ''} · ${d.customerName || ''}`,
    body: `
      <div style="font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-bottom:14px;">
        Cambiá la fecha de vencimiento para darle días de gracia al cliente
        sin modificar la fecha de emisión original. La nueva fecha queda fija
        (no se recalcula automáticamente).
      </div>

      <div class="form-grid form-grid-2" style="margin-bottom:14px;">
        <div class="field">
          <label class="field-label">Vencimiento actual</label>
          <div class="input" style="background:var(--surface-2);font-family:var(--font-mono);">${ui.formatDate(currentDue)}</div>
        </div>
        <div class="field">
          <label class="field-label">Fecha de emisión</label>
          <div class="input" style="background:var(--surface-2);font-family:var(--font-mono);">${ui.formatDate(d.issueDate)}</div>
        </div>
      </div>

      <form id="dd-form" onsubmit="confirmChangeDueDate(event, '${docId}')">
        <div class="field" style="margin-bottom:14px;">
          <label class="field-label">Nueva fecha de vencimiento *</label>
          <input class="input" type="date" name="newDueDate" required value="${currentDue}"
                 oninput="document.getElementById('dd-add-days').value='';">
          <div class="field-hint">O usá el atajo abajo para sumar días al vencimiento actual.</div>
        </div>
        <div class="field" style="margin-bottom:14px;">
          <label class="field-label">Atajo: sumar días de gracia</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <input id="dd-add-days" class="input" type="number" min="1" max="365" placeholder="ej. 15"
                   style="max-width:120px;text-align:right;font-family:var(--font-mono);"
                   oninput="ddRecalc('${currentDue}', this.value)">
            <span style="font-size:12px;color:var(--ink-3);">días de gracia → suma al vencimiento actual</span>
          </div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label class="field-label">Motivo del cambio (opcional)</label>
          <input class="input" name="reason" placeholder="ej. acordado por WhatsApp, problema de cobranza...">
          <div class="field-hint">Queda registrado en las notas del documento para trazabilidad.</div>
        </div>
      </form>
    `,
    footer: `
      <button class="btn btn-secondary" onclick="ui.closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="document.getElementById('dd-form').requestSubmit()">${ui.icon('check')||'✓'} Guardar nueva fecha</button>
    `
  });
}

/** Recalcula el input de fecha al cambiar el shortcut de "sumar días" */
function ddRecalc(currentDueIso, daysVal) {
  const n = parseInt(daysVal, 10);
  if (isNaN(n) || n < 1) return;
  const [y, m, d] = currentDueIso.split('-').map(x => parseInt(x, 10));
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + n);
  const newIso = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const dateInput = document.querySelector('#dd-form input[name="newDueDate"]');
  if (dateInput) dateInput.value = newIso;
}

/** Guarda la nueva fecha de vencimiento y registra el cambio en las notas. */
function confirmChangeDueDate(e, docId) {
  e.preventDefault();
  const data = ui.formData(e.target);
  if (!data.newDueDate) { ui.toast('Falta la nueva fecha', 'error'); return; }

  const d = db.getById(db.COLLECTIONS.salesOrders, docId);
  if (!d) { ui.toast('Documento no encontrado', 'error'); return; }

  const oldDue = d.dueDate || '—';
  const newDue = data.newDueDate;
  if (oldDue === newDue) { ui.toast('La fecha no cambió', 'info'); ui.closeModal(); return; }

  // Validación: no permitir vencimiento anterior a la emisión
  if (d.issueDate && newDue < d.issueDate) {
    ui.toast('El vencimiento no puede ser anterior a la fecha de emisión', 'error', 4000);
    return;
  }

  // Aplicar cambio
  d.dueDate = newDue;
  d.dueDateAuto = false;  // marca para que sales._recalcDueDate no la toque

  // Registrar el cambio en las notas con timestamp y motivo
  const stamp = new Date().toISOString().slice(0, 16).replace('T', ' ');
  const reason = (data.reason || '').trim();
  const logLine = `[${stamp}] Vencimiento cambiado de ${oldDue} a ${newDue}${reason ? ' · Motivo: ' + reason : ''}`;
  d.notes = d.notes ? (d.notes + '\n' + logLine) : logLine;

  db.save(db.COLLECTIONS.salesOrders, d);
  ui.closeModal();
  ui.toast(`✓ Vencimiento actualizado a ${ui.formatDate(newDue)}`, 'success');
  // Si estamos en la vista de detalle, refrescamos
  if (typeof render === 'function') render();
}
